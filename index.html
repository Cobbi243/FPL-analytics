// DATA FETCHING

function getCustomProxy() {
  try { return localStorage.getItem('custom-proxy') || ''; } catch { return ''; }
}

async function fetchWithProxy(url) {
  const custom = getCustomProxy();
  const proxies = [...PROXIES];
  if (custom) {
    const base = custom.includes('?url=') || custom.endsWith('=') ? custom : (custom.replace(/\/$/, '') + '/?url=');
    proxies.unshift({ url: (u) => base + encodeURIComponent(u), type: 'raw' });
  }
  let lastErr;
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy.url(url), { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      let text = await res.text();
      // Some proxies wrap the payload in { contents: "..." }
      if (proxy.type === 'wrapped') {
        const wrapper = JSON.parse(text);
        text = wrapper.contents;
      }
      const trimmed = (text || '').trim();
      // Reject HTML error pages — only accept real JSON
      if (!trimmed.startsWith('{') && !trimmed.startsWith('[')) {
        throw new Error('Проксі віддав не JSON (ймовірно HTML-помилку)');
      }
      return JSON.parse(trimmed);
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('Усі проксі не відповідають');
}

// Швидкий шлях: дані з нашого бекенду (спільний серверний кеш).
// Якщо бекенд недоступний — фолбек на проксі-ланцюжок.
async function fetchFromBackend(apiPath) {
  const res = await fetch(`${BACKEND_BASE}${apiPath}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Backend HTTP ${res.status}`);
  return res.json();
}

async function loadFPLData(forceRefresh = false) {
  if (!forceRefresh) {
    try {
      const cached = await storage.get('fpl-cache');
      if (cached) {
        const parsed = JSON.parse(cached.value);
        if (Date.now() - parsed.ts < CACHE_TTL) {
          return { ...parsed.data, fromCache: true, cachedAt: parsed.ts };
        }
      }
    } catch (e) {}
  }

  let bootstrap, fixtures;
  try {
    [bootstrap, fixtures] = await Promise.all([
      fetchFromBackend('/api/bootstrap'),
      fetchFromBackend('/api/fixtures'),
    ]);
  } catch (e) {
    // Бекенд лежить — старий шлях через проксі
    [bootstrap, fixtures] = await Promise.all([
      fetchWithProxy(`${FPL_API}/bootstrap-static/`),
      fetchWithProxy(`${FPL_API}/fixtures/`),
    ]);
  }

  const data = { bootstrap, fixtures };
  try { await storage.set('fpl-cache', JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
  return { ...data, fromCache: false, cachedAt: Date.now() };
}

// Завантаження реальної команди користувача за FPL ID (entry id)
async function loadMyTeam(entryId, fallbackGW) {
  const [entry, history] = await Promise.all([
    fetchWithProxy(`${FPL_API}/entry/${entryId}/`),
    fetchWithProxy(`${FPL_API}/entry/${entryId}/history/`),
  ]);
  // Останній тур, у якому команда реально грала
  const played = (history.current || []).filter(h => h.points !== null && h.points !== undefined);
  const picksGW = played.length ? played[played.length - 1].event : fallbackGW;
  let picks = null;
  try {
    picks = await fetchWithProxy(`${FPL_API}/entry/${entryId}/event/${picksGW}/picks/`);
  } catch (e) { /* picks можуть бути недоступні — не критично */ }
  return { entry, history, picks, picksGW };
}

// ============================================================
// ANALYTICS
// ============================================================
function getCurrentGW(events) {
  const current = events.find(e => e.is_current);
  if (current && !current.finished) return current.id;
  const next = events.find(e => e.is_next);
  if (next) return next.id;
  const lastFinished = [...events].reverse().find(e => e.finished);
  return lastFinished ? lastFinished.id : 1;
}

function getNextFixtures(teamId, fixtures, fromGW, count = 5) {
  return fixtures
    .filter(f => !f.finished && f.event !== null && f.event >= fromGW && (f.team_h === teamId || f.team_a === teamId))
    .sort((a, b) => a.event - b.event)
    .slice(0, count)
    .map(f => ({
      gw: f.event,
      isHome: f.team_h === teamId,
      opponent: f.team_h === teamId ? f.team_a : f.team_h,
      difficulty: f.team_h === teamId ? f.team_h_difficulty : f.team_a_difficulty,
      kickoff: f.kickoff_time,
    }));
}

function availabilityFactor(player) {
  if (player.status === 'a') return 1.0;
  if (player.status === 'd') return (player.chance_of_playing_next_round ?? 50) / 100;
  if (player.status === 'i' || player.status === 's' || player.status === 'u') return 0.05;
  if (player.chance_of_playing_next_round !== null) return player.chance_of_playing_next_round / 100;
  return 1.0;
}

const AVG_STRENGTH = 1150; // середня сила команд АПЛ у шкалі FPL (~1000-1400)

function predictPlayerPoints(player, teamsMap, fixtures, fromGW, gwsAhead = 1, weights) {
  const w = weights || { form: 1.0, fdr: 0.5, value: 0.0, minutes: 1.0 };
  const nextFixtures = getNextFixtures(player.team, fixtures, fromGW, gwsAhead);
  if (nextFixtures.length === 0) {
    return { total: 0, perGW: 0, fixtures: [], breakdown: { form: 0, fdr: 0, mins: 0, avail: 0 } };
  }

  const mins = player.minutes || 0;
  const form = parseFloat(player.form) || 0;
  const ppg = parseFloat(player.points_per_game) || 0;
  const avail = availabilityFactor(player);

  // Скільки матчів зіграла КОМАНДА (для оцінки ротації гравця)
  const rounds = Math.max(1, fixtures.filter(f => f.finished && (f.team_h === player.team || f.team_a === player.team)).length);
  const starts = Math.min(player.starts || 0, rounds);
  // Виходи з лавки: оцінка з "зайвих" хвилин (старт ≈ 84 хв, камео ≈ 25 хв)
  const cameos = Math.max(0, Math.min(rounds - starts, Math.round((mins - 84 * starts) / 25)));
  const p60 = Math.min(1, starts / rounds);
  const pCameo = Math.min(1 - p60, cameos / rounds);
  const expMins = mins / rounds; // очікувані хвилини на матч команди

  const minutesFactor = w.minutes > 0
    ? (mins > 1000 ? 1.0 : mins > 500 ? 0.85 : mins > 200 ? 0.7 : 0.5)
    : 1.0;

  // Показники на 90 хвилин
  const per90 = (v) => mins > 0 ? (parseFloat(v) || 0) / (mins / 90) : 0;
  const xG90 = per90(player.expected_goals);
  const xA90 = per90(player.expected_assists);
  const xGC90 = per90(player.expected_goals_conceded);

  // "Інші очки" (бонуси, сейви, DefCon, мінуси за картки/пропущені) —
  // залишок реальних очок після голів/асистів/сухарів/виходів
  const appearanceCum = 2 * starts + cameos;
  const explained = (player.goals_scored || 0) * GOAL_VALUE[player.element_type]
    + (player.assists || 0) * 3
    + (player.clean_sheets || 0) * CS_VALUE[player.element_type]
    + appearanceCum;
  const other90 = mins > 0
    ? Math.max(-1, Math.min(3, ((player.total_points || 0) - explained) / (mins / 90)))
    : 0;

  // Вага нової моделі росте з вибіркою: 0 хвилин -> стара формула, 450+ -> нова
  const blendNew = Math.min(1, mins / 450);
  // Сила коригування на суперника керується слайдером FDR (0.5 = стандарт)
  const adjScale = Math.min(2, w.fdr / 0.5);

  let total = 0;
  const detailedFixtures = nextFixtures.map(f => {
    const opp = teamsMap[f.opponent];
    const oppDef = opp ? (f.isHome ? opp.strength_defence_away : opp.strength_defence_home) || AVG_STRENGTH : AVG_STRENGTH;
    const oppAtt = opp ? (f.isHome ? opp.strength_attack_away : opp.strength_attack_home) || AVG_STRENGTH : AVG_STRENGTH;
    const attackAdj = 1 + (AVG_STRENGTH / oppDef - 1) * adjScale;
    const concedeAdj = 1 + (oppAtt / AVG_STRENGTH - 1) * adjScale;

    const appearancePts = 2 * p60 + 1 * pCameo;
    const attackPts = (xG90 * GOAL_VALUE[player.element_type] + xA90 * 3) * (expMins / 90) * attackAdj;
    const csPts = p60 * Math.exp(-(xGC90 * concedeAdj)) * CS_VALUE[player.element_type];
    const otherPts = other90 * (expMins / 90);
    const homeBonus = f.isHome ? 0.2 : 0;
    const newScore = (appearancePts + attackPts + csPts + otherPts + homeBonus) * avail;

    // Стара формула (форма/PPG + FDR) — для змішування і як база для новачків
    const oldBase = (form * 0.7 + ppg * 0.3) * w.form;
    const oldScore = Math.max(0, (oldBase + (3 - f.difficulty) * w.fdr + (f.isHome ? 0.3 : 0)) * minutesFactor * avail);

    const formBoost = 1 + Math.max(-0.15, Math.min(0.15, (form - ppg) * 0.03 * w.form));
    const fixtureScore = Math.max(0, blendNew * newScore * formBoost + (1 - blendNew) * oldScore);

    total += fixtureScore;
    return { ...f, score: fixtureScore };
  });

  return {
    total,
    perGW: total / nextFixtures.length,
    fixtures: detailedFixtures,
    breakdown: { form, avail, mins: minutesFactor, count: nextFixtures.length, xG90: +xG90.toFixed(2), xA90: +xA90.toFixed(2), blendNew: +blendNew.toFixed(2) },
  };
}

function valueScore(player) {
  const cost = player.now_cost / 10;
  return cost > 0 ? player.total_points / cost : 0;
}

function differentialBoost(player) {
  const sel = parseFloat(player.selected_by_percent) || 0;
  if (sel >= 15) return 1.0;
  return 1.0 + (15 - sel) * 0.02;
}

// ============================================================
// OPTIMIZER
// ============================================================
function optimizeSquad(players, teamsMap, fixtures, fromGW, options = {}) {
  const {
    budget = 1000, maxPerTeam = 3, horizon = 5,
    weights = { form: 1.0, fdr: 0.5, value: 0.0, minutes: 1.0 },
    excluded = new Set(), locked = new Set(),
    seasonEnded = false,
  } = options;

  const scored = players
    .filter(p => !excluded.has(p.id))
    .map(p => {
      let score;
      if (seasonEnded) {
        // Retrospective: weight total season points heavily, plus form for late-season risers
        const form = parseFloat(p.form) || 0;
        score = (p.total_points || 0) * 1.0 + form * 5;
      } else {
        const pred = predictPlayerPoints(p, teamsMap, fixtures, fromGW, horizon, weights);
        score = pred.total;
      }
      return { ...p, predScore: score, predPerGW: score / Math.max(1, horizon) };
    })
    .filter(p => p.predScore > 0 || locked.has(p.id));

  const byPos = { 1: [], 2: [], 3: [], 4: [] };
  scored.forEach(p => byPos[p.element_type].push(p));
  Object.keys(byPos).forEach(pos => byPos[pos].sort((a, b) => b.predScore - a.predScore));

  const squad = [];
  const teamCount = {};
  let remainingBudget = budget;
  const posFilled = { 1: 0, 2: 0, 3: 0, 4: 0 };

  const lockedPlayers = scored.filter(p => locked.has(p.id));
  for (const p of lockedPlayers) {
    if (posFilled[p.element_type] >= POSITION_QUOTAS[p.element_type]) continue;
    if ((teamCount[p.team] || 0) >= maxPerTeam) continue;
    if (remainingBudget - p.now_cost < 0) continue;
    squad.push(p);
    teamCount[p.team] = (teamCount[p.team] || 0) + 1;
    remainingBudget -= p.now_cost;
    posFilled[p.element_type]++;
  }

  const minPrices = { 1: 40, 2: 40, 3: 45, 4: 45 };
  const fillOrder = [4, 3, 2, 1];

  for (const pos of fillOrder) {
    const need = POSITION_QUOTAS[pos] - posFilled[pos];
    if (need <= 0) continue;

    for (let slotIdx = 0; slotIdx < need; slotIdx++) {
      let reserved = 0;
      fillOrder.forEach(otherPos => {
        if (otherPos === pos) {
          reserved += (need - slotIdx - 1) * minPrices[pos];
        } else {
          const otherNeed = POSITION_QUOTAS[otherPos] - posFilled[otherPos];
          reserved += otherNeed * minPrices[otherPos];
        }
      });
      const availForThis = remainingBudget - reserved;

      const candidate = byPos[pos].find(p =>
        !squad.find(s => s.id === p.id) &&
        p.now_cost <= availForThis &&
        (teamCount[p.team] || 0) < maxPerTeam
      );

      if (candidate) {
        squad.push(candidate);
        teamCount[candidate.team] = (teamCount[candidate.team] || 0) + 1;
        remainingBudget -= candidate.now_cost;
        posFilled[pos]++;
      } else {
        const fallback = byPos[pos].find(p =>
          !squad.find(s => s.id === p.id) &&
          p.now_cost <= remainingBudget &&
          (teamCount[p.team] || 0) < maxPerTeam
        );
        if (fallback) {
          squad.push(fallback);
          teamCount[fallback.team] = (teamCount[fallback.team] || 0) + 1;
          remainingBudget -= fallback.now_cost;
          posFilled[pos]++;
        }
      }
    }
  }

  const totalCost = squad.reduce((s, p) => s + p.now_cost, 0);
  const valid = squad.length === 15 && totalCost <= budget;

  const formations = [
    [1, 3, 4, 3], [1, 3, 5, 2], [1, 4, 4, 2], [1, 4, 3, 3], [1, 4, 5, 1], [1, 5, 3, 2], [1, 5, 4, 1]
  ];
  let bestXI = null;
  let bestXIScore = -Infinity;
  for (const f of formations) {
    const sortedByPos = { 1: [], 2: [], 3: [], 4: [] };
    squad.forEach(p => sortedByPos[p.element_type].push(p));
    Object.keys(sortedByPos).forEach(pos => sortedByPos[pos].sort((a, b) => b.predScore - a.predScore));
    if (sortedByPos[1].length < f[0] || sortedByPos[2].length < f[1] || sortedByPos[3].length < f[2] || sortedByPos[4].length < f[3]) continue;
    const xi = [
      ...sortedByPos[1].slice(0, f[0]),
      ...sortedByPos[2].slice(0, f[1]),
      ...sortedByPos[3].slice(0, f[2]),
      ...sortedByPos[4].slice(0, f[3]),
    ];
    const score = xi.reduce((s, p) => s + p.predScore, 0);
    if (score > bestXIScore) {
      bestXIScore = score;
      bestXI = { players: xi, formation: f };
    }
  }

  const captain = bestXI ? [...bestXI.players].sort((a, b) => b.predScore - a.predScore)[0] : null;
  const vice = bestXI ? [...bestXI.players].sort((a, b) => b.predScore - a.predScore)[1] : null;

  return {
    squad,
    startingXI: bestXI?.players || [],
    formation: bestXI?.formation || null,
    bench: squad.filter(p => !bestXI?.players.find(x => x.id === p.id)),
    captain, vice, totalCost, valid,
    predictedTotal: bestXIScore,
  };
}

function DashboardView({ players, teams, fixtures, currentGW, weights, seasonEnded, onPlayerClick }) {
  const teamsMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);

  // Live season — predictions for next GW
  const enrichedLive = useMemo(() => {
    if (seasonEnded) return [];
    return players
      .filter(p => p.status !== 'u' && parseFloat(p.form) > 0)
      .map(p => {
        const pred1 = predictPlayerPoints(p, teamsMap, fixtures, currentGW, 1, weights);
        const pred5 = predictPlayerPoints(p, teamsMap, fixtures, currentGW, 5, weights);
        return { ...p, team: teamsMap[p.team], predNext: pred1.total, pred5: pred5.total, value: valueScore(p) };
      });
  }, [players, teamsMap, fixtures, currentGW, weights, seasonEnded]);

  // Season-ended — retrospective on total points and form
  const enrichedSeason = useMemo(() => {
    return players
      .filter(p => p.total_points > 0 || parseFloat(p.form) > 0)
      .map(p => ({ ...p, team: teamsMap[p.team], value: valueScore(p) }));
  }, [players, teamsMap]);

  // === SEASON ENDED VIEW ===
  if (seasonEnded) {
    const topScorers = [...enrichedSeason].sort((a, b) => b.total_points - a.total_points).slice(0, 6);
    const topValue = [...enrichedSeason].filter(p => p.total_points > 50).sort((a, b) => b.value - a.value).slice(0, 6);
    const inForm = [...enrichedSeason].sort((a, b) => parseFloat(b.form) - parseFloat(a.form)).slice(0, 6);
    const differentials = [...enrichedSeason]
      .filter(p => parseFloat(p.selected_by_percent) < 10 && p.total_points > 100)
      .sort((a, b) => b.total_points - a.total_points)
      .slice(0, 6);
    const star = topScorers[0];

    return (
      <div className="space-y-8">
        {star && (
          <section>
            <div className="flex items-center gap-2 mb-3 text-stone-400 text-sm uppercase tracking-wider" style={{ fontFamily: 'DM Sans, sans-serif' }}>
              <Icon name="star" size={14} /> Гравець сезону
            </div>
            <button onClick={() => onPlayerClick(star)} className="w-full text-left relative overflow-hidden rounded-2xl border border-lime-500/20 bg-gradient-to-br from-stone-900 via-stone-900 to-lime-950/40 p-6 md:p-8 hover:border-lime-500/40 transition-all group">
              <div className="absolute top-0 right-0 w-64 h-64 bg-lime-500/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 group-hover:bg-lime-500/10 transition-all" />
              <div className="relative grid md:grid-cols-3 gap-6 items-center">
                <div className="md:col-span-2">
                  <div className="flex items-baseline gap-3 flex-wrap">
                    <h2 className="text-4xl md:text-5xl tracking-tight" style={{ fontFamily: 'Fraunces, serif', fontWeight: 500 }}>
                      {star.first_name} {star.second_name}
                    </h2>
                    <div className="text-stone-400 text-sm">{star.team?.name} · {POSITIONS_UA[star.element_type]}</div>
                  </div>
                  <p className="text-stone-300 mt-3 text-sm md:text-base leading-relaxed" style={{ fontFamily: 'DM Sans, sans-serif' }}>
                    Топ-бомбардир сезону 2025/26 за версією FPL. {star.total_points} очок, {star.goals_scored} голів, {star.assists} асистів. Сезон завершено — побачимось у серпні на старті нового!
                  </p>
                </div>
                <div className="grid grid-cols-3 md:grid-cols-1 gap-3">
                  <Stat label="Очки" value={star.total_points} accent />
                  <Stat label="Голи" value={star.goals_scored} />
                  <Stat label="Асисти" value={star.assists} />
                </div>
              </div>
            </button>

        )}

            </div>

        </div>

        <div className="grid md:grid-cols-2 gap-6">
          <Section icon={<Icon name="trending" size={14} />} title="Топ-бомбардири сезону" subtitle="за загальною кількістю очок">

          </div>
          <div className="text-xs text-stone-500 mb-4 italic">Курований список безкоштовних якісних ресурсів. Думки експертів — паралельно з твоїм аналізом.</div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
            {EXPERT_SOURCES.map(src => (
              <a key={src.url} href={src.url} target="_blank" rel="noopener noreferrer" className="block p-3 rounded-lg border border-stone-800 bg-stone-900/40 hover:border-lime-500/30 hover:bg-stone-900/80 transition-all">
                <div className="font-semibold text-sm flex items-center gap-1.5" style={{ fontFamily: 'DM Sans, sans-serif' }}>

            ))}

  const valuePicks = [...enrichedLive].filter(p => p.now_cost <= 65).sort((a, b) => b.value - a.value).slice(0, 6);
  const differentials = [...enrichedLive].filter(p => parseFloat(p.selected_by_percent) < 10 && p.predNext > 3)

  const captainOfWeek = captainPicks[0];

            <div className="absolute top-0 right-0 w-64 h-64 bg-lime-500/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 group-hover:bg-lime-500/10 transition-all" />

function PlayersView({ players, teams, fixtures, currentGW, weights, onPlayerClick }) {
  const teamsMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);
  const [search, setSearch] = useState('');
  const [posFilter, setPosFilter] = useState('all');
  const [teamFilter, setTeamFilter] = useState('all');
  const [maxCost, setMaxCost] = useState(150);
  const [sortBy, setSortBy] = useState('predNext');
  const [sortDir, setSortDir] = useState('desc');
  const [onlyAvailable, setOnlyAvailable] = useState(false);

  const enriched = useMemo(() => players.map(p => {
    const pred = predictPlayerPoints(p, teamsMap, fixtures, currentGW, 5, weights);
    return {
      ...p, team: teamsMap[p.team],
      predNext: predictPlayerPoints(p, teamsMap, fixtures, currentGW, 1, weights).total,
      pred5: pred.total, value: valueScore(p),
    };
  }), [players, teamsMap, fixtures, currentGW, weights]);

  const filtered = useMemo(() => {
    let res = enriched;
    if (search) {
      const q = search.toLowerCase();
      res = res.filter(p => `${p.first_name} ${p.second_name} ${p.web_name}`.toLowerCase().includes(q) ||
        p.team?.name?.toLowerCase().includes(q) || p.team?.short_name?.toLowerCase().includes(q));
    }
    if (posFilter !== 'all') res = res.filter(p => p.element_type === Number(posFilter));
    if (teamFilter !== 'all') res = res.filter(p => p.team?.id === Number(teamFilter));
    res = res.filter(p => p.now_cost <= maxCost);
    if (onlyAvailable) res = res.filter(p => p.status === 'a');
    res = [...res].sort((a, b) => {
      let av, bv;
      switch (sortBy) {
        case 'predNext': av = a.predNext; bv = b.predNext; break;
        case 'pred5': av = a.pred5; bv = b.pred5; break;
        case 'form': av = parseFloat(a.form); bv = parseFloat(b.form); break;
        case 'totalPoints': av = a.total_points; bv = b.total_points; break;
        case 'cost': av = a.now_cost; bv = b.now_cost; break;
        case 'value': av = a.value; bv = b.value; break;
        case 'ownership': av = parseFloat(a.selected_by_percent); bv = parseFloat(b.selected_by_percent); break;
        case 'xG': av = parseFloat(a.expected_goals); bv = parseFloat(b.expected_goals); break;
        case 'xA': av = parseFloat(a.expected_assists); bv = parseFloat(b.expected_assists); break;
        case 'xGC': av = parseFloat(a.expected_goals_conceded); bv = parseFloat(b.expected_goals_conceded); break;
        default: av = 0; bv = 0;
      }
      return sortDir === 'desc' ? bv - av : av - bv;
    });
    return res.slice(0, 100);
  }, [enriched, search, posFilter, teamFilter, maxCost, sortBy, sortDir, onlyAvailable]);

  const toggleSort = (key) => {
    if (sortBy === key) setSortDir(sortDir === 'desc' ? 'asc' : 'desc');
    else { setSortBy(key); setSortDir('desc'); }
  };

  const SortHeader = ({ k, children, align = 'left' }) => (
    <th className={`px-2 py-2 text-[11px] uppercase tracking-wider text-stone-500 font-medium cursor-pointer hover:text-stone-200 transition-colors select-none ${align === 'right' ? 'text-right' : 'text-left'}`} onClick={() => toggleSort(k)}>
      <span className="inline-flex items-center gap-1">
        {children}
        {sortBy === k && (sortDir === 'desc' ? <Icon name="chevdown" size={11} /> : <Icon name="chevup" size={11} />)}
      </span>
    </th>
  );

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        <div className="relative flex-1 min-w-[200px]">
          <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500" />
          <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Пошук гравця або команди..."
            className="w-full bg-stone-900 border border-stone-800 rounded-lg pl-9 pr-3 py-2 text-sm placeholder:text-stone-600 focus:outline-none focus:border-lime-500/50"
            style={{ fontFamily: 'DM Sans, sans-serif' }} />
        </div>
        <select value={posFilter} onChange={e => setPosFilter(e.target.value)} className="bg-stone-900 border border-stone-800 rounded-lg px-3 py-2 text-sm">
          <option value="all">Усі позиції</option>
          <option value="1">Воротарі</option>
          <option value="2">Захисники</option>
          <option value="3">Півзахисники</option>
          <option value="4">Нападники</option>
        </select>
        <select value={teamFilter} onChange={e => setTeamFilter(e.target.value)} className="bg-stone-900 border border-stone-800 rounded-lg px-3 py-2 text-sm max-w-[180px]">
          <option value="all">Усі команди</option>
          {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <label className="flex items-center gap-2 text-sm text-stone-300 cursor-pointer">
          <input type="checkbox" checked={onlyAvailable} onChange={e => setOnlyAvailable(e.target.checked)} className="accent-lime-500" />
          Тільки доступні
        </label>
        <div className="flex items-center gap-2 text-sm text-stone-400">
          Макс. ціна:
          <input type="range" min="40" max="150" value={maxCost} onChange={e => setMaxCost(Number(e.target.value))} className="accent-lime-500 w-24" />
          <span className="font-mono text-stone-200 w-14">£{(maxCost/10).toFixed(1)}m</span>
        </div>
      </div>

      <div className="overflow-x-auto rounded-xl border border-stone-800">
        <table className="w-full text-sm">
          <thead className="bg-stone-900/70">
            <tr>
              <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider text-stone-500 font-medium">Гравець</th>
              <SortHeader k="cost" align="right">Ціна</SortHeader>
              <SortHeader k="predNext" align="right">След.</SortHeader>
              <SortHeader k="pred5" align="right">5 турів</SortHeader>
              <SortHeader k="form" align="right">Форма</SortHeader>
              <SortHeader k="totalPoints" align="right">Очки</SortHeader>
              <SortHeader k="value" align="right">Цінн.</SortHeader>
              <SortHeader k="ownership" align="right">%</SortHeader>
              <SortHeader k="xG" align="right">xG</SortHeader>
              <SortHeader k="xA" align="right">xA</SortHeader>
              <SortHeader k="xGC" align="right">xGC</SortHeader>
            </tr>
          </thead>
          <tbody>
            {filtered.map((p, i) => (
              <tr key={p.id} onClick={() => onPlayerClick(p)} className={`border-t border-stone-900 hover:bg-stone-900/40 cursor-pointer transition-colors ${i % 2 === 0 ? 'bg-stone-950/30' : ''}`}>
                <td className="px-2 py-2">
                  <div className="flex items-center gap-2">
                    <StatusDot player={p} />
                    <div>
                      <div className="font-medium" style={{ fontFamily: 'DM Sans, sans-serif' }}>{p.web_name}</div>
                      <div className="text-[10px] text-stone-500">{p.team?.short_name} · {POSITIONS_UA[p.element_type]}</div>
                    </div>
                  </div>
                </td>
                <td className="px-2 py-2 text-right font-mono text-stone-200">£{(p.now_cost/10).toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-lime-400">{p.predNext.toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-300">{p.pred5.toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-300">{p.form}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-300">{p.total_points}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-400">{p.value.toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-500">{p.selected_by_percent}%</td>
                <td className="px-2 py-2 text-right font-mono text-stone-400">{p.expected_goals}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-400">{p.expected_assists}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-400">{p.expected_goals_conceded}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {filtered.length === 0 && <div className="p-8 text-center text-stone-500 text-sm">Нічого не знайдено за цими фільтрами</div>}
      </div>
      <div className="text-xs text-stone-600 text-center">Показано перші 100 результатів</div>
    </div>
  );
}

// FIXTURES VIEW
// ============================================================
function FixturesView({ teams, fixtures, currentGW }) {
  const teamsMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);

  const { gwList, mode } = useMemo(() => {
    const upcoming = [...new Set(fixtures.filter(f => !f.finished && f.event !== null).map(f => f.event))].sort((a, b) => a - b);
    if (upcoming.length > 0) return { gwList: upcoming.slice(0, 8), mode: 'upcoming' };
    // Season over — show last 8 finished GWs as a results timeline
    const finished = [...new Set(fixtures.filter(f => f.finished && f.event !== null).map(f => f.event))].sort((a, b) => a - b);
    return { gwList: finished.slice(-8), mode: 'results' };
  }, [fixtures]);

  const matrix = useMemo(() => {
    return teams.map(team => {
      const row = gwList.map(gw => {
        const fix = fixtures.find(f => f.event === gw && (f.team_h === team.id || f.team_a === team.id));
        if (!fix) return null;
        const isHome = fix.team_h === team.id;
        const opponent = teamsMap[isHome ? fix.team_a : fix.team_h];
        const myScore = isHome ? fix.team_h_score : fix.team_a_score;
        const oppScore = isHome ? fix.team_a_score : fix.team_h_score;
        let result = null;
        if (fix.finished && myScore !== null) result = myScore > oppScore ? 'w' : myScore < oppScore ? 'l' : 'd';
        return { gw, isHome, opp: opponent, fdr: isHome ? fix.team_h_difficulty : fix.team_a_difficulty, finished: fix.finished, myScore, oppScore, result, kickoff: fix.kickoff_time };
      });
      const avgFDR = row.filter(Boolean).reduce((s, f) => s + f.fdr, 0) / Math.max(1, row.filter(Boolean).length);
      return { team, fixtures: row, avgFDR };
    }).sort((a, b) => mode === 'upcoming' ? a.avgFDR - b.avgFDR : a.team.name.localeCompare(b.team.name));
  }, [teams, teamsMap, fixtures, gwList, mode]);

  if (gwList.length === 0) {
    return <EmptyState message="Немає даних про матчі" />;
  }

  const resultColor = { w: '#1a5d3a', l: '#7f1d1d', d: '#57534e' };

  return (
    <div className="space-y-4">
      <div className="text-sm text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>
        {mode === 'upcoming'
          ? <>Складність наступних {gwList.length} турів (fixture ticker). Команди відсортовано від найлегшого календаря до найскладнішого — шукай блоки зелених клітинок для гарних відрізків.</>
          : <>Сезон завершено — показую результати останніх {gwList.length} турів. Календар майбутніх матчів з'явиться на старті нового сезону в серпні.</>}
      </div>
      <div className="flex items-center gap-3 text-xs flex-wrap">
        <span className="text-stone-500">{mode === 'upcoming' ? 'Складність:' : 'Колір клітинки — складність суперника. Рамка — результат:'}</span>
        {mode === 'upcoming'
          ? [1, 2, 3, 4, 5].map(f => (
              <div key={f} className="flex items-center gap-1.5">
                <div className="w-3 h-3 rounded" style={{ backgroundColor: FDR_COLORS[f].bg }} />
                <span className="text-stone-400">{FDR_COLORS[f].label}</span>
              </div>
            ))
          : [['w','перемога','#22c55e'],['d','нічия','#a8a29e'],['l','поразка','#ef4444']].map(([k,l,c]) => (
              <div key={k} className="flex items-center gap-1.5">
                <div className="w-3 h-3 rounded border-2" style={{ borderColor: c }} />
                <span className="text-stone-400">{l}</span>
              </div>
            ))}
      </div>
      <div className="overflow-x-auto rounded-xl border border-stone-800">
        <table className="w-full">
          <thead>
            <tr className="bg-stone-900/70">
              <th className="px-3 py-2 text-left text-[11px] uppercase tracking-wider text-stone-500 font-medium sticky left-0 bg-stone-900/70">Команда</th>
              {mode === 'upcoming' && <th className="px-2 py-2 text-center text-[11px] uppercase tracking-wider text-stone-500 font-medium">Сер.</th>}
              {gwList.map(gw => <th key={gw} className="px-1 py-2 text-center text-[11px] uppercase tracking-wider text-stone-500 font-medium min-w-[52px]">GW{gw}</th>)}
            </tr>
          </thead>
          <tbody>
            {matrix.map(({ team, fixtures: row, avgFDR }) => (
              <tr key={team.id} className="border-t border-stone-900 hover:bg-stone-900/30">
                <td className="px-3 py-2 font-medium sticky left-0 bg-stone-950" style={{ fontFamily: 'DM Sans, sans-serif' }}>
                  <span className="text-stone-200">{team.name}</span>
                </td>
                {mode === 'upcoming' && <td className="px-2 py-2 text-center font-mono text-stone-400 text-sm">{avgFDR.toFixed(1)}</td>}
                {row.map((f, i) => (
                  <td key={i} className="px-1 py-1.5">
                    {!f ? <div className="text-center text-stone-700">—</div> :
                      f.finished && f.myScore !== null ? (
                        <div className="text-[10px] font-mono px-1.5 py-1 rounded text-center leading-tight border-2" style={{ backgroundColor: FDR_COLORS[f.fdr].bg, borderColor: resultColor[f.result] || 'transparent', color: FDR_COLORS[f.fdr].text }}>
                          <div className="font-semibold">{f.opp?.short_name}{f.isHome ? '' : ''}</div>
                          <div className="opacity-90">{f.myScore}-{f.oppScore}</div>
                        </div>
                      ) : <FDRBadge fdr={f.fdr} isHome={f.isHome} oppShort={f.opp?.short_name} />}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function CaptainView({ players, teams, fixtures, currentGW, weights, seasonEnded, onPlayerClick }) {
  const teamsMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);

  if (seasonEnded) {
    return (
      <div className="space-y-4">
        <EmptyState message="Сезон 2025/26 завершено — немає кого вибирати капітаном на наступний тур. Повертайся в кінці липня, на старт нового сезону FPL 🏆" />
        <div className="text-center text-xs text-stone-600">А поки що — глянь топ-бомбардирів сезону на вкладці «Дашборд»</div>
      </div>
    );
  }
  const candidates = useMemo(() => {
    return players
      .filter(p => p.status === 'a' || p.status === 'd')
      .filter(p => p.element_type === 3 || p.element_type === 4 || (p.element_type === 2 && parseFloat(p.form) > 5))
      .map(p => {
        const pred = predictPlayerPoints(p, teamsMap, fixtures, currentGW, 1, weights);
        return { ...p, team: teamsMap[p.team], pred: pred.total, predFixtures: pred.fixtures, breakdown: pred.breakdown };
      })
      .filter(p => p.pred > 0)
      .sort((a, b) => b.pred - a.pred)
      .slice(0, 12);
  }, [players, teamsMap, fixtures, currentGW, weights]);

  if (candidates.length === 0) {
    return <EmptyState message="Немає даних для прогнозу на наступний тур (можливо, сезон завершено)" />;

  return (
    <div className="space-y-4">

      <div className="grid gap-3">

          <button key={p.id} onClick={() => onPlayerClick(p)}

              i < 3 ? 'border-stone-700 bg-stone-900/40' : 'border-stone-800 bg-stone-900/20'
            } hover:border-lime-500/40`}>
            <div className="grid grid-cols-12 gap-3 items-center">
              <div className="col-span-1 text-center">
                {i === 0 ? <Icon name="crown" size={24} className="text-lime-400 mx-auto" /> : <div className="text-2xl font-mono text-stone-600" style={{ fontFamily: 'Fraunces, serif' }}>{i + 1}</div>}
              </div>
              <div className="col-span-5 md:col-span-4">
                <div className="flex items-center gap-2">
                  <StatusDot player={p} />
                  <div className="font-semibold" style={{ fontFamily: 'DM Sans, sans-serif' }}>{p.first_name} {p.second_name}</div>
                </div>
                <div className="text-xs text-stone-400 mt-1">{p.team?.name} · {POSITIONS_UA[p.element_type]} · £{(p.now_cost/10).toFixed(1)}m</div>
              </div>
              <div className="col-span-3 md:col-span-3 flex gap-1.5 flex-wrap">
                {p.predFixtures.map((f, fi) => <FDRBadge key={fi} fdr={f.difficulty} isHome={f.isHome} oppShort={teamsMap[f.opponent]?.short_name} />)}
              </div>
              <div className="col-span-3 md:col-span-4 grid grid-cols-3 gap-2 text-right">
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-stone-600">Очк.</div>
                  <div className="font-mono text-lg text-lime-400">{p.pred.toFixed(1)}</div>
                </div>
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-stone-600">Форма</div>
                  <div className="font-mono text-lg text-stone-200">{p.form}</div>
                </div>
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-stone-600">Власн.</div>
                  <div className="font-mono text-lg text-stone-400">{p.selected_by_percent}%</div>
                </div>
              </div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ============================================================
function OptimizerView({ players, teams, fixtures, currentGW, weights, seasonEnded, onPlayerClick }) {
  const teamsMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);
  const [horizon, setHorizon] = useState(5);
  const [maxBudget, setMaxBudget] = useState(1000);
  const [maxPerTeam, setMaxPerTeam] = useState(3);
  const [result, setResult] = useState(null);
  const [computing, setComputing] = useState(false);

  const run = useCallback(() => {
    setComputing(true);
    setTimeout(() => {
      const r = optimizeSquad(players, teamsMap, fixtures, currentGW, {
        budget: maxBudget, maxPerTeam, horizon, weights, seasonEnded,
        excluded: new Set(), locked: new Set(),
      });
      setResult(r);
      setComputing(false);
    }, 50);
  }, [players, teamsMap, fixtures, currentGW, maxBudget, maxPerTeam, horizon, weights, seasonEnded]);

  useEffect(() => { run(); }, []); // eslint-disable-line

  const PlayerSlot = ({ p, isCaptain, isVice, isBench }) => (
    <button onClick={() => onPlayerClick(p)} className={`relative w-full p-2.5 rounded-lg border text-left transition-all ${

function PlayerModal({ player, team, fixtures, currentGW, teams, onClose }) {
  const [history, setHistory] = useState(null);
  const [loadingHist, setLoadingHist] = useState(false);
  const [snapshots, setSnapshots] = useState(null);
  const [mediaItems, setMediaItems] = useState(null);

  useEffect(() => {
    if (!player) return;
    let cancelled = false;
    setHistory(null);
    setLoadingHist(true);
    setSnapshots(null);
    setMediaItems(null);
    fetchWithProxy(`${FPL_API}/element-summary/${player.id}/`)
      .then(d => { if (!cancelled) setHistory((d.history || []).filter(h => h.minutes > 0)); })
      .catch(() => { if (!cancelled) setHistory([]); })
      .finally(() => { if (!cancelled) setLoadingHist(false); });
    loadPlayerSnapshots(player.id)
      .then(s => { if (!cancelled) setSnapshots(s); })
      .catch(() => { if (!cancelled) setSnapshots([]); });
    loadPlayerFeed(player.id)
      .then(m => { if (!cancelled) setMediaItems(m); })
      .catch(() => { if (!cancelled) setMediaItems([]); });
    return () => { cancelled = true; };
  }, [player]);

  if (!player) return null;
  const teamsMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const nextFixtures = getNextFixtures(player.team, fixtures, currentGW, 6);

  const chartData = (history || []).map(h => ({
    gw: h.round,
    actual: h.total_points,
    xp: expectedPointsForGW(player.element_type, h),
  })).sort((a, b) => a.gw - b.gw);

  const totalActual = chartData.reduce((s, d) => s + d.actual, 0);
  const totalXP = chartData.reduce((s, d) => s + d.xp, 0);
  const overPerf = totalActual - totalXP;

  // SVG line chart
  const W = 600, H = 220, pad = 30;
  let chart = null;
  if (chartData.length > 0) {
    const gws = chartData.map(d => d.gw);
    const minGW = Math.min(...gws), maxGW = Math.max(...gws);
    const yMax = Math.max(6, ...chartData.map(d => Math.max(d.actual, d.xp))) + 1;
    const sx = gw => pad + ((gw - minGW) / Math.max(1, maxGW - minGW)) * (W - pad * 2);
    const sy = v => H - pad - (v / yMax) * (H - pad * 2);
    const actualPts = chartData.map(d => `${sx(d.gw)},${sy(d.actual)}`).join(' ');
    const xpPts = chartData.map(d => `${sx(d.gw)},${sy(d.xp)}`).join(' ');
    chart = (
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
        {[0, 2, 4, 6, 8, 10].filter(v => v <= yMax).map(v => (
          <g key={v}>
            <line x1={pad} y1={sy(v)} x2={W - pad} y2={sy(v)} stroke="#292524" strokeWidth="1" />
            <text x={pad - 6} y={sy(v) + 3} fill="#78716c" fontSize="10" textAnchor="end" fontFamily="monospace">{v}</text>
          </g>
        ))}
        {chartData.map(d => (
          <text key={d.gw} x={sx(d.gw)} y={H - pad + 14} fill="#78716c" fontSize="9" textAnchor="middle" fontFamily="monospace">{d.gw}</text>
        ))}
        <polyline points={xpPts} fill="none" stroke="#fbbf24" strokeWidth="2" strokeDasharray="4 3" opacity="0.85" />
        <polyline points={actualPts} fill="none" stroke="#6fcd9c" strokeWidth="2.5" />
        {chartData.map(d => <circle key={'a'+d.gw} cx={sx(d.gw)} cy={sy(d.actual)} r="3" fill="#6fcd9c" />)}
        {chartData.map(d => <circle key={'x'+d.gw} cx={sx(d.gw)} cy={sy(d.xp)} r="2.5" fill="#fbbf24" />)}
      </svg>
    );
  }

  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-4 bg-black/70 backdrop-blur-sm" onClick={onClose}>

            <div className="text-3xl tracking-tight" style={{ fontFamily: 'Fraunces, serif', fontWeight: 500 }}>
              {player.first_name} {player.second_name}

            <div className="text-sm text-stone-400 mt-1 flex items-center gap-2">
              <StatusDot player={player} />
              {team?.name} · {POSITIONS_UA[player.element_type]} · £{(player.now_cost/10).toFixed(1)}m

          </div>
          <button onClick={onClose} className="p-2 hover:bg-stone-800 rounded-lg transition-colors"><Icon name="x" size={18} /></button>
        </div>
        <div className="p-5 space-y-5">
          {player.news && (
            <div className="p-3 rounded-lg border border-yellow-500/30 bg-yellow-950/20 text-yellow-300 text-sm flex gap-2">
              <Icon name="alert" size={16} className="flex-shrink-0 mt-0.5" />
              <div>{player.news}</div>
            </div>
          )}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
            <Stat label="Очки" value={player.total_points} />

            <Stat label="Власн." value={`${player.selected_by_percent}%`} />
            <Stat label="ICT" value={player.ict_index} />

          {/* Actual vs expected points chart */}
          <div>

                <span className="flex items-center gap-1 text-lime-400"><span className="w-3 h-0.5 bg-lime-400 inline-block" />факт</span>
                <span className="flex items-center gap-1 text-amber-400"><span className="w-3 h-0.5 bg-amber-400 inline-block" style={{ borderTop: '2px dashed' }} />xP</span>
              </div>
            </div>
            <div className="rounded-lg border border-stone-800 bg-stone-900/30 p-3">
              {loadingHist ? (
                <div className="text-stone-500 text-sm py-8 text-center">Завантажую історію матчів...</div>
              ) : chartData.length === 0 ? (
                <div className="text-stone-500 text-sm py-8 text-center">Немає зіграних матчів (можливо, сезон ще не почався)</div>
              ) : (
                <>
                  {chart}
                  <div className="mt-2 text-xs text-stone-400 text-center">
                    Факт: <span className="font-mono text-lime-400">{totalActual}</span> · Очікувано: <span className="font-mono text-amber-400">{totalXP.toFixed(1)}</span> ·{' '}
                    {overPerf >= 0
                      ? <span className="text-lime-400">перформить на {overPerf.toFixed(1)} вище рівня (реалізація/везіння)</span>
                      : <span className="text-orange-400">недобирає {Math.abs(overPerf).toFixed(1)} (потенціал зростання)</span>}
                  </div>
                </>
              )}
            </div>
          </div>

          {/* Price & ownership dynamics (from our backend DB) */}
          <div>
            <div className="flex items-baseline justify-between mb-2">
              <div className="text-sm uppercase tracking-wider text-stone-500" style={{ fontFamily: 'DM Sans, sans-serif' }}>Динаміка ціни і власності</div>
              {snapshots && snapshots.length >= 2 && (
                <div className="flex items-center gap-3 text-[11px]">
                  <span className="flex items-center gap-1 text-lime-400"><span className="w-3 h-0.5 bg-lime-400 inline-block" />ціна</span>
                  <span className="flex items-center gap-1 text-sky-400"><span className="w-3 h-0.5 bg-sky-400 inline-block" />власність</span>
                </div>
              )}
            </div>
            <div className="rounded-lg border border-stone-800 bg-stone-900/30 p-3">
              {snapshots === null ? (
                <div className="text-stone-500 text-sm py-4 text-center">Завантажую з сервера...</div>
              ) : snapshots.length < 2 ? (
                <div className="text-stone-500 text-sm py-4 text-center">Історія накопичується — сервер збирає знімки щогодини. Графік з'явиться, коли буде кілька точок зміни.</div>
              ) : (() => {
                const W = 600, H = 160, pad = 34;
                const t0 = snapshots[0].ts, t1 = snapshots[snapshots.length - 1].ts || t0 + 1;
                const sxT = ts => pad + ((ts - t0) / Math.max(1, t1 - t0)) * (W - pad * 2);
                const prices = snapshots.map(s => s.price / 10);
                const owns = snapshots.map(s => s.ownership);
                const pMin = Math.min(...prices) - 0.1, pMax = Math.max(...prices) + 0.1;
                const oMin = Math.min(...owns), oMax = Math.max(...owns) + 0.01;
                const syP = v => H - pad - ((v - pMin) / Math.max(0.001, pMax - pMin)) * (H - pad * 2);
                const syO = v => H - pad - ((v - oMin) / Math.max(0.001, oMax - oMin)) * (H - pad * 2);
                const pricePts = snapshots.map(s => `${sxT(s.ts)},${syP(s.price / 10)}`).join(' ');
                const ownPts = snapshots.map(s => `${sxT(s.ts)},${syO(s.ownership)}`).join(' ');
                return (
                  <>
                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
                      <polyline points={ownPts} fill="none" stroke="#38bdf8" strokeWidth="2" opacity="0.8" />
                      <polyline points={pricePts} fill="none" stroke="#6fcd9c" strokeWidth="2.5" />
                      <text x={pad} y={H - 8} fill="#78716c" fontSize="9" fontFamily="monospace">{new Date(t0).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' })}</text>
                      <text x={W - pad} y={H - 8} fill="#78716c" fontSize="9" fontFamily="monospace" textAnchor="end">{new Date(t1).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' })}</text>

                    </div>
                  </>
                );
              })()}

          <div>

// ============================================================
// EXPECTED POINTS (xP) — used in player history chart
// ============================================================
// Compute expected points for a single gameweek from underlying stats.
function expectedPointsForGW(pos, gw) {
  // gw: { minutes, expected_goals, expected_assists, expected_goals_conceded }
  const mins = gw.minutes || 0;
  if (mins === 0) return 0;
  const xG = parseFloat(gw.expected_goals) || 0;
  const xA = parseFloat(gw.expected_assists) || 0;
  const xGC = parseFloat(gw.expected_goals_conceded) || 0;
  const goalVal = pos === 4 ? 4 : pos === 3 ? 5 : 6; // FWD/MID/DEF-GK
  const csVal = (pos === 1 || pos === 2) ? 4 : pos === 3 ? 1 : 0;
  const appearance = mins >= 60 ? 2 : 1;
  // Clean sheet probability ~ Poisson P(0 conceded) = e^-xGC (only counts if played 60+)
  const csProb = mins >= 60 ? Math.exp(-xGC) : 0;
  // GK/DEF also lose ~0.33 pt per 2 goals conceded (approx)
  const concededPenalty = (pos === 1 || pos === 2) ? -(xGC / 2) * 0.5 : 0;
  return appearance + xG * goalVal + xA * 3 + csProb * csVal + concededPenalty;
}

  const [teamFilter, setTeamFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [minMinutes, setMinMinutes] = useState(900);
  const [hoveredId, setHoveredId] = useState(null);

  const data = useMemo(() => {
    const q = search.trim().toLowerCase();
    return players
      .filter(p => p.minutes >= minMinutes)
      .filter(p => posFilter === 'all' || p.element_type === Number(posFilter))
      .filter(p => teamFilter === 'all' || p.team === Number(teamFilter))
      .filter(p => !q || `${p.first_name} ${p.second_name} ${p.web_name}`.toLowerCase().includes(q))
      .map(p => {
        const ppg = parseFloat(p.points_per_game) || 0;
        const form = parseFloat(p.form) || 0;
        // Stability score: rewards high baseline AND recent form being close to/above it
        const stability = (ppg * 0.55 + form * 0.45);
        return { ...p, team: teamsMap[p.team], ppg, form, stability };
      })
      .sort((a, b) => b.stability - a.stability);
  }, [players, teamsMap, posFilter, teamFilter, search, minMinutes]);

  const top = data.slice(0, 40);
  // Scatter bounds
  const maxPPG = Math.max(6, ...top.map(p => p.ppg)) + 0.5;
  const maxForm = Math.max(6, ...top.map(p => p.form)) + 0.5;
  const W = 720, H = 460, pad = 44;
  const sx = (v) => pad + (v / maxPPG) * (W - pad * 2);
  const sy = (v) => H - pad - (v / maxForm) * (H - pad * 2);
  const posColor = { 1: '#fbbf24', 2: '#34d399', 3: '#60a5fa', 4: '#f87171' };

  // Spread overlapping points (jitter) so each is clickable, and de-clutter labels
  const positioned = (() => {
    const groups = {};
    top.forEach(p => {
      const bx = sx(p.ppg), by = sy(p.form);
      const key = `${Math.round(bx / 12)}_${Math.round(by / 12)}`;
      (groups[key] = groups[key] || []).push({ p, bx, by });
    });
    const out = [];
    Object.values(groups).forEach(members => {
      const n = members.length;
      members.forEach((m, i) => {
        let x = m.bx, y = m.by;
        if (n > 1) {
          const r = 9 + (n > 3 ? (n - 3) * 2 : 0);
          const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
          x = m.bx + Math.cos(ang) * r;
          y = m.by + Math.sin(ang) * r;
        }
        out.push({ p: m.p, x, y });
      });
    });
    // Greedy label placement in stability order — skip labels that would collide
    const placed = [];
    top.forEach(tp => {
      const o = out.find(q => q.p.id === tp.id);
      if (!o) return;
      const w = o.p.web_name.length * 5.5 + 6;
      const box = { x1: o.x + 7, y1: o.y - 6, x2: o.x + 7 + w, y2: o.y + 6 };
      const hit = placed.some(b => !(box.x2 < b.x1 || box.x1 > b.x2 || box.y2 < b.y1 || box.y1 > b.y2));
      o.showLabel = !hit;
      if (!hit) placed.push(box);
    });
    return out;
  })();

  return (
    <div className="space-y-5">
      <div className="text-sm text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>
        Хто набирає <strong className="text-stone-200">стабільно</strong>. Вісь X — очки за матч за сезон, вісь Y — форма (останні матчі). Гравці у верхньому-правому куті — стабільно сильні. Вище діагоналі — на ході, нижче — спад. Наведи на крапку, щоб побачити ім'я; клікни — щоб відкрити картку.
      </div>

      <div className="flex flex-wrap items-center gap-3">
        <div className="relative flex-1 min-w-[180px]">
          <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500" />
          <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Пошук за прізвищем..."
            className="w-full bg-stone-900 border border-stone-800 rounded-lg pl-9 pr-3 py-2 text-sm placeholder:text-stone-600 focus:outline-none focus:border-lime-500/50"
            style={{ fontFamily: 'DM Sans, sans-serif' }} />
        </div>
        <select value={posFilter} onChange={e => setPosFilter(e.target.value)} className="bg-stone-900 border border-stone-800 rounded-lg px-3 py-2 text-sm">
          <option value="all">Усі позиції</option>
          <option value="1">Воротарі</option>
          <option value="2">Захисники</option>
          <option value="3">Півзахисники</option>
          <option value="4">Нападники</option>
        </select>
        <select value={teamFilter} onChange={e => setTeamFilter(e.target.value)} className="bg-stone-900 border border-stone-800 rounded-lg px-3 py-2 text-sm max-w-[180px]">
          <option value="all">Усі клуби</option>
          {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <div className="flex items-center gap-2 text-sm text-stone-400">
          Мін. хвилин:
          <input type="range" min="0" max="3000" step="100" value={minMinutes} onChange={e => setMinMinutes(Number(e.target.value))} className="accent-lime-500 w-32" />
          <span className="font-mono text-stone-200 w-12">{minMinutes}</span>
        </div>
        <div className="flex items-center gap-3 text-xs text-stone-400 ml-auto">
          {[[1,'ВРТ'],[2,'ЗАХ'],[3,'ПІВ'],[4,'НАП']].map(([k,l]) => (
            <span key={k} className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: posColor[k] }} />{l}</span>
          ))}
        </div>
      </div>

      {/* Scatter diagram */}
      <div className="rounded-xl border border-stone-800 bg-stone-900/30 p-4 overflow-x-auto">
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ minWidth: 600 }}>
          {/* grid */}
          {[1,2,3,4,5,6,7].map(v => v <= maxPPG && (
            <g key={'x'+v}>
              <line x1={sx(v)} y1={pad} x2={sx(v)} y2={H-pad} stroke="#292524" strokeWidth="1" />
              <text x={sx(v)} y={H-pad+16} fill="#78716c" fontSize="11" textAnchor="middle" fontFamily="monospace">{v}</text>
            </g>
          ))}
          {[1,2,3,4,5,6,7].map(v => v <= maxForm && (
            <g key={'y'+v}>
              <line x1={pad} y1={sy(v)} x2={W-pad} y2={sy(v)} stroke="#292524" strokeWidth="1" />
              <text x={pad-8} y={sy(v)+4} fill="#78716c" fontSize="11" textAnchor="end" fontFamily="monospace">{v}</text>
            </g>
          ))}
          {/* diagonal (form == ppg) */}
          <line x1={sx(0)} y1={sy(0)} x2={sx(Math.min(maxPPG,maxForm))} y2={sy(Math.min(maxPPG,maxForm))} stroke="#44403c" strokeWidth="1" strokeDasharray="4 4" />
          {/* axis labels */}
          <text x={W/2} y={H-6} fill="#a8a29e" fontSize="12" textAnchor="middle" fontFamily="sans-serif">Очки за матч (сезон) →</text>
          <text x={14} y={H/2} fill="#a8a29e" fontSize="12" textAnchor="middle" fontFamily="sans-serif" transform={`rotate(-90 14 ${H/2})`}>Форма (останні матчі) →</text>
          {/* points (jittered; hovered one rendered on top) */}
          {positioned.map(o => {
            if (o.p.id === hoveredId) return null;
            return (
              <g key={o.p.id} className="cursor-pointer" onClick={() => onPlayerClick(o.p)}
                 onMouseEnter={() => setHoveredId(o.p.id)} onMouseLeave={() => setHoveredId(null)}>
                <circle cx={o.x} cy={o.y} r="12" fill="transparent" />
                <circle cx={o.x} cy={o.y} r="5" fill={posColor[o.p.element_type]} opacity="0.85" />
                {o.showLabel && <text x={o.x + 7} y={o.y + 3} fill="#9aa6a4" fontSize="10" fontFamily="sans-serif">{o.p.web_name}</text>}
              </g>
            );
          })}
          {positioned.filter(o => o.p.id === hoveredId).map(o => (
            <g key={'h' + o.p.id} className="cursor-pointer" onClick={() => onPlayerClick(o.p)}
               onMouseEnter={() => setHoveredId(o.p.id)} onMouseLeave={() => setHoveredId(null)}>
              <circle cx={o.x} cy={o.y} r="12" fill="transparent" />
              <circle cx={o.x} cy={o.y} r="9" fill="none" stroke={posColor[o.p.element_type]} strokeWidth="2" opacity="0.55" />
              <circle cx={o.x} cy={o.y} r="6" fill={posColor[o.p.element_type]} />
              <rect x={o.x + 8} y={o.y - 9} width={o.p.web_name.length * 6.2 + 12} height="18" rx="4" fill="#0e1315" opacity="0.95" stroke="#3e4d4f" strokeWidth="1" />
              <text x={o.x + 13} y={o.y + 4} fill="#e4ebea" fontSize="11" fontWeight="600" fontFamily="sans-serif">{o.p.web_name}</text>
            </g>
          ))}
        </svg>
      </div>

      {/* Ranked stability list */}
      <div>
        <div className="text-sm uppercase tracking-wider text-stone-400 mb-3" style={{ fontFamily: 'DM Sans, sans-serif' }}>Рейтинг стабільності</div>
        <div className="grid sm:grid-cols-2 gap-2">
          {top.slice(0, 16).map((p, i) => (
            <button key={p.id} onClick={() => onPlayerClick(p)} className="w-full flex items-center gap-3 p-2.5 rounded-lg border border-stone-900 bg-stone-950/40 hover:bg-stone-900/60 hover:border-stone-700 transition-all text-left">
              <div className="font-mono text-stone-600 w-6 text-sm">{i + 1}</div>
              <StatusDot player={p} />
              <div className="min-w-0 flex-1">
                <div className="text-sm font-medium truncate" style={{ fontFamily: 'DM Sans, sans-serif' }}>{p.web_name}</div>
                <div className="text-[11px] text-stone-500">{p.team?.short_name} · {POSITIONS_UA[p.element_type]} · PPG {p.ppg.toFixed(1)} · форма {p.form.toFixed(1)}</div>
              </div>
              <div className="text-right flex-shrink-0">
                <div className="font-mono text-sm text-lime-400">{p.stability.toFixed(1)}</div>
                <div className="text-[10px] text-stone-600">стабільн.</div>
              </div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MY TEAM VIEW (реальна команда користувача за FPL ID)
// ============================================================
const CHIP_NAMES = { wildcard: 'Wildcard', '3xc': 'Triple Captain', bboost: 'Bench Boost', freehit: 'Free Hit', manager: 'Assistant Manager' };

function MyTeamView({ players, teams, events, onPlayerClick }) {
  const teamsMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);
  const playersMap = useMemo(() => Object.fromEntries(players.map(p => [p.id, p])), [players]);
  const [entryId, setEntryId] = useState(() => { try { return localStorage.getItem('my-fpl-id') || ''; } catch { return ''; } });
  const [inputVal, setInputVal] = useState(() => { try { return localStorage.getItem('my-fpl-id') || ''; } catch { return ''; } });
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [top10k, setTop10k] = useState(null);

  useEffect(() => {
    let cancelled = false;
    loadTop10k()
      .then(d => { if (!cancelled) setTop10k(d); })
      .catch(() => { if (!cancelled) setTop10k([]); });
    return () => { cancelled = true; };
  }, []);

  const lastGW = useMemo(() => {
    const f = [...events].reverse().find(e => e.finished);
    return f ? f.id : 1;
  }, [events]);

  const load = useCallback(async (id) => {
    setLoading(true); setError(null); setData(null);
    try {
      const d = await loadMyTeam(id, lastGW);
      setData(d);
    } catch (e) {
      setError('Не вдалося завантажити команду. Перевір ID: це число з адреси сторінки Points на fantasy.premierleague.com (/entry/ЧИСЛО/).');
    } finally { setLoading(false); }
  }, [lastGW]);

  useEffect(() => { if (entryId) load(entryId); }, []); // eslint-disable-line

  const submit = () => {
    const v = inputVal.trim().replace(/\D/g, '');
    if (!v) return;
    setEntryId(v);
    try { localStorage.setItem('my-fpl-id', v); } catch {}
    load(v);
  };

  // --- Екран вводу ID ---
  if (!entryId || (!data && !loading && !error)) {
    return (
      <div className="max-w-lg mx-auto py-10">
        <div className="text-2xl mb-2 text-center" style={{ fontFamily: 'Fraunces, serif', fontWeight: 500 }}>Підключи свою команду</div>
        <div className="text-sm text-stone-400 text-center mb-6" style={{ fontFamily: 'DM Sans, sans-serif' }}>
          Введи свій FPL ID — і побачиш свій склад, ранг та історію сезону. ID зберігається тільки у твоєму браузері.
        </div>
        <div className="flex gap-2">
          <input
            type="text" inputMode="numeric" value={inputVal}
            onChange={e => setInputVal(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && submit()}
            placeholder="напр. 1234567"
            className="flex-1 bg-stone-900 border border-stone-800 rounded-lg px-4 py-3 text-lg font-mono placeholder:text-stone-600 focus:outline-none focus:border-lime-500/50"
          />
          <button onClick={submit} className="px-5 py-3 bg-lime-500 text-stone-950 font-semibold rounded-lg hover:bg-lime-400 transition-colors">Показати</button>
        </div>
        <div className="mt-6 p-4 rounded-lg border border-stone-800 bg-stone-900/40 text-sm text-stone-400 leading-relaxed" style={{ fontFamily: 'DM Sans, sans-serif' }}>
          <div className="font-semibold text-stone-300 mb-1">Де взяти ID?</div>
          Зайди на fantasy.premierleague.com → вкладка <span className="text-stone-200">Points</span>. У адресному рядку буде <span className="font-mono text-stone-300">/entry/<span className="text-lime-400">1234567</span>/event/...</span> — оце число і є твій ID.
        </div>
      </div>
    );
  }

  if (loading) return <div className="p-12 text-center text-stone-500 text-sm">Завантажую команду #{entryId}...</div>;

  if (error) {
    return (
      <div className="max-w-lg mx-auto py-10 text-center">
        <Icon name="alert" size={40} className="mx-auto text-red-500 mb-4" />
        <div className="text-stone-300 mb-5">{error}</div>
        <div className="flex gap-2 justify-center">
          <input type="text" inputMode="numeric" value={inputVal} onChange={e => setInputVal(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()}
            className="bg-stone-900 border border-stone-800 rounded-lg px-3 py-2 font-mono focus:outline-none focus:border-lime-500/50" />
          <button onClick={submit} className="px-4 py-2 bg-lime-500 text-stone-950 font-semibold rounded-lg">Спробувати</button>
        </div>
      </div>
    );
  }

  const { entry, history, picks, picksGW } = data;
  const cur = (history.current || []).filter(h => h.overall_rank);
  const chips = history.chips || [];
  const past = history.past || [];

  // --- Графік рангу (адаптивна шкала, зрозумілі позначки, краще = вище) ---
  let rankChart = null;
  if (cur.length >= 2) {
    const W = 700, H = 240, padL = 56, padR = 70, padT = 28, padB = 34;
    const ranks = cur.map(h => h.overall_rank);
    const best = Math.min(...ranks), worst = Math.max(...ranks);
    // Лог-шкала тільки коли діапазон величезний (ранги стрибають у рази), інакше лінійна
    const useLog = worst / Math.max(1, best) > 10;
    const tf = useLog ? Math.log10 : (v => v);
    const vMin = tf(best), vMax = tf(worst);
    const range = (vMax - vMin) || 1;
    const sx = i => padL + (i / (cur.length - 1)) * (W - padL - padR);
    const sy = r => padT + ((tf(r) - vMin) / range) * (H - padT - padB);
    const pts = cur.map((h, i) => `${sx(i)},${sy(h.overall_rank)}`).join(' ');

    const fmtRank = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace('.0','') + ' млн'
      : v >= 10000 ? Math.round(v / 1000).toLocaleString('uk-UA') + ' тис'
      : Math.round(v).toLocaleString('uk-UA');

    // 4 рівні горизонтальні лінії сітки з підписами рангу
    const ticks = [0, 1/3, 2/3, 1].map(t => {
      const tv = vMin + t * range;
      const r = useLog ? Math.pow(10, tv) : tv;
      return { y: padT + t * (H - padT - padB), label: fmtRank(r) };
    });

    const last = cur[cur.length - 1];

    rankChart = (
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
        {/* сітка з підписами рангу */}
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={padL} y1={t.y} x2={W - padR} y2={t.y} stroke="#283335" strokeWidth="1" strokeDasharray={i === 0 || i === ticks.length - 1 ? '' : '3 4'} />
            <text x={padL - 8} y={t.y + 3.5} fill="#8a9694" fontSize="10" textAnchor="end" fontFamily="monospace">{t.label}</text>
          </g>
        ))}
        {/* підпис осі */}
        <text x={14} y={H / 2} fill="#8a9694" fontSize="10" textAnchor="middle" fontFamily="sans-serif" transform={`rotate(-90 14 ${H / 2})`}>↑ кращий ранг</text>
        {/* тури по X */}
        {cur.map((h, i) => i % 5 === 0 && (
          <text key={i} x={sx(i)} y={H - padB + 16} fill="#78716c" fontSize="9" textAnchor="middle" fontFamily="monospace">GW{h.event}</text>
        ))}
        {/* лінія рангу */}
        <polyline points={pts} fill="none" stroke="#6fcd9c" strokeWidth="2.5" />
        {/* точки з підказками при наведенні */}
        {cur.map((h, i) => (
          <circle key={i} cx={sx(i)} cy={sy(h.overall_rank)} r="3" fill="#6fcd9c" className="cursor-pointer">
            <title>{`GW${h.event}\nРанг: ${h.overall_rank.toLocaleString('uk-UA')}\nОчки за тур: ${h.points}`}</title>
          </circle>
        ))}
        {/* фінальний ранг біля кінця лінії */}
        <g>
          <rect x={sx(cur.length - 1) + 8} y={sy(last.overall_rank) - 10} width={padR - 14} height="20" rx="4" fill="#0e1315" stroke="#3e4d4f" strokeWidth="1" />
          <text x={sx(cur.length - 1) + 8 + (padR - 14) / 2} y={sy(last.overall_rank) + 4} fill="#6fcd9c" fontSize="10" textAnchor="middle" fontFamily="monospace">{fmtRank(last.overall_rank)}</text>
        </g>
        {/* чипи */}
        {chips.map(ch => {
          const idx = cur.findIndex(h => h.event === ch.event);
          if (idx < 0) return null;
          return (
            <g key={ch.name + ch.event}>
              <circle cx={sx(idx)} cy={sy(cur[idx].overall_rank)} r="6" fill="none" stroke="#fbbf24" strokeWidth="1.5">
                <title>{`${CHIP_NAMES[ch.name] || ch.name} — GW${ch.event}`}</title>
              </circle>
              <text x={sx(idx)} y={sy(cur[idx].overall_rank) - 10} fill="#fbbf24" fontSize="8" textAnchor="middle">{CHIP_NAMES[ch.name] || ch.name}</text>
            </g>
          );
        })}
      </svg>
    );
  }

  // --- Графік очок за тур: мої vs середні по грі vs топ-10k ---
  let pointsChart = null;
  let beatenSummary = null;
  if (cur.length >= 2) {
    const avgMap = Object.fromEntries(events.filter(e => e.average_entry_score != null).map(e => [e.id, e.average_entry_score]));
    const t10Map = Object.fromEntries((top10k || []).map(r => [r.event, r.avg]));
    const pdata = cur.map(h => ({ gw: h.event, mine: h.points, hits: h.event_transfers_cost || 0, avg: avgMap[h.event] ?? null, t10: t10Map[h.event] ?? null }));
    const withAvg = pdata.filter(d => d.avg !== null);
    const beaten = withAvg.filter(d => d.mine > d.avg).length;
    const equal = withAvg.filter(d => d.mine === d.avg).length;
    const withT10 = pdata.filter(d => d.t10 !== null);
    const beatenT10 = withT10.filter(d => d.mine > d.t10).length;
    beatenSummary = { beaten, equal, total: withAvg.length, beatenT10, totalT10: withT10.length };

    const W = 700, H = 200, padL = 40, padR = 16, padT = 16, padB = 30;
    const allVals = pdata.flatMap(d => [d.mine, d.avg, d.t10]).filter(v => v !== null);
    const yMax = Math.max(...allVals) + 5;
    const sx = i => padL + (i / (pdata.length - 1)) * (W - padL - padR);
    const sy = v => H - padB - (v / yMax) * (H - padT - padB);
    const minePts = pdata.map((d, i) => `${sx(i)},${sy(d.mine)}`).join(' ');
    const avgPts = pdata.filter(d => d.avg !== null).map((d) => `${sx(pdata.indexOf(d))},${sy(d.avg)}`).join(' ');
    const t10Pts = pdata.filter(d => d.t10 !== null).map((d) => `${sx(pdata.indexOf(d))},${sy(d.t10)}`).join(' ');
    const yTicks = [0, Math.round(yMax / 3), Math.round(yMax * 2 / 3), Math.round(yMax)];

    pointsChart = (
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
        {yTicks.map((t, i) => (
          <g key={i}>
            <line x1={padL} y1={sy(t)} x2={W - padR} y2={sy(t)} stroke="#283335" strokeWidth="1" strokeDasharray={i === 0 ? '' : '3 4'} />
            <text x={padL - 6} y={sy(t) + 3.5} fill="#8a9694" fontSize="10" textAnchor="end" fontFamily="monospace">{t}</text>
          </g>
        ))}
        {pdata.map((d, i) => i % 5 === 0 && (
          <text key={i} x={sx(i)} y={H - padB + 16} fill="#78716c" fontSize="9" textAnchor="middle" fontFamily="monospace">GW{d.gw}</text>
        ))}
        {t10Pts && <polyline points={t10Pts} fill="none" stroke="#38bdf8" strokeWidth="2" strokeDasharray="2 3" opacity="0.85" />}
        <polyline points={avgPts} fill="none" stroke="#fbbf24" strokeWidth="2" strokeDasharray="5 4" opacity="0.8" />
        <polyline points={minePts} fill="none" stroke="#6fcd9c" strokeWidth="2.5" />
        {pdata.map((d, i) => (
          <circle key={i} cx={sx(i)} cy={sy(d.mine)} r="3.5"
            fill={d.avg !== null ? (d.mine > d.avg ? '#6fcd9c' : d.mine < d.avg ? '#f87171' : '#a8a29e') : '#6fcd9c'}
            className="cursor-pointer">
            <title>{`GW${d.gw}\nТвої очки: ${d.mine}${d.hits ? ` (мінуси за трансфери: -${d.hits})` : ''}\nСереднє по грі: ${d.avg ?? '—'}\nТоп-10k (оцінка): ${d.t10 !== null ? d.t10.toFixed(1) : '—'}\n${d.avg !== null ? (d.mine > d.avg ? `Вище середнього на ${d.mine - d.avg}` : d.mine < d.avg ? `Нижче середнього на ${d.avg - d.mine}` : 'Рівно середнє') : ''}`}</title>

            <div className="text-sm text-stone-400 mt-1">{entry.player_first_name} {entry.player_last_name} · ID {entry.id}</div>
          </div>
          <button onClick={() => { setEntryId(''); setData(null); }} className="text-xs text-stone-500 hover:text-stone-300 border border-stone-800 rounded-lg px-3 py-1.5 transition-colors">Змінити ID</button>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">
          <Stat label="Очки за сезон" value={(entry.summary_overall_points ?? 0).toLocaleString('uk-UA')} accent />
          <Stat label="Загальний ранг" value={(entry.summary_overall_rank ?? 0).toLocaleString('uk-UA')} />
          <Stat label="Вартість команди" value={`£${((entry.last_deadline_value ?? 0)/10).toFixed(1)}m`} />
          <Stat label="У банку" value={`£${((entry.last_deadline_bank ?? 0)/10).toFixed(1)}m`} />
        </div>
      </div>

      {/* Rank chart */}
      {rankChart && (
        <div>
          <div className="text-sm uppercase tracking-wider text-stone-400 mb-3" style={{ fontFamily: 'DM Sans, sans-serif' }}>Загальний ранг упродовж сезону <span className="text-stone-600 normal-case">(лінія вгору = ранг покращується · наведи на точку для деталей · жовті кільця — зіграні чипи)</span></div>
          <div className="rounded-xl border border-stone-800 bg-stone-900/30 p-4">{rankChart}</div>
        </div>
      )}

      {/* Points vs average chart */}
      {pointsChart && (
        <div>
          <div className="flex items-baseline justify-between gap-3 flex-wrap mb-3">
            <div className="text-sm uppercase tracking-wider text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>

            <div className="flex items-center gap-4 text-[11px] flex-wrap">
              <span className="flex items-center gap-1.5 text-lime-400"><span className="w-4 h-0.5 bg-lime-400 inline-block rounded" />твої очки</span>
              <span className="flex items-center gap-1.5 text-amber-400"><span className="w-4 h-0 border-t-2 border-dashed border-amber-400 inline-block" />середнє по грі</span>
              <span className="flex items-center gap-1.5 text-sky-400"><span className="w-4 h-0 border-t-2 border-dotted border-sky-400 inline-block" />топ-10k (оцінка)</span>

      {/* Squad */}
      {startingXI.length > 0 && (

                <div key={pos} className="grid gap-2" style={{ gridTemplateColumns: `repeat(${inPos.length}, minmax(0, 1fr))` }}>

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const h = Math.floor(diff / 3600000);
  if (h < 1) return 'щойно';
  if (h < 24) return `${h} год тому`;
  const d = Math.floor(h / 24);
  if (d < 7) return `${d} дн тому`;
  return new Date(ts).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' });
}

function ExpertsView({ players, onPlayerClick }) {

      .then(d => { if (!cancelled) setItems(d); })
