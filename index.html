// ============================================================
// TRENDS VIEW (дані з бекенду: зміни цін і власності за ~24 год)
// ============================================================
function TrendsView({ players, teams, onPlayerClick }) {
  const teamsMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);
  const playersMap = useMemo(() => Object.fromEntries(players.map(p => [p.id, p])), [players]);
  const [trends, setTrends] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    loadTrends()
      .then(t => { if (!cancelled) setTrends(t); })
      .catch(e => { if (!cancelled) setError(e.message); });
    return () => { cancelled = true; };
  }, []);

  if (error) {
    return <EmptyState message={`Не вдалося завантажити тренди з сервера: ${error}`} />;
  }
  if (!trends) {
    return <div className="p-12 text-center text-stone-500 text-sm">Завантажую тренди з сервера...</div>;
  }

  const hasData = ['ownership_risers', 'ownership_fallers', 'price_risers', 'price_fallers']
    .some(k => (trends[k] || []).some(d => d.ownership_delta !== 0 || d.price_delta !== 0));

  const TrendRow = ({ item, metric }) => {
    const p = playersMap[item.player_id];
    const team = p ? teamsMap[p.team] : null;
    const delta = metric === 'price' ? item.price_delta / 10 : item.ownership_delta;
    const positive = delta > 0;
    const display = metric === 'price'
      ? `${positive ? '+' : ''}£${delta.toFixed(1)}m`
      : `${positive ? '+' : ''}${delta.toFixed(2)}%`;
    const current = metric === 'price' ? `£${(item.price / 10).toFixed(1)}m` : `${item.ownership.toFixed(1)}%`;
    return (
      <button onClick={() => p && onPlayerClick(p)} className="w-full flex items-center gap-3 p-2.5 rounded-lg border border-stone-900 bg-stone-950/40 hover:bg-stone-900/60 hover:border-stone-700 transition-all text-left">
        <div className="min-w-0 flex-1">
          <div className="text-sm font-medium truncate" style={{ fontFamily: 'DM Sans, sans-serif' }}>{item.web_name}</div>
          <div className="text-[11px] text-stone-500">{team?.short_name || '—'} · зараз {current}</div>
        </div>
        <div className={`font-mono text-sm flex-shrink-0 ${positive ? 'text-lime-400' : 'text-red-400'}`}>{display}</div>
      </button>
    );
  };

  const TrendSection = ({ title, items, metric, emptyMsg }) => (
    <div>
      <div className="text-sm uppercase tracking-wider text-stone-400 mb-3" style={{ fontFamily: 'DM Sans, sans-serif' }}>{title}</div>
      <div className="space-y-2">
        {(items || []).filter(i => metric === 'price' ? i.price_delta !== 0 : i.ownership_delta !== 0).length === 0
          ? <div className="text-xs text-stone-500 p-3 border border-stone-900 rounded-lg">{emptyMsg}</div>
          : (items || []).filter(i => metric === 'price' ? i.price_delta !== 0 : i.ownership_delta !== 0).slice(0, 8)
              .map(i => <TrendRow key={i.player_id} item={i} metric={metric} />)}
      </div>
    </div>
  );

  return (
    <div className="space-y-6">
      <div className="text-sm text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>
        Хто росте і падає за останні ~24 години. Дані збирає твій сервер щогодини — це історія, якої немає в офіційному FPL API.
      </div>
      {!hasData && (
        <div className="rounded-xl border border-blue-500/20 bg-blue-950/10 p-4 text-sm text-blue-200/80" style={{ fontFamily: 'DM Sans, sans-serif' }}>
          Поки що змін не зафіксовано. Це нормально: серверу потрібно ~24 години роботи, щоб з'явилась база для порівняння, а в міжсезоння ціни й власність майже не рухаються. Зі стартом нового сезону тут стане жваво.
        </div>
      )}
      <div className="grid md:grid-cols-2 gap-6">
        <TrendSection title="Власність росте ↑" items={trends.ownership_risers} metric="ownership" emptyMsg="Немає зростань власності за період" />
        <TrendSection title="Власність падає ↓" items={trends.ownership_fallers} metric="ownership" emptyMsg="Немає падінь власності за період" />
        <TrendSection title="Ціна росте ↑" items={trends.price_risers} metric="price" emptyMsg="Немає підвищень цін за період" />
        <TrendSection title="Ціна падає ↓" items={trends.price_fallers} metric="price" emptyMsg="Немає знижень цін за період" />
      </div>
    </div>
  );
}

// ============================================================
// ACCURACY VIEW (бектест моделі + жива точність прогнозів)
// ============================================================
function AccuracyView() {
  const [backtest, setBacktest] = useState(null);
  const [accuracy, setAccuracy] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    Promise.all([loadBacktest(), loadAccuracy()])
      .then(([bt, acc]) => { if (!cancelled) { setBacktest(bt); setAccuracy(acc); } })
      .catch(e => { if (!cancelled) setError(e.message); });
    return () => { cancelled = true; };
  }, []);

  if (error) return <EmptyState message={`Не вдалося завантажити з сервера: ${error}`} />;
  if (!backtest || !accuracy) return <div className="p-12 text-center text-stone-500 text-sm">Завантажую дані з сервера...</div>;

  const btReady = backtest && backtest.v1 && backtest.v2;
  const improvement = btReady && backtest.v1.mae && backtest.v2.mae
    ? ((backtest.v1.mae - backtest.v2.mae) / backtest.v1.mae * 100)
    : null;

  const MetricCard = ({ title, mae, corr, n, accent }) => (
    <div className={`p-4 rounded-xl border ${accent ? 'border-lime-500/40 bg-lime-950/15' : 'border-stone-800 bg-stone-900/40'}`}>
      <div className="text-xs uppercase tracking-wider text-stone-500 mb-2" style={{ fontFamily: 'DM Sans, sans-serif' }}>{title}</div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <div className={`font-mono text-2xl ${accent ? 'text-lime-400' : 'text-stone-200'}`}>{mae ?? '—'}</div>
          <div className="text-[10px] text-stone-600 uppercase tracking-wider">MAE (сер. похибка)</div>
        </div>
        <div>
          <div className={`font-mono text-2xl ${accent ? 'text-lime-400' : 'text-stone-200'}`}>{corr ?? '—'}</div>
          <div className="text-[10px] text-stone-600 uppercase tracking-wider">Кореляція</div>
        </div>
      </div>
      <div className="text-[10px] text-stone-600 mt-2 font-mono">{n?.toLocaleString('uk-UA')} прогнозів</div>
    </div>
  );

  return (
    <div className="space-y-8">
      <div className="text-sm text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>
        Наскільки можна вірити нашим прогнозам — у цифрах. <strong className="text-stone-300">MAE</strong> — на скільки очок прогноз у середньому промахується (менше = краще). <strong className="text-stone-300">Кореляція</strong> — наскільки добре прогноз вгадує, хто набере більше, а хто менше (1.0 = ідеально, 0 = випадковість).
      </div>

      {/* Backtest section */}
      <section>
        <div className="text-sm uppercase tracking-wider text-stone-400 mb-3" style={{ fontFamily: 'DM Sans, sans-serif' }}>
          Бектест: модель перевірена на сезоні {backtest.season || '2025/26'}
        </div>
        {!btReady ? (
          <div className="rounded-xl border border-blue-500/20 bg-blue-950/10 p-4 text-sm text-blue-200/80">
            Сервер ще рахує бектест (~2-3 хв після оновлення бекенду). Онови сторінку трохи згодом.
          </div>
        ) : (
          <>
            <div className="grid md:grid-cols-2 gap-3">
              <MetricCard title="Стара модель (форма + FDR)" mae={backtest.v1.mae} corr={backtest.v1.corr} n={backtest.v1.n} />
              <MetricCard title="Нова модель v2.1 (xG/xA + Пуассон + ротація)" mae={backtest.v2.mae} corr={backtest.v2.corr} n={backtest.v2.n} accent />
            </div>
            {improvement !== null && (
              <div className="mt-3 p-3 rounded-lg border border-stone-800 bg-stone-900/30 text-sm text-stone-300" style={{ fontFamily: 'DM Sans, sans-serif' }}>
                {improvement > 0
                  ? <>Нова модель помиляється в середньому на <span className="font-mono text-lime-400">{improvement.toFixed(1)}%</span> менше за стару.</>
                  : <>На цьому сезоні нова модель не показала переваги за MAE ({improvement.toFixed(1)}%) — дивись також кореляцію.</>}
                {' '}Методика: для кожного з {backtest.sample_players} найактивніших гравців прогнозували кожен тур (GW {backtest.gws}) лише за даними попередніх турів — як у реальному житті, без підглядання в майбутнє.
              </div>
            )}
          </>
        )}
      </section>

      {/* Live accuracy section */}
      <section>
        <div className="text-sm uppercase tracking-wider text-stone-400 mb-3" style={{ fontFamily: 'DM Sans, sans-serif' }}>
          Жива точність по турах — сезон 2026/27
        </div>
        {accuracy.length === 0 ? (
          <div className="rounded-xl border border-blue-500/20 bg-blue-950/10 p-4 text-sm text-blue-200/80" style={{ fontFamily: 'DM Sans, sans-serif' }}>
            Наповниться з початком сезону: за добу до кожного дедлайну сервер фіксує прогнози всіх гравців, а після завершення туру чесно звіряє їх із фактичними очками. Жодних заднім числом — тільки прогнози, зроблені наперед.
          </div>
        ) : (
          <div className="overflow-x-auto rounded-xl border border-stone-800">
            <table className="w-full text-sm">
              <thead className="bg-stone-900/70">
                <tr>
                  <th className="px-3 py-2 text-left text-[11px] uppercase tracking-wider text-stone-500 font-medium">Тур</th>
                  <th className="px-3 py-2 text-right text-[11px] uppercase tracking-wider text-stone-500 font-medium">MAE</th>
                  <th className="px-3 py-2 text-right text-[11px] uppercase tracking-wider text-stone-500 font-medium">Кореляція</th>
                  <th className="px-3 py-2 text-right text-[11px] uppercase tracking-wider text-stone-500 font-medium">Прогнозів</th>
                </tr>
              </thead>
              <tbody>
                {accuracy.map(r => (
                  <tr key={r.event} className="border-t border-stone-900">
                    <td className="px-3 py-2 font-mono text-stone-200">GW{r.event}</td>
                    <td className="px-3 py-2 text-right font-mono text-lime-400">{r.mae}</td>
                    <td className="px-3 py-2 text-right font-mono text-stone-300">{r.corr ?? '—'}</td>
                    <td className="px-3 py-2 text-right font-mono text-stone-500">{r.n}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>
    </div>
  );
}

const GLOSSARY = [
  { term: 'xG', full: 'Expected Goals · очікувані голи', desc: 'Скільки голів гравець «мав би» забити за якістю своїх моментів. Високий xG при малій кількості голів = не щастить, скоро забиватиме.' },
  { term: 'xA', full: 'Expected Assists · очікувані асисти', desc: 'Скільки результативних передач гравець «мав би» віддати за якістю своїх пасів під удар.' },
  { term: 'xGC', full: 'Expected Goals Conceded · очікувані пропущені', desc: 'Скільки голів команда гравця «мала б» пропустити. Низький xGC = більше шансів на «сухар». Важливо для захисників і воротарів.' },
  { term: 'xP', full: 'Expected Points · очікувані очки', desc: 'Скільки очок FPL гравець «мав би» набрати за підкладковою статистикою (xG, xA, ймовірність сухаря). Порівняння з реальними очками показує, хто перформить вище/нижче свого рівня.' },
  { term: 'FDR', full: 'Fixture Difficulty Rating · складність матчу', desc: 'Оцінка складності суперника від 1 (дуже легко) до 5 (дуже складно). Зелений = легкий суперник, червоний = важкий.' },
  { term: 'ICT', full: 'Influence · Creativity · Threat', desc: 'Зведений індекс впливу гравця на гру: вплив на результат, креативність (створення моментів) і загроза (власні моменти).' },
  { term: 'PPG', full: 'Points Per Game · очки за матч', desc: 'Середня кількість очок за матч за весь сезон. Показує загальний рівень гравця.' },
  { term: 'Форма', full: 'Form', desc: 'Середня кількість очок за останні матчі (приблизно місяць). Показує, наскільки гравець «гарячий» прямо зараз.' },
  { term: 'Власність', full: 'Ownership · % selected', desc: 'Який відсоток усіх гравців FPL має цього футболіста. Висока власність = популярний вибір; низька = диференціал.' },
  { term: 'Диференціал', full: 'Differential', desc: 'Гравець з низькою власністю (зазвичай <10%) і добрим потенціалом. Якщо «вистрелить» — даєш перевагу над суперниками, бо в них його немає.' },
  { term: 'Цінність', full: 'Value', desc: 'Очки за кожен £1m ціни. Допомагає знайти недорогих гравців, що приносять багато очок (enablers).' },
  { term: 'Сухар', full: 'Clean Sheet · «суха» гра', desc: 'Матч без пропущених голів. Дає +4 очки захисникам і воротарям, +1 півзахисникам.' },
  { term: 'Стабільність', full: 'наш показник', desc: 'Зважене поєднання PPG (рівень за сезон) і форми (останні матчі). Високий = гравець стабільно набирає, а не разово «вистрелив».' },
  { term: 'GW', full: 'Gameweek · ігровий тур', desc: 'Один тур чемпіонату. Сезон APL — 38 турів. Перед кожним туром є дедлайн на зміни складу.' },
  { term: 'BPS', full: 'Bonus Points System', desc: 'Система, що нараховує бонусні очки (3, 2, 1) найкращим гравцям матчу за статистикою (паси, відбори, удари тощо).' },
  { term: 'Капітан / VC', full: 'Captain / Vice-captain', desc: 'Очки капітана множаться на 2. Якщо капітан не зіграв — множник переходить на віцекапітана (VC).' },
];

function GlossaryDrawer({ open, onClose }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-40 flex justify-end bg-black/50 backdrop-blur-sm" onClick={onClose}>
      <div className="w-full max-w-md h-full bg-stone-950 border-l border-stone-800 p-6 overflow-y-auto" onClick={e => e.stopPropagation()}>
        <div className="flex justify-between items-start mb-6">
          <div>
            <div className="text-2xl tracking-tight" style={{ fontFamily: 'Fraunces, serif', fontWeight: 500 }}>Словник</div>
            <div className="text-xs text-stone-500 mt-1">Що означають скорочення й метрики</div>
          </div>
          <button onClick={onClose} className="p-2 hover:bg-stone-800 rounded-lg"><Icon name="x" size={18} /></button>
        </div>
        <div className="space-y-3">
          {GLOSSARY.map(g => (
            <div key={g.term} className="p-3 rounded-lg border border-stone-800 bg-stone-900/40">
              <div className="flex items-baseline gap-2 flex-wrap">
                <span className="font-mono text-lime-400 font-semibold">{g.term}</span>
                <span className="text-xs text-stone-500">{g.full}</span>
              </div>
              <div className="text-sm text-stone-300 mt-1.5 leading-snug" style={{ fontFamily: 'DM Sans, sans-serif' }}>{g.desc}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}


// ===== app.jsx =====
// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [view, setView] = useState('dashboard');
  const [selectedPlayer, setSelectedPlayer] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [showGlossary, setShowGlossary] = useState(false);
  const [weights, setWeights] = useState({ form: 1.0, fdr: 0.5, value: 0.0, minutes: 1.0 });
  const [proxyInput, setProxyInput] = useState(() => { try { return localStorage.getItem('custom-proxy') || ''; } catch { return ''; } });

  const saveProxy = (val) => {
    setProxyInput(val);
    try { val ? localStorage.setItem('custom-proxy', val.trim()) : localStorage.removeItem('custom-proxy'); } catch {}
  };

  const load = useCallback(async (force = false) => {
    setLoading(true); setError(null);
    try { setData(await loadFPLData(force)); }
    catch (e) { setError(e.message || 'Помилка'); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { load(); }, [load]);

  if (error && !data) {
    return (
      <div className="min-h-screen flex items-center justify-center p-8">
        <div className="max-w-md text-center">
          <Icon name="alert" size={48} className="mx-auto text-red-500 mb-4" />
          <h2 className="text-2xl mb-2" style={{ fontFamily: 'Fraunces, serif' }}>Не вдалося завантажити</h2>
          <p className="text-stone-400 text-sm mb-4">{error}</p>
          <p className="text-stone-500 text-xs mb-6">Усі CORS-проксі не відповідають. Спробуй ще раз, або встанови власний проксі (надійніше).</p>
          <div className="flex gap-2 justify-center mb-5">
            <button onClick={() => load(true)} className="px-4 py-2 bg-lime-500 text-stone-950 font-semibold rounded-lg">Спробувати знову</button>
          </div>
          <div className="p-4 rounded-lg border border-stone-800 bg-stone-900/40 text-left">
            <div className="text-xs uppercase tracking-wider text-stone-500 mb-2">Власний проксі (опціонально)</div>
            <input type="text" value={proxyInput} onChange={e => saveProxy(e.target.value)} placeholder="https://твій-сервер/?url=" className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-sm placeholder:text-stone-600 focus:outline-none focus:border-lime-500/50" />
            <div className="text-[11px] text-stone-500 mt-2 leading-snug">Встав адресу свого проксі (Cloudflare Worker або сервер) і натисни «Спробувати знову».</div>
          </div>
        </div>
      </div>
    );
  }

  if (!data) {
    return (
      <div className="min-h-screen flex items-center justify-center p-8">
        <div className="text-center">
          <div className="w-12 h-12 border-2 border-stone-800 border-t-lime-500 rounded-full animate-spin mx-auto mb-4" />
          <div className="text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>Завантажую дані FPL...</div>
          <div className="text-xs text-stone-600 mt-2">Це може зайняти 5–15 секунд</div>
        </div>
      </div>
    );
  }

  const { bootstrap, fixtures } = data;
  const { elements: players, teams } = bootstrap;
  const currentGW = getCurrentGW(bootstrap.events);
  const currentEvent = bootstrap.events.find(e => e.id === currentGW);
  const seasonEnded = fixtures.filter(f => !f.finished && f.event !== null).length === 0;

  const tabs = [
    { id: 'dashboard', label: 'Дашборд', icon: 'trending' },
    { id: 'myteam', label: 'Мій склад', icon: 'star' },
    { id: 'players', label: 'Гравці', icon: 'users' },
    { id: 'captain', label: 'Капітан', icon: 'crown' },
    { id: 'optimizer', label: 'Оптимізатор', icon: 'zap' },
    { id: 'consistency', label: 'Стабільність', icon: 'activity' },
    { id: 'trends', label: 'Тренди', icon: 'barchart' },
    { id: 'experts', label: 'Експерти', icon: 'rss' },
    { id: 'accuracy', label: 'Точність', icon: 'target' },
    { id: 'fixtures', label: 'Календар', icon: 'calendar' },
  ];

  return (
    <div className="min-h-screen text-stone-100" style={{ fontFamily: 'DM Sans, sans-serif' }}>
      <div className="fixed inset-0 opacity-30 pointer-events-none" style={{
        backgroundImage: 'radial-gradient(ellipse at top, rgba(79, 175, 125, 0.07), transparent 55%), radial-gradient(ellipse at bottom right, rgba(120, 140, 150, 0.04), transparent 55%)',
      }} />
      <div className="relative">
        <header className="border-b border-stone-800 bg-stone-950/80 backdrop-blur sticky top-0 z-30">
          <div className="max-w-7xl mx-auto px-4 md:px-6 py-3 flex items-center justify-between gap-3">
            <div className="flex items-center gap-3 md:gap-5 min-w-0">
              <div className="min-w-0">
                <div className="text-2xl md:text-3xl tracking-tight leading-none" style={{ fontFamily: 'Fraunces, serif', fontWeight: 600 }}>
                  FPL<span className="text-lime-400">.</span>UA
                </div>
                <div className="text-[10px] uppercase tracking-[0.2em] text-stone-500 mt-0.5 truncate">Fantasy Premier League · Аналітика</div>
              </div>
              {currentEvent && (
                <div className="hidden md:flex items-center gap-3 pl-5 ml-2 border-l border-stone-800">
                  <div>
                    <div className="text-[10px] uppercase tracking-wider text-stone-500">Тур</div>
                    <div className="font-mono text-lg text-stone-200 leading-none mt-0.5">GW{currentGW}</div>
                  </div>
                  {currentEvent.deadline_time && (
                    <div>
                      <div className="text-[10px] uppercase tracking-wider text-stone-500">Дедлайн</div>
                      <div className="font-mono text-sm text-stone-300 leading-none mt-0.5">
                        {new Date(currentEvent.deadline_time).toLocaleString('uk-UA', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
            <div className="flex items-center gap-2 flex-shrink-0">
              <button onClick={() => setShowGlossary(true)} className="p-2 rounded-lg hover:bg-stone-900 text-stone-400 hover:text-stone-200 transition-colors" title="Словник скорочень">
                <Icon name="help" size={18} />
              </button>
              <button onClick={() => setShowSettings(true)} className="p-2 rounded-lg hover:bg-stone-900 text-stone-400 hover:text-stone-200 transition-colors" title="Налаштування">
                <Icon name="settings" size={18} />
              </button>
              <button onClick={() => load(true)} disabled={loading} className="p-2 rounded-lg hover:bg-stone-900 text-stone-400 hover:text-stone-200 transition-colors disabled:opacity-40" title="Оновити">
                <Icon name="refresh" size={18} className={loading ? 'animate-spin' : ''} />
              </button>
            </div>
          </div>
          <div className="border-t border-stone-900">
            <div className="max-w-7xl mx-auto px-4 md:px-6">
              <nav className="flex gap-1 overflow-x-auto -mb-px">
                {tabs.map(t => (
                  <button key={t.id} onClick={() => setView(t.id)}
                    className={`flex items-center gap-1.5 px-3 md:px-4 py-2.5 text-sm border-b-2 transition-colors whitespace-nowrap ${
                      view === t.id ? 'border-lime-400 text-lime-400' : 'border-transparent text-stone-400 hover:text-stone-200'
                    }`}>
                    <Icon name={t.icon} size={14} /> {t.label}
                  </button>
                ))}
              </nav>
            </div>
          </div>
        </header>

        {data?.fromCache && (
          <div className="max-w-7xl mx-auto px-4 md:px-6 pt-3">
            <div className="text-[11px] text-stone-600 flex items-center gap-1.5">
              <span className="w-1 h-1 rounded-full bg-stone-600" />
              Кеш від {new Date(data.cachedAt).toLocaleTimeString('uk-UA')}. Натисни оновлення для свіжих даних.
            </div>
          </div>
        )}

        <main className="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-8 pb-20">
          {view === 'dashboard' && <DashboardView players={players} teams={teams} fixtures={fixtures} currentGW={currentGW} weights={weights} seasonEnded={seasonEnded} onPlayerClick={setSelectedPlayer} />}
          {view === 'myteam' && <MyTeamView players={players} teams={teams} events={bootstrap.events} onPlayerClick={setSelectedPlayer} />}
          {view === 'players' && <PlayersView players={players} teams={teams} fixtures={fixtures} currentGW={currentGW} weights={weights} onPlayerClick={setSelectedPlayer} />}
          {view === 'captain' && <CaptainView players={players} teams={teams} fixtures={fixtures} currentGW={currentGW} weights={weights} seasonEnded={seasonEnded} onPlayerClick={setSelectedPlayer} />}
          {view === 'optimizer' && <OptimizerView players={players} teams={teams} fixtures={fixtures} currentGW={currentGW} weights={weights} seasonEnded={seasonEnded} onPlayerClick={setSelectedPlayer} />}
          {view === 'consistency' && <ConsistencyView players={players} teams={teams} onPlayerClick={setSelectedPlayer} />}
          {view === 'trends' && <TrendsView players={players} teams={teams} onPlayerClick={setSelectedPlayer} />}
          {view === 'experts' && <ExpertsView players={players} onPlayerClick={setSelectedPlayer} />}
          {view === 'accuracy' && <AccuracyView />}
          {view === 'fixtures' && <FixturesView teams={teams} fixtures={fixtures} currentGW={currentGW} />}
        </main>

        <footer className="max-w-7xl mx-auto px-4 md:px-6 py-6 border-t border-stone-900 text-xs text-stone-600">
          <div className="flex flex-col md:flex-row justify-between gap-2">
            <div>Дані: офіційне FPL API · Без афіляції з Прем'єр-лігою.</div>
            <div>Прогнози — наша евристика, не фінансова порада 😉</div>
          </div>
        </footer>
      </div>

      <PlayerModal player={selectedPlayer} team={selectedPlayer ? teams.find(t => t.id === selectedPlayer.team) : null} fixtures={fixtures} currentGW={currentGW} teams={teams} onClose={() => setSelectedPlayer(null)} />
      <SettingsDrawer open={showSettings} onClose={() => setShowSettings(false)} weights={weights} setWeights={setWeights} />
      <GlossaryDrawer open={showGlossary} onClose={() => setShowGlossary(false)} />
    </div>
  );
}


// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
