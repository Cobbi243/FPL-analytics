// Якщо бекенд недоступний — фолбек на проксі-ланцюжок.
async function fetchFromBackend(apiPath) {
  const res = await fetch(`${BACKEND_BASE}${apiPath}`, {
    cache: 'no-store'
  });
  if (!res.ok) throw new Error(`Backend HTTP ${res.status}`);
  return res.json();
}
async function loadFPLData(forceRefresh = false) {
  if (!forceRefresh) {
    try {
      const cached = await storage.get('fpl-cache');
      if (cached) {
        const parsed = JSON.parse(cached.value);
        if (Date.now() - parsed.ts < CACHE_TTL) {
          return {
            ...parsed.data,
            fromCache: true,
            cachedAt: parsed.ts
          };
        }
      }
    } catch (e) {}
  }
  let bootstrap, fixtures;
  try {
    [bootstrap, fixtures] = await Promise.all([fetchFromBackend('/api/bootstrap'), fetchFromBackend('/api/fixtures')]);
  } catch (e) {
    // Бекенд лежить — старий шлях через проксі
    [bootstrap, fixtures] = await Promise.all([fetchWithProxy(`${FPL_API}/bootstrap-static/`), fetchWithProxy(`${FPL_API}/fixtures/`)]);
  }
  const data = {
    bootstrap,
    fixtures
  };
  try {
    await storage.set('fpl-cache', JSON.stringify({
      ts: Date.now(),
      data
    }));
  } catch (e) {}
  return {
    ...data,
    fromCache: false,
    cachedAt: Date.now()
  };
}

// Завантаження реальної команди користувача за FPL ID (entry id)
async function loadMyTeam(entryId, fallbackGW) {
  const [entry, history] = await Promise.all([fetchWithProxy(`${FPL_API}/entry/${entryId}/`), fetchWithProxy(`${FPL_API}/entry/${entryId}/history/`)]);
  // Останній тур, у якому команда реально грала
  const played = (history.current || []).filter(h => h.points !== null && h.points !== undefined);
  const picksGW = played.length ? played[played.length - 1].event : null;

  // На старті сезону зіграних турів ще немає — склад запитувати марно
  // (запит впаде і довго перебиратиме проксі), тому одразу повертаємо без нього.
  if (picksGW === null) {
    return {
      entry,
      history,
      picks: null,
      picksGW: fallbackGW
    };
  }
  let picks = null;
  try {
    // Таймаут-запобіжник: якщо picks не приходять за 8 секунд — йдемо далі без них
    picks = await Promise.race([fetchWithProxy(`${FPL_API}/entry/${entryId}/event/${picksGW}/picks/`), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]);
  } catch (e) {/* picks можуть бути недоступні — не критично */}
  return {
    entry,
    history,
    picks,
    picksGW
  };
}

// ============================================================
// ANALYTICS
// ============================================================
function getCurrentGW(events) {
  if (!events || events.length === 0) return 1;
  const now = Date.now();
  // Поточним вважаємо перший тур, чий дедлайн ще НЕ минув — саме в ньому
  // можна робити трансфери, ставити капітана і грати чипи.
  // (Прапорець finished ненадійний: FPL ставить його лише через добу
  // після останнього матчу, коли остаточно звірить дані.)
  const upcoming = [...events].filter(e => e.deadline_time && Date.parse(e.deadline_time) > now).sort((a, b) => Date.parse(a.deadline_time) - Date.parse(b.deadline_time))[0];
  if (upcoming) return upcoming.id;
  // Дедлайнів попереду немає — сезон завершено, показуємо останній тур
  const lastFinished = [...events].reverse().find(e => e.finished || e.is_current);
  return lastFinished ? lastFinished.id : events[events.length - 1].id;
}
function getNextFixtures(teamId, fixtures, fromGW, count = 5) {
  return fixtures.filter(f => !f.finished && f.event !== null && f.event >= fromGW && (f.team_h === teamId || f.team_a === teamId)).sort((a, b) => a.event - b.event).slice(0, count).map(f => ({
    gw: f.event,
    isHome: f.team_h === teamId,
    opponent: f.team_h === teamId ? f.team_a : f.team_h,
    difficulty: f.team_h === teamId ? f.team_h_difficulty : f.team_a_difficulty,
    kickoff: f.kickoff_time
  }));
}
function availabilityFactor(player) {
  if (player.status === 'a') return 1.0;
  if (player.status === 'd') return (player.chance_of_playing_next_round ?? 50) / 100;
  if (player.status === 'i' || player.status === 's' || player.status === 'u') return 0.05;
  if (player.chance_of_playing_next_round !== null) return player.chance_of_playing_next_round / 100;
  return 1.0;
}

// ============================================================
// МОДЕЛЬ ПРОГНОЗУ v2.1
// Атака: xG/90 та xA/90, скориговані на силу захисту суперника.
// Сухарі: Пуассон з особистого xGC/90 × сила атаки суперника.
// Ротація: очікувані хвилини на МАТЧ КОМАНДИ + ймовірність старту.
// "Інші очки/90": залишок (бонуси, сейви, DefCon, картки) з реальної
// статистики гравця. Малі вибірки -> змішування зі старою формулою.
// ============================================================
const GOAL_VALUE = {
  1: 6,
  2: 6,
  3: 5,
  4: 4
};
const CS_VALUE = {
  1: 4,
  2: 4,
  3: 1,
  4: 0
};
const AVG_STRENGTH = 1150; // середня сила команд АПЛ у шкалі FPL (~1000-1400)

function predictPlayerPoints(player, teamsMap, fixtures, fromGW, gwsAhead = 1, weights) {
  const w = weights || {
    form: 1.0,
    fdr: 0.5,
    value: 0.0,
    minutes: 1.0
  };
  const nextFixtures = getNextFixtures(player.team, fixtures, fromGW, gwsAhead);
  if (nextFixtures.length === 0) {
    return {
      total: 0,
      perGW: 0,
      fixtures: [],
      breakdown: {
        form: 0,
        fdr: 0,
        mins: 0,
        avail: 0
      }
    };
  }
  const mins = player.minutes || 0;
  const form = parseFloat(player.form) || 0;
  const ppg = parseFloat(player.points_per_game) || 0;
  const avail = availabilityFactor(player);

  // Скільки матчів зіграла КОМАНДА (для оцінки ротації гравця).
  // На старті сезону завершених матчів немає — тоді за базу беремо повний
  // сезон (38 турів), бо статистика гравця у даних ще торішня.
  const playedRounds = fixtures.filter(f => f.finished && (f.team_h === player.team || f.team_a === player.team)).length;
  const rounds = playedRounds > 0 ? playedRounds : 38;
  const starts = Math.min(player.starts || 0, rounds);
  // Виходи з лавки: оцінка з "зайвих" хвилин (старт ≈ 84 хв, камео ≈ 25 хв)
  const cameos = Math.max(0, Math.min(rounds - starts, Math.round((mins - 84 * starts) / 25)));
  const p60 = Math.min(1, starts / rounds);
  const pCameo = Math.min(1 - p60, cameos / rounds);
  const expMins = Math.min(90, mins / rounds); // очікувані хвилини на матч команди (не більше 90)

  const minutesFactor = w.minutes > 0 ? mins > 1000 ? 1.0 : mins > 500 ? 0.85 : mins > 200 ? 0.7 : 0.5 : 1.0;

  // Показники на 90 хвилин
  const per90 = v => mins > 0 ? (parseFloat(v) || 0) / (mins / 90) : 0;
  const xG90 = per90(player.expected_goals);
  const xA90 = per90(player.expected_assists);
  const xGC90 = per90(player.expected_goals_conceded);

  // "Інші очки" (бонуси, сейви, DefCon, мінуси за картки/пропущені) —
  // залишок реальних очок після голів/асистів/сухарів/виходів
  const appearanceCum = 2 * starts + cameos;
  const explained = (player.goals_scored || 0) * GOAL_VALUE[player.element_type] + (player.assists || 0) * 3 + (player.clean_sheets || 0) * CS_VALUE[player.element_type] + appearanceCum;
  const other90 = mins > 0 ? Math.max(-1, Math.min(3, ((player.total_points || 0) - explained) / (mins / 90))) : 0;

  // Вага нової моделі росте з вибіркою: 0 хвилин -> стара формула, 450+ -> нова
  const blendNew = Math.min(1, mins / 450);
  // Сила коригування на суперника керується слайдером FDR (0.5 = стандарт)
  const adjScale = Math.min(2, w.fdr / 0.5);
  let total = 0;
  const detailedFixtures = nextFixtures.map(f => {
    const opp = teamsMap[f.opponent];
    // Надійне читання сили: FPL заповнює поля поетапно (на старті сезону
    // детальні = 0, але strength_overall_home/away 1-5 вже проставлені)
    const strOf = (team, key) => {
      if (!team) return AVG_STRENGTH;
      const v = team[key];
      if (Number.isFinite(v) && v > 0) return v;
      const isHomeKey = key.endsWith('_home');
      const ov = isHomeKey ? team.strength_overall_home : team.strength_overall_away;
      if (Number.isFinite(ov) && ov > 0) return 850 + ov * 120;
      const gen = team.strength;
      if (Number.isFinite(gen) && gen > 0) return 850 + gen * 120;
      return AVG_STRENGTH;
    };
    const oppDef = strOf(opp, f.isHome ? 'strength_defence_away' : 'strength_defence_home');
    const oppAtt = strOf(opp, f.isHome ? 'strength_attack_away' : 'strength_attack_home');
    const attackAdj = 1 + (AVG_STRENGTH / oppDef - 1) * adjScale;
    const concedeAdj = 1 + (oppAtt / AVG_STRENGTH - 1) * adjScale;
    const appearancePts = 2 * p60 + 1 * pCameo;
    const attackPts = (xG90 * GOAL_VALUE[player.element_type] + xA90 * 3) * (expMins / 90) * attackAdj;
    const csPts = p60 * Math.exp(-(xGC90 * concedeAdj)) * CS_VALUE[player.element_type];
    const otherPts = other90 * (expMins / 90);
    const homeBonus = f.isHome ? 0.2 : 0;
    const newScore = (appearancePts + attackPts + csPts + otherPts + homeBonus) * avail;

    // Стара формула (форма/PPG + FDR) — для змішування і як база для новачків
    const oldBase = (form * 0.7 + ppg * 0.3) * w.form;
    const oldScore = Math.max(0, (oldBase + (3 - f.difficulty) * w.fdr + (f.isHome ? 0.3 : 0)) * minutesFactor * avail);
    const formBoost = 1 + Math.max(-0.15, Math.min(0.15, (form - ppg) * 0.03 * w.form));
    const rawScore = blendNew * newScore * formBoost + (1 - blendNew) * oldScore;
    const fixtureScore = Number.isFinite(rawScore) ? Math.max(0, rawScore) : 0;
    total += fixtureScore;
    return {
      ...f,
      score: fixtureScore
    };
  });
  return {
    total,
    perGW: total / nextFixtures.length,
    fixtures: detailedFixtures,
    breakdown: {
      form,
      avail,
      mins: minutesFactor,
      count: nextFixtures.length,
      xG90: +xG90.toFixed(2),
      xA90: +xA90.toFixed(2),
      blendNew: +blendNew.toFixed(2)
    }
  };
}
function valueScore(player) {
  const cost = player.now_cost / 10;
  if (cost <= 0) return 0;
  // Очки за £1m. На старті сезону очки ще нульові, тому в такому разі
  // спираємось на торішню продуктивність за матч (а не на суму за сезон),
  // інакше виходить суміш «торішні очки ÷ новa ціна» з абсурдними числами.
  const pts = player.total_points || 0;
  const mins = player.minutes || 0;
  if (pts > 0 && mins > 0) {
    const perMatch = pts / Math.max(1, mins / 90); // очки за 90 хвилин
    return perMatch / cost * 10; // масштаб під зручні 1-10
  }
  return pts / cost;
}
function differentialBoost(player) {
  const sel = parseFloat(player.selected_by_percent) || 0;
  if (sel >= 15) return 1.0;
  return 1.0 + (15 - sel) * 0.02;
}

// ============================================================
// OPTIMIZER
// ============================================================
// ============================================================
// ПРОГНОЗ ПО КОМАНДАХ на найближчий тур
// Очікувані голи (xGF) і ймовірність сухаря з рейтингів сили команд.
// Базова лінія ~1.45 гола/матч (середнє АПЛ), масштабується силою
// атаки своєї команди проти захисту суперника (і навпаки для сухаря).
// Сухар за Пуассоном: P(0 пропущених) = exp(-очікувані пропущені).
// ============================================================
const LEAGUE_AVG_GOALS = 1.45; // середні голи команди за матч в АПЛ
const HOME_GOAL_MULT = 1.04; // домашня перевага (підібрано під ринкові проєкції)
const FDR_BASE = 1.10; // наскільки складність матчу впливає на очікувані голи
const ATTACK_W = 0.20; // вага класу власної атаки
const OPP_DEF_W = 0.04; // вага класу захисту суперника

function teamForecast(teams, fixtures, fromGW) {
  const teamsById = Object.fromEntries(teams.map(t => [t.id, t]));
  // Знаходимо найближчий тур із матчами
  const upcoming = fixtures.filter(f => f.event != null && !f.finished && f.event >= (fromGW || 1));
  if (upcoming.length === 0) return {
    gw: null,
    rows: []
  };
  const gw = Math.min(...upcoming.map(f => f.event));
  const gwFixtures = fixtures.filter(f => f.event === gw);

  // Надійне читання сили команди. FPL заповнює поля поетапно:
  // на старті сезону детальні рейтинги = 0, а strength_overall_home/away (1-5) вже є.
  // Порядок: детальний -> overall(1-5) -> загальний strength(1-5) -> середнє.
  const str = (team, key) => {
    if (!team) return AVG_STRENGTH;
    const v = team[key];
    if (Number.isFinite(v) && v > 0) return v;
    // overall для потрібної сторони (дім/виїзд) у шкалі 1-5
    const isHomeKey = key.endsWith('_home');
    const ov = isHomeKey ? team.strength_overall_home : team.strength_overall_away;
    if (Number.isFinite(ov) && ov > 0) return 850 + ov * 120; // 1->970 ... 5->1450
    const gen = team.strength;
    if (Number.isFinite(gen) && gen > 0) return 850 + gen * 120;
    return AVG_STRENGTH;
  };
  const rows = [];
  for (const f of gwFixtures) {
    const home = teamsById[f.team_h];
    const away = teamsById[f.team_a];
    if (!home || !away) continue;

    // Сила команди в шкалі 1-5 (overall) — окремо для дому й виїзду
    const tier = (team, isHome) => {
      const ov = isHome ? team.strength_overall_home : team.strength_overall_away;
      if (Number.isFinite(ov) && ov > 0) return ov;
      if (Number.isFinite(team.strength) && team.strength > 0) return team.strength;
      return 3;
    };
    // FDR матчу (1 = дуже легко, 5 = дуже складно) — найточніший сигнал,
    // бо FPL проставляє його з урахуванням конкретної пари й поля.
    const fdrH = f.team_h_difficulty ?? 3;
    const fdrA = f.team_a_difficulty ?? 3;

    // Коефіцієнти підібрані під ринкові xG-проєкції (середня похибка ~0.11 гола).
    // FDR матчу — основний сигнал, клас своєї атаки і класу захисту суперника — уточнення.
    const fromFDR = fdr => Math.pow(FDR_BASE, 3 - fdr);
    const fromAttack = t => 1 + (t - 3) * ATTACK_W;
    const fromOppDefence = t => 1 + (3 - t) * OPP_DEF_W;
    const calc = (att, opp, isHome, myFdr) => {
      const xGF = LEAGUE_AVG_GOALS * fromFDR(myFdr) * fromAttack(tier(att, isHome)) * fromOppDefence(tier(opp, !isHome)) * (isHome ? HOME_GOAL_MULT : 1 / HOME_GOAL_MULT);
      return Number.isFinite(xGF) ? Math.max(0.25, Math.min(4, xGF)) : LEAGUE_AVG_GOALS;
    };
    const homeXGF = calc(home, away, true, fdrH);
    const awayXGF = calc(away, home, false, fdrA);
    const homeCS = Math.exp(-awayXGF);
    const awayCS = Math.exp(-homeXGF);
    rows.push({
      fixtureId: f.id,
      gw,
      home: {
        team: home,
        opp: away,
        isHome: true,
        xGF: homeXGF,
        cs: homeCS,
        fdr: f.team_h_difficulty ?? 3
      },
      away: {
        team: away,
        opp: home,
        isHome: false,
        xGF: awayXGF,
        cs: awayCS,
        fdr: f.team_a_difficulty ?? 3
      }
    });
  }
  // Плоский список команд (зручніше для таблиці), відсортований за xGF
  const flat = [];
  for (const r of rows) {
    flat.push({
      ...r.home,
      fixtureId: r.fixtureId,
      gw
    });
    flat.push({
      ...r.away,
      fixtureId: r.fixtureId,
      gw
    });
  }
  return {
    gw,
    rows,
    flat
  };
}

// ============================================================
// ПЛАНУВАЛЬНИК ЧИПІВ
// Рахує прогноз твоїх 15 гравців по кожному з майбутніх турів
// і підказує, де найвигідніше зіграти кожен чип.
// Враховує подвійні тури (2 матчі за GW) і порожні (жодного).
// ============================================================
const CHIP_DEADLINE_GW = 19; // перший комплект чипів діє до GW19 включно

function planChips(squad, teamsMap, fixtures, fromGW, weights, horizonEnd, events) {
  if (!squad || squad.length < 11) return null;
  const endGW = horizonEnd || CHIP_DEADLINE_GW;
  const now = Date.now();
  // Пропускаємо тури, чий дедлайн уже минув — чип у них зіграти неможливо
  const deadlinePassed = gw => {
    if (!events) return false;
    const ev = events.find(e => e.id === gw);
    return ev && ev.deadline_time && Date.parse(ev.deadline_time) <= now;
  };
  const gws = [];
  for (let gw = fromGW; gw <= endGW; gw++) {
    if (!deadlinePassed(gw)) gws.push(gw);
  }
  if (gws.length === 0) return null;

  // Для кожного туру рахуємо прогноз кожного гравця з урахуванням
  // кількості його матчів у цьому турі (0 = порожній, 2 = подвійний)
  const perGW = gws.map(gw => {
    const rows = squad.map(p => {
      const gwFixtures = fixtures.filter(f => f.event === gw && !f.finished && (f.team_h === p.team || f.team_a === p.team));
      const matches = gwFixtures.length;
      let pred = 0;
      if (matches > 0) {
        // predictPlayerPoints рахує з fromGW; беремо прогноз саме цього туру
        const r = predictPlayerPoints(p, teamsMap, fixtures, gw, matches, weights);
        pred = r.total;
      }
      return {
        player: p,
        matches,
        pred
      };
    });

    // Оптимальна одинадцятка цього туру (валідна формація)
    const byPos = {
      1: [],
      2: [],
      3: [],
      4: []
    };
    rows.forEach(r => byPos[r.player.element_type].push(r));
    Object.values(byPos).forEach(arr => arr.sort((a, b) => b.pred - a.pred));
    let bestXI = null;
    for (const d of [3, 4, 5]) for (const m of [2, 3, 4, 5]) for (const f of [1, 2, 3]) {
      if (1 + d + m + f !== 11) continue;
      if (byPos[1].length < 1 || byPos[2].length < d || byPos[3].length < m || byPos[4].length < f) continue;
      const xi = [...byPos[1].slice(0, 1), ...byPos[2].slice(0, d), ...byPos[3].slice(0, m), ...byPos[4].slice(0, f)];
      const total = xi.reduce((s, r) => s + r.pred, 0);
      if (!bestXI || total > bestXI.total) bestXI = {
        xi,
        total,
        formation: `${d}-${m}-${f}`
      };
    }
    const xiIds = new Set((bestXI?.xi || []).map(r => r.player.id));
    const bench = rows.filter(r => !xiIds.has(r.player.id));
    const benchTotal = bench.reduce((s, r) => s + r.pred, 0);
    const blanks = rows.filter(r => r.matches === 0).length;
    const doubles = rows.filter(r => r.matches >= 2).length;

// Compute expected points for a single gameweek from underlying stats.
function expectedPointsForGW(pos, gw) {
  // gw: { minutes, expected_goals, expected_assists, expected_goals_conceded }

  if (mins === 0) return 0;
  const xG = parseFloat(gw.expected_goals) || 0;
  const xA = parseFloat(gw.expected_assists) || 0;
  const xGC = parseFloat(gw.expected_goals_conceded) || 0;
  const goalVal = pos === 4 ? 4 : pos === 3 ? 5 : 6; // FWD/MID/DEF-GK
  const csVal = pos === 1 || pos === 2 ? 4 : pos === 3 ? 1 : 0;
  const appearance = mins >= 60 ? 2 : 1;
  // Clean sheet probability ~ Poisson P(0 conceded) = e^-xGC (only counts if played 60+)
  const csProb = mins >= 60 ? Math.exp(-xGC) : 0;
  // GK/DEF also lose ~0.33 pt per 2 goals conceded (approx)
  const concededPenalty = pos === 1 || pos === 2 ? -(xGC / 2) * 0.5 : 0;
  return appearance + xG * goalVal + xA * 3 + csProb * csVal + concededPenalty;
}
