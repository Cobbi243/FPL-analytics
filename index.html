// ============================================================
// STORAGE (localStorage shim)
// ============================================================
const storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    if (v === null) return null;
    return { value: v };
  },
  set: async (key, value) => {
    try { localStorage.setItem(key, value); return { value }; } catch (e) { return null; }
  },
};

// ============================================================
// DATA FETCHING
// ============================================================
async function fetchWithProxy(url) {
  let lastErr;
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(url), { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('Усі проксі не відповідають');
}

async function loadFPLData(forceRefresh = false) {
  if (!forceRefresh) {
    try {
      const cached = await storage.get('fpl-cache');
      if (cached) {
        const parsed = JSON.parse(cached.value);
        if (Date.now() - parsed.ts < CACHE_TTL) {
          return { ...parsed.data, fromCache: true, cachedAt: parsed.ts };
        }
      }
    } catch (e) {}
  }

  const [bootstrap, fixtures] = await Promise.all([
    fetchWithProxy(`${FPL_API}/bootstrap-static/`),
    fetchWithProxy(`${FPL_API}/fixtures/`),
  ]);

  const data = { bootstrap, fixtures };
  try { await storage.set('fpl-cache', JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
  return { ...data, fromCache: false, cachedAt: Date.now() };
}

// ============================================================
// ANALYTICS
// ============================================================
function getCurrentGW(events) {
  const current = events.find(e => e.is_current);
  if (current && !current.finished) return current.id;
  const next = events.find(e => e.is_next);
  if (next) return next.id;
  const lastFinished = [...events].reverse().find(e => e.finished);
  return lastFinished ? lastFinished.id : 1;
}

function getNextFixtures(teamId, fixtures, fromGW, count = 5) {
  return fixtures
    .filter(f => !f.finished && f.event !== null && f.event >= fromGW && (f.team_h === teamId || f.team_a === teamId))
    .sort((a, b) => a.event - b.event)
    .slice(0, count)
    .map(f => ({
      gw: f.event,
      isHome: f.team_h === teamId,
      opponent: f.team_h === teamId ? f.team_a : f.team_h,
      difficulty: f.team_h === teamId ? f.team_h_difficulty : f.team_a_difficulty,
      kickoff: f.kickoff_time,
    }));
}

function availabilityFactor(player) {
  if (player.status === 'a') return 1.0;
  if (player.status === 'd') return (player.chance_of_playing_next_round ?? 50) / 100;
  if (player.status === 'i' || player.status === 's' || player.status === 'u') return 0.05;
  if (player.chance_of_playing_next_round !== null) return player.chance_of_playing_next_round / 100;
  return 1.0;
}

function predictPlayerPoints(player, teamsMap, fixtures, fromGW, gwsAhead = 1, weights) {
  const w = weights || { form: 1.0, fdr: 0.5, value: 0.0, minutes: 1.0 };
  const nextFixtures = getNextFixtures(player.team, fixtures, fromGW, gwsAhead);
  if (nextFixtures.length === 0) {
    return { total: 0, perGW: 0, fixtures: [], breakdown: { form: 0, fdr: 0, mins: 0, avail: 0 } };
  }

  const form = parseFloat(player.form) || 0;
  const ppg = parseFloat(player.points_per_game) || 0;
  const baseScore = (form * 0.7 + ppg * 0.3) * w.form;
  const avail = availabilityFactor(player);
  const minutesFactor = w.minutes > 0
    ? (player.minutes > 1000 ? 1.0 : player.minutes > 500 ? 0.85 : player.minutes > 200 ? 0.7 : 0.5)
    : 1.0;

  let total = 0;
  const detailedFixtures = nextFixtures.map(f => {
    const fdrAdj = (3 - f.difficulty) * w.fdr;
    const homeBonus = f.isHome ? 0.3 : 0;
    const fixtureScore = Math.max(0, (baseScore + fdrAdj + homeBonus) * minutesFactor * avail);
    total += fixtureScore;
    return { ...f, score: fixtureScore };
  });

  return {
    total,
    perGW: total / nextFixtures.length,
    fixtures: detailedFixtures,
    breakdown: { form: baseScore, avail, mins: minutesFactor, count: nextFixtures.length },
  };
}

function valueScore(player) {
  const cost = player.now_cost / 10;
  return cost > 0 ? player.total_points / cost : 0;
}

function differentialBoost(player) {
  const sel = parseFloat(player.selected_by_percent) || 0;
  if (sel >= 15) return 1.0;
  return 1.0 + (15 - sel) * 0.02;
}

// ============================================================
// OPTIMIZER
// ============================================================
function optimizeSquad(players, teamsMap, fixtures, fromGW, options = {}) {
  const {
    budget = 1000, maxPerTeam = 3, horizon = 5,
    weights = { form: 1.0, fdr: 0.5, value: 0.0, minutes: 1.0 },
    excluded = new Set(), locked = new Set(),
    seasonEnded = false,
  } = options;

  const scored = players
    .filter(p => !excluded.has(p.id))
    .map(p => {
      let score;
      if (seasonEnded) {
        // Retrospective: weight total season points heavily, plus form for late-season risers
        const form = parseFloat(p.form) || 0;
        score = (p.total_points || 0) * 1.0 + form * 5;
      } else {
        const pred = predictPlayerPoints(p, teamsMap, fixtures, fromGW, horizon, weights);
        score = pred.total;
      }
      return { ...p, predScore: score, predPerGW: score / Math.max(1, horizon) };
    })
    .filter(p => p.predScore > 0 || locked.has(p.id));

  const byPos = { 1: [], 2: [], 3: [], 4: [] };
  scored.forEach(p => byPos[p.element_type].push(p));
  Object.keys(byPos).forEach(pos => byPos[pos].sort((a, b) => b.predScore - a.predScore));

  const squad = [];
  const teamCount = {};
  let remainingBudget = budget;
  const posFilled = { 1: 0, 2: 0, 3: 0, 4: 0 };

  const lockedPlayers = scored.filter(p => locked.has(p.id));
  for (const p of lockedPlayers) {
    if (posFilled[p.element_type] >= POSITION_QUOTAS[p.element_type]) continue;
    if ((teamCount[p.team] || 0) >= maxPerTeam) continue;
    if (remainingBudget - p.now_cost < 0) continue;
    squad.push(p);
    teamCount[p.team] = (teamCount[p.team] || 0) + 1;
    remainingBudget -= p.now_cost;
    posFilled[p.element_type]++;
  }

  const minPrices = { 1: 40, 2: 40, 3: 45, 4: 45 };
  const fillOrder = [4, 3, 2, 1];

  for (const pos of fillOrder) {
    const need = POSITION_QUOTAS[pos] - posFilled[pos];
    if (need <= 0) continue;

    for (let slotIdx = 0; slotIdx < need; slotIdx++) {
      let reserved = 0;
      fillOrder.forEach(otherPos => {
        if (otherPos === pos) {
          reserved += (need - slotIdx - 1) * minPrices[pos];
        } else {
          const otherNeed = POSITION_QUOTAS[otherPos] - posFilled[otherPos];
          reserved += otherNeed * minPrices[otherPos];
        }
      });
      const availForThis = remainingBudget - reserved;

      const candidate = byPos[pos].find(p =>
        !squad.find(s => s.id === p.id) &&
        p.now_cost <= availForThis &&
        (teamCount[p.team] || 0) < maxPerTeam
      );

      if (candidate) {
        squad.push(candidate);
        teamCount[candidate.team] = (teamCount[candidate.team] || 0) + 1;
        remainingBudget -= candidate.now_cost;
        posFilled[pos]++;
      } else {
        const fallback = byPos[pos].find(p =>
          !squad.find(s => s.id === p.id) &&
          p.now_cost <= remainingBudget &&
          (teamCount[p.team] || 0) < maxPerTeam
        );
        if (fallback) {
          squad.push(fallback);
          teamCount[fallback.team] = (teamCount[fallback.team] || 0) + 1;
          remainingBudget -= fallback.now_cost;
          posFilled[pos]++;
        }
      }
    }
  }

  const totalCost = squad.reduce((s, p) => s + p.now_cost, 0);
  const valid = squad.length === 15 && totalCost <= budget;

  const formations = [
    [1, 3, 4, 3], [1, 3, 5, 2], [1, 4, 4, 2], [1, 4, 3, 3], [1, 4, 5, 1], [1, 5, 3, 2], [1, 5, 4, 1]
  ];
  let bestXI = null;
  let bestXIScore = -Infinity;
  for (const f of formations) {
    const sortedByPos = { 1: [], 2: [], 3: [], 4: [] };
    squad.forEach(p => sortedByPos[p.element_type].push(p));
    Object.keys(sortedByPos).forEach(pos => sortedByPos[pos].sort((a, b) => b.predScore - a.predScore));
    if (sortedByPos[1].length < f[0] || sortedByPos[2].length < f[1] || sortedByPos[3].length < f[2] || sortedByPos[4].length < f[3]) continue;
    const xi = [
      ...sortedByPos[1].slice(0, f[0]),
      ...sortedByPos[2].slice(0, f[1]),
      ...sortedByPos[3].slice(0, f[2]),
      ...sortedByPos[4].slice(0, f[3]),
    ];
    const score = xi.reduce((s, p) => s + p.predScore, 0);
    if (score > bestXIScore) {
      bestXIScore = score;
      bestXI = { players: xi, formation: f };
    }
  }

  const captain = bestXI ? [...bestXI.players].sort((a, b) => b.predScore - a.predScore)[0] : null;
  const vice = bestXI ? [...bestXI.players].sort((a, b) => b.predScore - a.predScore)[1] : null;

  return {
    squad,
    startingXI: bestXI?.players || [],
    formation: bestXI?.formation || null,
    bench: squad.filter(p => !bestXI?.players.find(x => x.id === p.id)),
    captain, vice, totalCost, valid,
    predictedTotal: bestXIScore,
  };
}

};
function wcTeamStrength(abbr) { return WC_TEAM_STRENGTH[abbr] ?? 1; }

const WC_POSITIONS_UA = { 'GK': 'ВРТ', 'DEF': 'ЗАХ', 'MID': 'ПІВ', 'FWD': 'НАП' };
const WC_POSITION_QUOTAS = { 'GK': 2, 'DEF': 5, 'MID': 5, 'FWD': 3 };

async function loadWCData(forceRefresh = false) {
  if (!forceRefresh) {
    try {
      const cached = await storage.get('wc-cache');
      if (cached) {
        const parsed = JSON.parse(cached.value);
        if (Date.now() - parsed.ts < WC_CACHE_TTL) return { ...parsed.data, fromCache: true, cachedAt: parsed.ts };
      }
    } catch (e) {}
  }
  const [players, rounds] = await Promise.all([
    fetchWithProxy(`${WC_API}/players.json`),
    fetchWithProxy(`${WC_API}/rounds.json`),
  ]);
  const teamsMap = {};
  rounds.forEach(r => (r.tournaments || []).forEach(t => {
    if (!teamsMap[t.homeSquadId]) teamsMap[t.homeSquadId] = { id: t.homeSquadId, name: t.homeSquadName, abbr: t.homeSquadAbbr };
    if (!teamsMap[t.awaySquadId]) teamsMap[t.awaySquadId] = { id: t.awaySquadId, name: t.awaySquadName, abbr: t.awaySquadAbbr };
  }));
  const teams = Object.values(teamsMap).sort((a, b) => a.name.localeCompare(b.name));
  const data = { players, rounds, teams, teamsMap };
  try { await storage.set('wc-cache', JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
  return { ...data, fromCache: false, cachedAt: Date.now() };
}

function wcCurrentRound(rounds) {
  const now = Date.now();
  const current = rounds.find(r => {
    const s = new Date(r.startDate).getTime(), e = new Date(r.endDate).getTime();
    return now >= s && now <= e;
  });
  if (current) return current.id;
  const next = rounds.find(r => new Date(r.startDate).getTime() > now);
  if (next) return next.id;
  return rounds[rounds.length - 1]?.id || 1;
}

function wcNextFixturesForTeam(squadId, rounds, fromRoundId, count = 3) {
  const fixtures = [];
  for (const round of rounds) {
    if (round.id < fromRoundId) continue;
    if (fixtures.length >= count) break;
    for (const t of (round.tournaments || [])) {
      if (t.homeSquadId === squadId || t.awaySquadId === squadId) {
        const isHome = t.homeSquadId === squadId;
        const opp = isHome
          ? { id: t.awaySquadId, name: t.awaySquadName, abbr: t.awaySquadAbbr }
          : { id: t.homeSquadId, name: t.homeSquadName, abbr: t.homeSquadAbbr };
        fixtures.push({
          roundId: round.id, isHome, opp,
          difficulty: wcTeamStrength(opp.abbr),
          status: t.status, date: t.date, venue: t.venueName,
        });
        if (fixtures.length >= count) break;
      }
    }
  }
  return fixtures;
}

function wcPredictPlayerScore(player, teamsMap, rounds, fromRoundId, fixturesAhead = 3) {
  const team = teamsMap[player.squadId];
  if (!team) return { total: 0, fixtures: [] };
  const ownStrength = wcTeamStrength(team.abbr);
  const fixtures = wcNextFixturesForTeam(player.squadId, rounds, fromRoundId, fixturesAhead);
  if (fixtures.length === 0) return { total: 0, fixtures: [] };

  const form = parseFloat(player.stats?.form) || 0;
  const totalPoints = player.stats?.totalPoints || 0;
  const price = player.price || 0;
  // Pre-tournament: price proxies player quality; after matches: weight real form heavily
  const baseQuality = totalPoints > 0
    ? (totalPoints / Math.max(1, player.stats?.roundPoints?.length || 1)) + form * 0.5
    : price * 0.9; // 4.0m -> 3.6 base, 10.0m -> 9.0 base

  let total = 0;
  const detailed = fixtures.map(f => {
    const strengthAdv = ownStrength - f.difficulty; // -4 to +4
    const homeBonus = f.isHome ? 0.4 : 0;
    const fixtureScore = Math.max(0, baseQuality + strengthAdv * 1.0 + homeBonus);
    total += fixtureScore;
    return { ...f, score: fixtureScore };
  });
  return { total, perFixture: total / fixtures.length, fixtures: detailed };
}

function wcOptimizeSquad(players, teamsMap, rounds, fromRoundId, options = {}) {
  const { budget = 10000, maxPerTeam = 3, fixturesAhead = 3 } = options;
  const scored = players
    .filter(p => p.status === 'playing')
    .map(p => {
      const pred = wcPredictPlayerScore(p, teamsMap, rounds, fromRoundId, fixturesAhead);
      return { ...p, predScore: pred.total, predFixtures: pred.fixtures, priceCents: Math.round(p.price * 100) };
    })
    .filter(p => p.predScore > 0);

  const byPos = { 'GK': [], 'DEF': [], 'MID': [], 'FWD': [] };
  scored.forEach(p => byPos[p.position]?.push(p));
  Object.keys(byPos).forEach(pos => byPos[pos].sort((a, b) => b.predScore - a.predScore));

  const squad = [];
  const teamCount = {};
  let remaining = budget;
  const posFilled = { 'GK': 0, 'DEF': 0, 'MID': 0, 'FWD': 0 };
  const minPrice = { 'GK': 350, 'DEF': 350, 'MID': 400, 'FWD': 400 };
  const fillOrder = ['FWD', 'MID', 'DEF', 'GK'];

  for (const pos of fillOrder) {
    const need = WC_POSITION_QUOTAS[pos] - posFilled[pos];
    for (let s = 0; s < need; s++) {
      let reserved = 0;
      fillOrder.forEach(other => {
        if (other === pos) reserved += (need - s - 1) * minPrice[pos];
        else reserved += (WC_POSITION_QUOTAS[other] - posFilled[other]) * minPrice[other];
      });
      const avail = remaining - reserved;
      const pick = byPos[pos].find(p => !squad.find(x => x.id === p.id) && p.priceCents <= avail && (teamCount[p.squadId] || 0) < maxPerTeam)
        || byPos[pos].find(p => !squad.find(x => x.id === p.id) && p.priceCents <= remaining && (teamCount[p.squadId] || 0) < maxPerTeam);
      if (pick) {
        squad.push(pick);
        teamCount[pick.squadId] = (teamCount[pick.squadId] || 0) + 1;
        remaining -= pick.priceCents;
        posFilled[pos]++;
      }
    }
  }

  const formations = [
    { GK: 1, DEF: 3, MID: 4, FWD: 3 }, { GK: 1, DEF: 3, MID: 5, FWD: 2 },
    { GK: 1, DEF: 4, MID: 4, FWD: 2 }, { GK: 1, DEF: 4, MID: 3, FWD: 3 },
    { GK: 1, DEF: 4, MID: 5, FWD: 1 }, { GK: 1, DEF: 5, MID: 3, FWD: 2 },
    { GK: 1, DEF: 5, MID: 4, FWD: 1 },
  ];
  const sortedSquad = { 'GK': [], 'DEF': [], 'MID': [], 'FWD': [] };
  squad.forEach(p => sortedSquad[p.position]?.push(p));
  Object.keys(sortedSquad).forEach(pos => sortedSquad[pos].sort((a, b) => b.predScore - a.predScore));
  let bestXI = null, bestScore = -Infinity;
  for (const f of formations) {
    if (sortedSquad.GK.length < f.GK || sortedSquad.DEF.length < f.DEF || sortedSquad.MID.length < f.MID || sortedSquad.FWD.length < f.FWD) continue;
    const xi = [...sortedSquad.GK.slice(0, f.GK), ...sortedSquad.DEF.slice(0, f.DEF), ...sortedSquad.MID.slice(0, f.MID), ...sortedSquad.FWD.slice(0, f.FWD)];
    const score = xi.reduce((s, p) => s + p.predScore, 0);
    if (score > bestScore) { bestScore = score; bestXI = { players: xi, formation: f }; }
  }
  const capt = bestXI ? [...bestXI.players].sort((a, b) => b.predScore - a.predScore)[0] : null;
  const vc = bestXI ? [...bestXI.players].sort((a, b) => b.predScore - a.predScore)[1] : null;
  return {
    squad,
    startingXI: bestXI?.players || [],
    formation: bestXI?.formation,
    bench: squad.filter(p => !bestXI?.players.find(x => x.id === p.id)),
    captain: capt, vice: vc,
    totalCost: squad.reduce((s, p) => s + p.priceCents, 0),
    valid: squad.length === 15,
    predictedTotal: bestScore,
  };
}

    const pred = predictPlayerPoints(p, teamsMap, fixtures, currentGW, 5, weights);
    return {
      ...p, team: teamsMap[p.team],
      predNext: predictPlayerPoints(p, teamsMap, fixtures, currentGW, 1, weights).total,
      pred5: pred.total, value: valueScore(p),
    };
  }), [players, teamsMap, fixtures, currentGW, weights]);

  const filtered = useMemo(() => {
    let res = enriched;
    if (search) {
      const q = search.toLowerCase();
      res = res.filter(p => `${p.first_name} ${p.second_name} ${p.web_name}`.toLowerCase().includes(q) ||
        p.team?.name?.toLowerCase().includes(q) || p.team?.short_name?.toLowerCase().includes(q));
    }
    if (posFilter !== 'all') res = res.filter(p => p.element_type === Number(posFilter));
    if (teamFilter !== 'all') res = res.filter(p => p.team?.id === Number(teamFilter));
    res = res.filter(p => p.now_cost <= maxCost);
    if (onlyAvailable) res = res.filter(p => p.status === 'a');
    res = [...res].sort((a, b) => {
      let av, bv;
      switch (sortBy) {
        case 'predNext': av = a.predNext; bv = b.predNext; break;
        case 'pred5': av = a.pred5; bv = b.pred5; break;
        case 'form': av = parseFloat(a.form); bv = parseFloat(b.form); break;
        case 'totalPoints': av = a.total_points; bv = b.total_points; break;
        case 'cost': av = a.now_cost; bv = b.now_cost; break;
        case 'value': av = a.value; bv = b.value; break;
        case 'ownership': av = parseFloat(a.selected_by_percent); bv = parseFloat(b.selected_by_percent); break;
        case 'xG': av = parseFloat(a.expected_goals); bv = parseFloat(b.expected_goals); break;
        case 'xA': av = parseFloat(a.expected_assists); bv = parseFloat(b.expected_assists); break;
        default: av = 0; bv = 0;
      }
      return sortDir === 'desc' ? bv - av : av - bv;
    });
    return res.slice(0, 100);
  }, [enriched, search, posFilter, teamFilter, maxCost, sortBy, sortDir, onlyAvailable]);

  const toggleSort = (key) => {
    if (sortBy === key) setSortDir(sortDir === 'desc' ? 'asc' : 'desc');
    else { setSortBy(key); setSortDir('desc'); }
  };

  const SortHeader = ({ k, children, align = 'left' }) => (
    <th className={`px-2 py-2 text-[11px] uppercase tracking-wider text-stone-500 font-medium cursor-pointer hover:text-stone-200 transition-colors select-none ${align === 'right' ? 'text-right' : 'text-left'}`} onClick={() => toggleSort(k)}>
      <span className="inline-flex items-center gap-1">
        {children}
        {sortBy === k && (sortDir === 'desc' ? <Icon name="chevdown" size={11} /> : <Icon name="chevup" size={11} />)}
      </span>
    </th>
  );

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        <div className="relative flex-1 min-w-[200px]">
          <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500" />
          <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Пошук гравця або команди..."
            className="w-full bg-stone-900 border border-stone-800 rounded-lg pl-9 pr-3 py-2 text-sm placeholder:text-stone-600 focus:outline-none focus:border-lime-500/50"
            style={{ fontFamily: 'DM Sans, sans-serif' }} />
        </div>
        <select value={posFilter} onChange={e => setPosFilter(e.target.value)} className="bg-stone-900 border border-stone-800 rounded-lg px-3 py-2 text-sm">
          <option value="all">Усі позиції</option>
          <option value="1">Воротарі</option>
          <option value="2">Захисники</option>
          <option value="3">Півзахисники</option>
          <option value="4">Нападники</option>
        </select>
        <select value={teamFilter} onChange={e => setTeamFilter(e.target.value)} className="bg-stone-900 border border-stone-800 rounded-lg px-3 py-2 text-sm max-w-[180px]">
          <option value="all">Усі команди</option>
          {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <label className="flex items-center gap-2 text-sm text-stone-300 cursor-pointer">
          <input type="checkbox" checked={onlyAvailable} onChange={e => setOnlyAvailable(e.target.checked)} className="accent-lime-500" />
          Тільки доступні
        </label>
        <div className="flex items-center gap-2 text-sm text-stone-400">
          Макс. ціна:
          <input type="range" min="40" max="150" value={maxCost} onChange={e => setMaxCost(Number(e.target.value))} className="accent-lime-500 w-24" />
          <span className="font-mono text-stone-200 w-14">£{(maxCost/10).toFixed(1)}m</span>
        </div>
      </div>

      <div className="overflow-x-auto rounded-xl border border-stone-800">
        <table className="w-full text-sm">
          <thead className="bg-stone-900/70">
            <tr>
              <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider text-stone-500 font-medium">Гравець</th>
              <SortHeader k="cost" align="right">Ціна</SortHeader>
              <SortHeader k="predNext" align="right">След.</SortHeader>
              <SortHeader k="pred5" align="right">5 турів</SortHeader>
              <SortHeader k="form" align="right">Форма</SortHeader>
              <SortHeader k="totalPoints" align="right">Очки</SortHeader>
              <SortHeader k="value" align="right">Цінн.</SortHeader>
              <SortHeader k="ownership" align="right">%</SortHeader>
              <SortHeader k="xG" align="right">xG</SortHeader>
              <SortHeader k="xA" align="right">xA</SortHeader>
            </tr>
          </thead>
          <tbody>
            {filtered.map((p, i) => (
              <tr key={p.id} onClick={() => onPlayerClick(p)} className={`border-t border-stone-900 hover:bg-stone-900/40 cursor-pointer transition-colors ${i % 2 === 0 ? 'bg-stone-950/30' : ''}`}>
                <td className="px-2 py-2">
                  <div className="flex items-center gap-2">
                    <StatusDot player={p} />
                    <div>
                      <div className="font-medium" style={{ fontFamily: 'DM Sans, sans-serif' }}>{p.web_name}</div>
                      <div className="text-[10px] text-stone-500">{p.team?.short_name} · {POSITIONS_UA[p.element_type]}</div>
                    </div>
                  </div>
                </td>
                <td className="px-2 py-2 text-right font-mono text-stone-200">£{(p.now_cost/10).toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-lime-400">{p.predNext.toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-300">{p.pred5.toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-300">{p.form}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-300">{p.total_points}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-400">{p.value.toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-500">{p.selected_by_percent}%</td>
                <td className="px-2 py-2 text-right font-mono text-stone-400">{p.expected_goals}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-400">{p.expected_assists}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {filtered.length === 0 && <div className="p-8 text-center text-stone-500 text-sm">Нічого не знайдено за цими фільтрами</div>}
      </div>
      <div className="text-xs text-stone-600 text-center">Показано перші 100 результатів</div>
    </div>
  );
}

// ============================================================
// FIXTURES VIEW
// ============================================================
function FixturesView({ teams, fixtures, currentGW }) {
  const upcomingGWs = useMemo(() => {
    const gws = [...new Set(fixtures.filter(f => !f.finished && f.event !== null).map(f => f.event))].sort((a, b) => a - b);
    return gws.slice(0, 8);
  }, [fixtures]);

  const matrix = useMemo(() => {
    return teams.map(team => {
      const row = upcomingGWs.map(gw => {
        const fix = fixtures.find(f => f.event === gw && (f.team_h === team.id || f.team_a === team.id));
        if (!fix) return null;
        const isHome = fix.team_h === team.id;
        const opponent = teams.find(t => t.id === (isHome ? fix.team_a : fix.team_h));
        return { gw, isHome, opp: opponent, fdr: isHome ? fix.team_h_difficulty : fix.team_a_difficulty };
      });
      const avgFDR = row.filter(Boolean).reduce((s, f) => s + f.fdr, 0) / Math.max(1, row.filter(Boolean).length);
      return { team, fixtures: row, avgFDR };
    }).sort((a, b) => a.avgFDR - b.avgFDR);
  }, [teams, fixtures, upcomingGWs]);

  if (upcomingGWs.length === 0) {
    return <EmptyState message="Сезон завершено — немає майбутніх турів. Зайди в серпні на старті нового сезону 🏆" />;
  }

  return (
    <div className="space-y-4">
      <div className="text-sm text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>
        Складність наступних {upcomingGWs.length} турів. Команди відсортовано від найлегшого календаря до найскладнішого.
      </div>
      <div className="flex items-center gap-3 text-xs flex-wrap">
        <span className="text-stone-500">Легенда:</span>
        {[1, 2, 3, 4, 5].map(f => (
          <div key={f} className="flex items-center gap-1.5">
            <div className="w-3 h-3 rounded" style={{ backgroundColor: FDR_COLORS[f].bg }} />
            <span className="text-stone-400">{FDR_COLORS[f].label}</span>
          </div>
        ))}
      </div>
      <div className="overflow-x-auto rounded-xl border border-stone-800">
        <table className="w-full">
          <thead>
            <tr className="bg-stone-900/70">
              <th className="px-3 py-2 text-left text-[11px] uppercase tracking-wider text-stone-500 font-medium sticky left-0 bg-stone-900/70">Команда</th>
              <th className="px-2 py-2 text-center text-[11px] uppercase tracking-wider text-stone-500 font-medium">Сер.</th>
              {upcomingGWs.map(gw => <th key={gw} className="px-1 py-2 text-center text-[11px] uppercase tracking-wider text-stone-500 font-medium min-w-[50px]">GW{gw}</th>)}
            </tr>
          </thead>
          <tbody>
            {matrix.map(({ team, fixtures: row, avgFDR }) => (
              <tr key={team.id} className="border-t border-stone-900 hover:bg-stone-900/30">
                <td className="px-3 py-2 font-medium sticky left-0 bg-stone-950" style={{ fontFamily: 'DM Sans, sans-serif' }}>
                  <span className="text-stone-200">{team.name}</span>
                </td>
                <td className="px-2 py-2 text-center font-mono text-stone-400 text-sm">{avgFDR.toFixed(1)}</td>
                {row.map((f, i) => (
                  <td key={i} className="px-1 py-1.5">
                    {f ? <FDRBadge fdr={f.fdr} isHome={f.isHome} oppShort={f.opp?.short_name} /> : <div className="text-center text-stone-700">—</div>}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function CaptainView({ players, teams, fixtures, currentGW, weights, seasonEnded, onPlayerClick }) {
  const teamsMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);

  if (seasonEnded) {
    return (
      <div className="space-y-4">
        <EmptyState message="Сезон 2025/26 завершено — немає кого вибирати капітаном на наступний тур. Повертайся в кінці липня, на старт нового сезону FPL 🏆" />
        <div className="text-center text-xs text-stone-600">А поки що — глянь топ-бомбардирів сезону на вкладці «Дашборд»</div>
      </div>
    );
  }
  const candidates = useMemo(() => {
    return players
      .filter(p => p.status === 'a' || p.status === 'd')
      .filter(p => p.element_type === 3 || p.element_type === 4 || (p.element_type === 2 && parseFloat(p.form) > 5))
      .map(p => {
        const pred = predictPlayerPoints(p, teamsMap, fixtures, currentGW, 1, weights);
        return { ...p, team: teamsMap[p.team], pred: pred.total, predFixtures: pred.fixtures, breakdown: pred.breakdown };
      })
      .filter(p => p.pred > 0)
      .sort((a, b) => b.pred - a.pred)
      .slice(0, 12);
  }, [players, teamsMap, fixtures, currentGW, weights]);

  if (candidates.length === 0) {
    return <EmptyState message="Немає даних для прогнозу на наступний тур (можливо, сезон завершено)" />;
  }

  return (
    <div className="space-y-4">
      <div className="text-sm text-stone-400 mb-2" style={{ fontFamily: 'DM Sans, sans-serif' }}>
        Топ-12 кандидатів на капітана на GW{currentGW}. Скоринг враховує форму, складність суперника, домашнє поле і ризик ротації.
      </div>
      <div className="grid gap-3">
        {candidates.map((p, i) => (
          <button key={p.id} onClick={() => onPlayerClick(p)}
            className={`text-left p-4 rounded-xl border transition-all ${
              i === 0 ? 'border-lime-500/40 bg-gradient-to-r from-lime-950/30 to-stone-900/30' :
              i < 3 ? 'border-stone-700 bg-stone-900/40' : 'border-stone-800 bg-stone-900/20'
            } hover:border-lime-500/40`}>
            <div className="grid grid-cols-12 gap-3 items-center">
              <div className="col-span-1 text-center">
                {i === 0 ? <Icon name="crown" size={24} className="text-lime-400 mx-auto" /> : <div className="text-2xl font-mono text-stone-600" style={{ fontFamily: 'Fraunces, serif' }}>{i + 1}</div>}
              </div>
              <div className="col-span-5 md:col-span-4">
                <div className="flex items-center gap-2">
                  <StatusDot player={p} />
                  <div className="font-semibold" style={{ fontFamily: 'DM Sans, sans-serif' }}>{p.first_name} {p.second_name}</div>
                </div>
                <div className="text-xs text-stone-400 mt-1">{p.team?.name} · {POSITIONS_UA[p.element_type]} · £{(p.now_cost/10).toFixed(1)}m</div>
              </div>
              <div className="col-span-3 md:col-span-3 flex gap-1.5 flex-wrap">
                {p.predFixtures.map((f, fi) => <FDRBadge key={fi} fdr={f.difficulty} isHome={f.isHome} oppShort={teamsMap[f.opponent]?.short_name} />)}
              </div>
              <div className="col-span-3 md:col-span-4 grid grid-cols-3 gap-2 text-right">
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-stone-600">Очк.</div>
                  <div className="font-mono text-lg text-lime-400">{p.pred.toFixed(1)}</div>
                </div>
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-stone-600">Форма</div>
                  <div className="font-mono text-lg text-stone-200">{p.form}</div>
                </div>
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-stone-600">Власн.</div>
                  <div className="font-mono text-lg text-stone-400">{p.selected_by_percent}%</div>
                </div>
              </div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

// OPTIMIZER VIEW
// ============================================================
function OptimizerView({ players, teams, fixtures, currentGW, weights, seasonEnded, onPlayerClick }) {
  const teamsMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);
  const [horizon, setHorizon] = useState(5);
  const [maxBudget, setMaxBudget] = useState(1000);
  const [maxPerTeam, setMaxPerTeam] = useState(3);
  const [result, setResult] = useState(null);
  const [computing, setComputing] = useState(false);

  const run = useCallback(() => {
    setComputing(true);
    setTimeout(() => {
      const r = optimizeSquad(players, teamsMap, fixtures, currentGW, {
        budget: maxBudget, maxPerTeam, horizon, weights, seasonEnded,
        excluded: new Set(), locked: new Set(),
      });
      setResult(r);
      setComputing(false);
    }, 50);
  }, [players, teamsMap, fixtures, currentGW, maxBudget, maxPerTeam, horizon, weights, seasonEnded]);

  useEffect(() => { run(); }, []); // eslint-disable-line

  const PlayerSlot = ({ p, isCaptain, isVice, isBench }) => (
    <button onClick={() => onPlayerClick(p)} className={`relative w-full p-2.5 rounded-lg border text-left transition-all ${
      isCaptain ? 'border-lime-500/50 bg-lime-950/20' : isVice ? 'border-stone-500/40 bg-stone-800/40' :
      isBench ? 'border-stone-800 bg-stone-900/20' : 'border-stone-800 bg-stone-900/40'
    } hover:border-lime-500/40`}>
      {isCaptain && <Icon name="crown" size={12} className="absolute top-1 right-1 text-lime-400" />}
      {isVice && <span className="absolute top-1 right-1 text-[9px] font-mono text-stone-400">VC</span>}
      <div className="flex items-center gap-1">
        <StatusDot player={p} />
        <div className="font-semibold text-sm truncate" style={{ fontFamily: 'DM Sans, sans-serif' }}>{p.web_name}</div>
      </div>
      <div className="text-[10px] text-stone-500 mt-0.5">{teamsMap[p.team]?.short_name} · £{(p.now_cost/10).toFixed(1)}m</div>
      <div className="text-xs text-lime-400 font-mono mt-1">{p.predScore.toFixed(1)} pts</div>
    </button>
  );

  return (
    <div className="space-y-6">
      <div className="text-sm text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>
        {seasonEnded
          ? '🏆 Сезон завершено — підбираю «команду сезону» на основі підсумкових очок і форми. Корисно щоб подивитись, як виглядає ідеальний ретроспективний склад.'
          : 'Підбирає оптимальний склад 15 гравців під твої обмеження. Алгоритм: жадібна евристика з врахуванням прогнозу очок, бюджету, позицій і клубів.'}
      </div>
      <div className="grid md:grid-cols-3 gap-4 p-4 rounded-xl border border-stone-800 bg-stone-900/40">
        <div>
          <label className="text-xs uppercase tracking-wider text-stone-500 block mb-2">{seasonEnded ? 'Контекст оцінки' : 'Горизонт планування'}</label>
          <select value={horizon} onChange={e => setHorizon(Number(e.target.value))} className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-sm" disabled={seasonEnded}>
            <option value="1">Наступний тур</option>
            <option value="3">3 тури</option>
            <option value="5">5 турів</option>
            <option value="8">8 турів</option>
          </select>
        </div>
        <div>
          <label className="text-xs uppercase tracking-wider text-stone-500 block mb-2">Бюджет: £{(maxBudget/10).toFixed(1)}m</label>
          <input type="range" min="850" max="1050" value={maxBudget} onChange={e => setMaxBudget(Number(e.target.value))} className="w-full accent-lime-500" />
        </div>
        <div>
          <label className="text-xs uppercase tracking-wider text-stone-500 block mb-2">Макс. з одного клубу: {maxPerTeam}</label>
          <input type="range" min="1" max="3" value={maxPerTeam} onChange={e => setMaxPerTeam(Number(e.target.value))} className="w-full accent-lime-500" />
        </div>
      </div>
      <button onClick={run} disabled={computing}
        className="px-5 py-2.5 bg-lime-500 text-stone-950 font-semibold rounded-lg hover:bg-lime-400 transition-colors disabled:opacity-50"
        style={{ fontFamily: 'DM Sans, sans-serif' }}>
        {computing ? 'Розрахунок...' : 'Згенерувати склад'}
      </button>

      {result && (
        <div className="space-y-6">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <Stat label="Вартість" value={`£${(result.totalCost/10).toFixed(1)}m`} />
            <Stat label="Залишок" value={`£${((maxBudget - result.totalCost)/10).toFixed(1)}m`} />
            <Stat label="Прогноз" value={result.predictedTotal.toFixed(1)} accent />
            <Stat label="Формація" value={result.formation ? result.formation.slice(1).join('-') : '—'} />
          </div>

          {result.formation && (
            <div>
              <div className="text-sm uppercase tracking-wider text-stone-400 mb-3 flex items-center gap-2" style={{ fontFamily: 'DM Sans, sans-serif' }}>
                <Icon name="star" size={14} /> Стартовий склад
              </div>
              <div className="rounded-xl border border-stone-800 bg-gradient-to-b from-emerald-950/20 to-stone-950 p-4 space-y-3">
                {[1, 2, 3, 4].map(pos => {
                  const inPos = result.startingXI.filter(p => p.element_type === pos);
                  if (inPos.length === 0) return null;
                  return (
                    <div key={pos} className="grid gap-2" style={{ gridTemplateColumns: `repeat(${inPos.length}, minmax(0, 1fr))` }}>
                      {inPos.map(p => <PlayerSlot key={p.id} p={p} isCaptain={p.id === result.captain?.id} isVice={p.id === result.vice?.id} />)}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {result.bench.length > 0 && (
            <div>
              <div className="text-sm uppercase tracking-wider text-stone-400 mb-3" style={{ fontFamily: 'DM Sans, sans-serif' }}>Лавка</div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                {result.bench.map(p => <PlayerSlot key={p.id} p={p} isBench />)}
              </div>
            </div>
          )}

          {!result.valid && (
            <div className="p-3 rounded-lg border border-orange-500/40 bg-orange-950/20 text-orange-300 text-sm flex items-start gap-2">
              <Icon name="alert" size={16} className="flex-shrink-0 mt-0.5" />
              <div>Не вдалося сформувати повний склад під ці обмеження — спробуй збільшити бюджет.</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ============================================================
// WC SHARED PIECES
// ============================================================
function WCStatusDot({ player }) {
  let color = '#22c55e', title = 'У заявці';
  if (player.status === 'injured') { color = '#ef4444'; title = 'Травмований'; }
  else if (player.status === 'suspended') { color = '#ef4444'; title = 'Дискваліфікований'; }
  else if (player.status === 'doubtful') { color = '#eab308'; title = 'Під сумнівом'; }
  return <span className="inline-block w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: color }} title={title} />;
}
function WCFDRBadge({ difficulty, isHome, oppAbbr }) {
  // difficulty here = opponent strength (1=easy minnow, 5=top contender)
  const c = FDR_COLORS[difficulty] || FDR_COLORS[3];
  return (
    <div className="text-[10px] font-mono px-1.5 py-1 rounded text-center leading-tight whitespace-nowrap" style={{ backgroundColor: c.bg, color: c.text }}>
      <div className="font-semibold">{oppAbbr}</div>
      <div className="opacity-75 text-[9px]">{isHome ? 'д' : 'в'}</div>
    </div>
  );
}
function WCRankedRow({ rank, player, team, metric, metricLabel, onClick }) {
  return (
    <button onClick={onClick} className="w-full flex items-center gap-3 p-2.5 rounded-lg border border-stone-900 bg-stone-950/40 hover:bg-stone-900/60 hover:border-stone-700 transition-all text-left">
      <div className="font-mono text-stone-600 w-6 text-sm">{rank}</div>
      <WCStatusDot player={player} />
      <div className="min-w-0 flex-1">
        <div className="text-sm font-medium truncate" style={{ fontFamily: 'DM Sans, sans-serif' }}>{player.firstName?.[0]}. {player.lastName}</div>
        <div className="text-[11px] text-stone-500">{team?.abbr} · {WC_POSITIONS_UA[player.position]} · £{player.price.toFixed(1)}m</div>
      </div>
      <div className="text-right flex-shrink-0">
        <div className="font-mono text-sm text-lime-400">{metric}</div>
        <div className="text-[10px] text-stone-600">{metricLabel}</div>
      </div>
    </button>
  );
}

// WC DASHBOARD VIEW
// ============================================================
function WCDashboardView({ players, teams, teamsMap, rounds, currentRoundId, onPlayerClick }) {
  const round = rounds.find(r => r.id === currentRoundId);
  const enriched = useMemo(() => {
    return players
      .filter(p => p.status === 'playing')
      .map(p => {
        const pred = wcPredictPlayerScore(p, teamsMap, rounds, currentRoundId, 3);
        return { ...p, team: teamsMap[p.squadId], predScore: pred.total, predFixtures: pred.fixtures };
      })
      .filter(p => p.predScore > 0);
  }, [players, teamsMap, rounds, currentRoundId]);

  const captains = [...enriched].sort((a, b) => b.predScore - a.predScore).slice(0, 6);
  const valuePicks = [...enriched].filter(p => p.price <= 6.5).sort((a, b) => (b.predScore / b.price) - (a.predScore / a.price)).slice(0, 6);
  const differentials = [...enriched].filter(p => (p.percentSelected ?? 0) < 5 && p.price >= 5).sort((a, b) => b.predScore - a.predScore).slice(0, 6);
  const stars = [...enriched].sort((a, b) => b.price - a.price).slice(0, 6);
  const star = captains[0];

  // Upcoming matches in current round
  const upcomingMatches = (round?.tournaments || []).slice(0, 6);

  return (
    <div className="space-y-8">
      {/* Round banner */}
      {round && (
        <div className="rounded-xl border border-blue-500/30 bg-gradient-to-r from-blue-950/30 to-stone-900/30 p-4 text-sm" style={{ fontFamily: 'DM Sans, sans-serif' }}>
          <div className="flex items-baseline justify-between gap-3 flex-wrap">
            <div>
              <div className="text-xs uppercase tracking-wider text-stone-400">Раунд {round.id}</div>
              <div className="text-stone-200 mt-0.5">{new Date(round.startDate).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })} — {new Date(round.endDate).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })}</div>
            </div>
            <div className="text-xs text-stone-500">{round.tournaments?.length || 0} матчів</div>
          </div>
        </div>
      )}

      {/* Star card */}
      {star && (
        <section>
          <div className="flex items-center gap-2 mb-3 text-stone-400 text-sm uppercase tracking-wider" style={{ fontFamily: 'DM Sans, sans-serif' }}>
            <Icon name="crown" size={14} /> Капітан раунду
          </div>
          <button onClick={() => onPlayerClick(star)} className="w-full text-left relative overflow-hidden rounded-2xl border border-lime-500/20 bg-gradient-to-br from-stone-900 via-stone-900 to-lime-950/40 p-6 md:p-8 hover:border-lime-500/40 transition-all group">
            <div className="absolute top-0 right-0 w-64 h-64 bg-lime-500/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 group-hover:bg-lime-500/10 transition-all" />
            <div className="relative grid md:grid-cols-3 gap-6 items-center">
              <div className="md:col-span-2">
                <div className="flex items-baseline gap-3 flex-wrap">
                  <h2 className="text-4xl md:text-5xl tracking-tight" style={{ fontFamily: 'Fraunces, serif', fontWeight: 500 }}>
                    {star.firstName} {star.lastName}
                  </h2>
                  <div className="text-stone-400 text-sm">{star.team?.name} · {WC_POSITIONS_UA[star.position]}</div>
                </div>
                <p className="text-stone-300 mt-3 text-sm md:text-base leading-relaxed" style={{ fontFamily: 'DM Sans, sans-serif' }}>
                  Топ-вибір на капітана. Збірна {star.team?.name} (сила {wcTeamStrength(star.team?.abbr)}/5), ціна £{star.price.toFixed(1)}m.
                  {star.percentSelected > 0 && <span> Власників: {star.percentSelected}%.</span>}
                </p>
                {star.predFixtures.length > 0 && (
                  <div className="mt-3 flex gap-1.5 flex-wrap">
                    {star.predFixtures.map((f, i) => <WCFDRBadge key={i} difficulty={f.difficulty} isHome={f.isHome} oppAbbr={f.opp.abbr} />)}
                  </div>
                )}
              </div>
              <div className="grid grid-cols-3 md:grid-cols-1 gap-3">
                <Stat label="Прогноз" value={star.predScore.toFixed(1)} accent />
                <Stat label="Ціна" value={`£${star.price.toFixed(1)}m`} />
                <Stat label="Сила збірної" value={`${wcTeamStrength(star.team?.abbr)}/5`} />
              </div>
            </div>
          </button>
        </section>
      )}

      <div className="grid md:grid-cols-2 gap-6">
        <Section icon={<Icon name="crown" size={14} />} title="Топ-капітани" subtitle={`на раунд ${currentRoundId}`}>
          <div className="space-y-2">{captains.map((p, i) => <WCRankedRow key={p.id} rank={i + 1} player={p} team={p.team} metric={p.predScore.toFixed(1)} metricLabel="прог." onClick={() => onPlayerClick(p)} />)}</div>
        </Section>
        <Section icon={<Icon name="star" size={14} />} title="Зірки турніру" subtitle="найдорожчі гравці">
          <div className="space-y-2">{stars.map((p, i) => <WCRankedRow key={p.id} rank={i + 1} player={p} team={p.team} metric={`£${p.price.toFixed(1)}m`} metricLabel="ціна" onClick={() => onPlayerClick(p)} />)}</div>
        </Section>
        <Section icon={<Icon name="target" size={14} />} title="Цінність" subtitle="прогноз за £m">
          <div className="space-y-2">{valuePicks.map((p, i) => <WCRankedRow key={p.id} rank={i + 1} player={p} team={p.team} metric={(p.predScore / p.price).toFixed(2)} metricLabel="прог/£" onClick={() => onPlayerClick(p)} />)}</div>
        </Section>
        <Section icon={<Icon name="sparkles" size={14} />} title="Диференціали" subtitle="низька власність, високий потенціал">
          <div className="space-y-2">{differentials.length > 0 ? differentials.map((p, i) => <WCRankedRow key={p.id} rank={i + 1} player={p} team={p.team} metric={`${p.percentSelected}%`} metricLabel="власн." onClick={() => onPlayerClick(p)} />) : <div className="text-xs text-stone-500 p-3">До старту турніру власність ще не сформувалась.</div>}</div>
        </Section>
      </div>

      {/* Upcoming matches preview */}
      {upcomingMatches.length > 0 && (
        <section>
          <div className="flex items-center gap-2 mb-3 text-stone-400 text-sm uppercase tracking-wider" style={{ fontFamily: 'DM Sans, sans-serif' }}>
            <Icon name="calendar" size={14} /> Перші матчі раунду
          </div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
            {upcomingMatches.map(m => {
              const hDiff = wcTeamStrength(m.homeSquadAbbr);
              const aDiff = wcTeamStrength(m.awaySquadAbbr);
              return (
                <div key={m.id} className="p-3 rounded-lg border border-stone-800 bg-stone-900/40 text-sm">
                  <div className="text-[10px] text-stone-500 mb-1.5">{new Date(m.date).toLocaleString('uk-UA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} · {m.venueCity}</div>
                  <div className="flex items-center justify-between gap-2">
                    <span className="font-semibold" style={{ fontFamily: 'DM Sans, sans-serif' }}>{m.homeSquadName}</span>
                    <span className="text-stone-600 text-xs">vs</span>
                    <span className="font-semibold" style={{ fontFamily: 'DM Sans, sans-serif' }}>{m.awaySquadName}</span>
                  </div>
                  <div className="flex items-center justify-between mt-1 text-[10px] text-stone-500 font-mono">
                    <span>сила {hDiff}/5</span>
                    <span>сила {aDiff}/5</span>
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      )}
    </div>
  );
}

// ============================================================
// WC PLAYERS VIEW
// ============================================================
function WCPlayersView({ players, teams, teamsMap, rounds, currentRoundId, onPlayerClick }) {
  const [search, setSearch] = useState('');
  const [posFilter, setPosFilter] = useState('all');
  const [teamFilter, setTeamFilter] = useState('all');
  const [maxPrice, setMaxPrice] = useState(15);
  const [sortBy, setSortBy] = useState('predScore');
  const [sortDir, setSortDir] = useState('desc');

  const enriched = useMemo(() => players.map(p => {
    const pred = wcPredictPlayerScore(p, teamsMap, rounds, currentRoundId, 3);
    return { ...p, team: teamsMap[p.squadId], predScore: pred.total };
  }), [players, teamsMap, rounds, currentRoundId]);

  const filtered = useMemo(() => {
    let res = enriched;
    if (search) {
      const q = search.toLowerCase();
      res = res.filter(p => `${p.firstName} ${p.lastName}`.toLowerCase().includes(q) || p.team?.name?.toLowerCase().includes(q) || p.team?.abbr?.toLowerCase().includes(q));
    }
    if (posFilter !== 'all') res = res.filter(p => p.position === posFilter);
    if (teamFilter !== 'all') res = res.filter(p => p.team?.id === Number(teamFilter));
    res = res.filter(p => p.price <= maxPrice);
    res = [...res].sort((a, b) => {
      let av, bv;
      switch (sortBy) {
        case 'predScore': av = a.predScore; bv = b.predScore; break;
        case 'price': av = a.price; bv = b.price; break;
        case 'totalPoints': av = a.stats?.totalPoints || 0; bv = b.stats?.totalPoints || 0; break;
        case 'form': av = a.stats?.form || 0; bv = b.stats?.form || 0; break;
        case 'ownership': av = a.percentSelected || 0; bv = b.percentSelected || 0; break;
        default: av = 0; bv = 0;
      }
      return sortDir === 'desc' ? bv - av : av - bv;
    });
    return res.slice(0, 100);
  }, [enriched, search, posFilter, teamFilter, maxPrice, sortBy, sortDir]);

  const toggleSort = k => { if (sortBy === k) setSortDir(sortDir === 'desc' ? 'asc' : 'desc'); else { setSortBy(k); setSortDir('desc'); } };
  const SH = ({ k, children, align = 'left' }) => (
    <th className={`px-2 py-2 text-[11px] uppercase tracking-wider text-stone-500 font-medium cursor-pointer hover:text-stone-200 transition-colors select-none ${align === 'right' ? 'text-right' : 'text-left'}`} onClick={() => toggleSort(k)}>
      <span className="inline-flex items-center gap-1">{children}{sortBy === k && (sortDir === 'desc' ? <Icon name="chevdown" size={11} /> : <Icon name="chevup" size={11} />)}</span>
    </th>
  );

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        <div className="relative flex-1 min-w-[200px]">
          <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500" />
          <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Пошук гравця або збірної..."
            className="w-full bg-stone-900 border border-stone-800 rounded-lg pl-9 pr-3 py-2 text-sm placeholder:text-stone-600 focus:outline-none focus:border-lime-500/50" />
        </div>
        <select value={posFilter} onChange={e => setPosFilter(e.target.value)} className="bg-stone-900 border border-stone-800 rounded-lg px-3 py-2 text-sm">
          <option value="all">Усі позиції</option>
          <option value="GK">Воротарі</option>
          <option value="DEF">Захисники</option>
          <option value="MID">Півзахисники</option>
          <option value="FWD">Нападники</option>
        </select>
        <select value={teamFilter} onChange={e => setTeamFilter(e.target.value)} className="bg-stone-900 border border-stone-800 rounded-lg px-3 py-2 text-sm max-w-[180px]">
          <option value="all">Усі збірні</option>
          {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <div className="flex items-center gap-2 text-sm text-stone-400">
          Макс. ціна:
          <input type="range" min="3.5" max="15" step="0.5" value={maxPrice} onChange={e => setMaxPrice(Number(e.target.value))} className="accent-lime-500 w-24" />
          <span className="font-mono text-stone-200 w-14">£{maxPrice.toFixed(1)}m</span>
        </div>
      </div>
      <div className="overflow-x-auto rounded-xl border border-stone-800">
        <table className="w-full text-sm">
          <thead className="bg-stone-900/70">
            <tr>
              <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider text-stone-500 font-medium">Гравець</th>
              <SH k="price" align="right">Ціна</SH>
              <SH k="predScore" align="right">Прогноз</SH>
              <SH k="totalPoints" align="right">Очки</SH>
              <SH k="form" align="right">Форма</SH>
              <SH k="ownership" align="right">%</SH>
            </tr>
          </thead>
          <tbody>
            {filtered.map((p, i) => (
              <tr key={p.id} onClick={() => onPlayerClick(p)} className={`border-t border-stone-900 hover:bg-stone-900/40 cursor-pointer transition-colors ${i % 2 === 0 ? 'bg-stone-950/30' : ''}`}>
                <td className="px-2 py-2">
                  <div className="flex items-center gap-2">
                    <WCStatusDot player={p} />
                    <div>
                      <div className="font-medium" style={{ fontFamily: 'DM Sans, sans-serif' }}>{p.firstName} {p.lastName}</div>
                      <div className="text-[10px] text-stone-500">{p.team?.abbr} · {WC_POSITIONS_UA[p.position]} · сила {wcTeamStrength(p.team?.abbr)}/5</div>
                    </div>
                  </div>
                </td>
                <td className="px-2 py-2 text-right font-mono text-stone-200">£{p.price.toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-lime-400">{p.predScore.toFixed(1)}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-300">{p.stats?.totalPoints || 0}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-300">{p.stats?.form || 0}</td>
                <td className="px-2 py-2 text-right font-mono text-stone-500">{p.percentSelected || 0}%</td>
              </tr>
            ))}
          </tbody>
        </table>
        {filtered.length === 0 && <div className="p-8 text-center text-stone-500 text-sm">Нічого не знайдено</div>}
      </div>
      <div className="text-xs text-stone-600 text-center">Показано перші 100 результатів</div>
    </div>
  );
}

// WC FIXTURES VIEW
// ============================================================
function WCFixturesView({ rounds, teamsMap }) {
  const [openRound, setOpenRound] = useState(null);
  const upcomingRounds = rounds.filter(r => r.status !== 'finished').slice(0, 5);
  if (upcomingRounds.length === 0) return <EmptyState message="Раундів немає" />;

  return (
    <div className="space-y-3">
      <div className="text-sm text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>
        Розклад наступних раундів. Кольорові бейджі — сила суперника (зелений = слабкий, червоний = топ-команда).
      </div>
      {upcomingRounds.map(r => {
        const isOpen = openRound === r.id || openRound === null && r.id === upcomingRounds[0].id;
        return (
          <div key={r.id} className="rounded-xl border border-stone-800 bg-stone-900/30 overflow-hidden">
            <button onClick={() => setOpenRound(isOpen ? -1 : r.id)} className="w-full p-4 flex items-center justify-between hover:bg-stone-900/50 transition-colors">
              <div className="text-left">
                <div className="text-xs uppercase tracking-wider text-stone-500">Раунд {r.id}</div>
                <div className="text-lg" style={{ fontFamily: 'Fraunces, serif', fontWeight: 500 }}>
                  {new Date(r.startDate).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })} — {new Date(r.endDate).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })}
                </div>
              </div>
              <div className="text-right">
                <div className="text-xs text-stone-500">{r.tournaments?.length || 0} матчів</div>
                <Icon name={isOpen ? "chevup" : "chevdown"} size={14} className="ml-auto mt-1 text-stone-500" />
              </div>
            </button>
            {isOpen && (
              <div className="border-t border-stone-800 p-4 grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
                {(r.tournaments || []).map(m => {
                  const hDiff = wcTeamStrength(m.homeSquadAbbr), aDiff = wcTeamStrength(m.awaySquadAbbr);
                  const finished = m.status === 'finished' || m.homeScore !== null;
                  return (
                    <div key={m.id} className="p-3 rounded-lg border border-stone-800 bg-stone-950/50 text-sm">
                      <div className="text-[10px] text-stone-500 mb-1.5">{new Date(m.date).toLocaleString('uk-UA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} · {m.venueCity}</div>
                      <div className="grid grid-cols-[1fr_auto_1fr] gap-2 items-center">
                        <div className="text-right">
                          <div className="font-semibold text-stone-200" style={{ fontFamily: 'DM Sans, sans-serif' }}>{m.homeSquadName}</div>
                          <div className="text-[10px] text-stone-500 font-mono">сила {hDiff}/5</div>
                        </div>
                        <div className="text-center">
                          {finished ? <div className="font-mono text-lg text-stone-100">{m.homeScore}-{m.awayScore}</div> : <div className="text-xs text-stone-600">vs</div>}
                        </div>
                        <div>
                          <div className="font-semibold text-stone-200" style={{ fontFamily: 'DM Sans, sans-serif' }}>{m.awaySquadName}</div>
                          <div className="text-[10px] text-stone-500 font-mono">сила {aDiff}/5</div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ============================================================
// WC OPTIMIZER VIEW
// ============================================================
function WCOptimizerView({ players, teamsMap, rounds, currentRoundId, onPlayerClick }) {
  const [horizon, setHorizon] = useState(3);
  const [budget, setBudget] = useState(10000);
  const [maxPerTeam, setMaxPerTeam] = useState(3);
  const [result, setResult] = useState(null);
  const [computing, setComputing] = useState(false);

  const run = useCallback(() => {
    setComputing(true);
    setTimeout(() => {
      const r = wcOptimizeSquad(players, teamsMap, rounds, currentRoundId, { budget, maxPerTeam, fixturesAhead: horizon });
      setResult(r);
      setComputing(false);
    }, 50);
  }, [players, teamsMap, rounds, currentRoundId, budget, maxPerTeam, horizon]);

  useEffect(() => { run(); }, []); // eslint-disable-line

  const Slot = ({ p, isCaptain, isVice, isBench }) => (
    <button onClick={() => onPlayerClick(p)} className={`relative w-full p-2.5 rounded-lg border text-left transition-all ${
      isCaptain ? 'border-lime-500/50 bg-lime-950/20' : isVice ? 'border-stone-500/40 bg-stone-800/40' :
      isBench ? 'border-stone-800 bg-stone-900/20' : 'border-stone-800 bg-stone-900/40'
    } hover:border-lime-500/40`}>
      {isCaptain && <Icon name="crown" size={12} className="absolute top-1 right-1 text-lime-400" />}
      {isVice && <span className="absolute top-1 right-1 text-[9px] font-mono text-stone-400">VC</span>}
      <div className="flex items-center gap-1">
        <WCStatusDot player={p} />
        <div className="font-semibold text-sm truncate" style={{ fontFamily: 'DM Sans, sans-serif' }}>{p.firstName?.[0]}. {p.lastName}</div>
      </div>
      <div className="text-[10px] text-stone-500 mt-0.5">{teamsMap[p.squadId]?.abbr} · £{p.price.toFixed(1)}m</div>
      <div className="text-xs text-lime-400 font-mono mt-1">{p.predScore.toFixed(1)} прог.</div>
    </button>
  );

  return (
    <div className="space-y-6">
      <div className="text-sm text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>
        Підбирає склад на 15 гравців під обмеження. Враховує силу збірних, ціну, складність наступних матчів і максимум 3 з однієї збірної.
      </div>
      <div className="grid md:grid-cols-3 gap-4 p-4 rounded-xl border border-stone-800 bg-stone-900/40">
        <div>
          <label className="text-xs uppercase tracking-wider text-stone-500 block mb-2">Горизонт</label>
          <select value={horizon} onChange={e => setHorizon(Number(e.target.value))} className="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-sm">
            <option value="1">Наступний раунд</option>
            <option value="2">2 раунди</option>
            <option value="3">3 раунди (груповий етап)</option>
            <option value="5">5 раундів</option>
          </select>
        </div>
        <div>
          <label className="text-xs uppercase tracking-wider text-stone-500 block mb-2">Бюджет: £{(budget/100).toFixed(1)}m</label>
          <input type="range" min="9000" max="11000" step="100" value={budget} onChange={e => setBudget(Number(e.target.value))} className="w-full accent-lime-500" />
        </div>
        <div>
          <label className="text-xs uppercase tracking-wider text-stone-500 block mb-2">Макс. з збірної: {maxPerTeam}</label>
          <input type="range" min="1" max="3" value={maxPerTeam} onChange={e => setMaxPerTeam(Number(e.target.value))} className="w-full accent-lime-500" />
        </div>
      </div>
      <button onClick={run} disabled={computing} className="px-5 py-2.5 bg-lime-500 text-stone-950 font-semibold rounded-lg hover:bg-lime-400 transition-colors disabled:opacity-50">
        {computing ? 'Розрахунок...' : 'Згенерувати склад'}
      </button>

      {result && (
        <div className="space-y-6">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <Stat label="Вартість" value={`£${(result.totalCost/100).toFixed(1)}m`} />
            <Stat label="Залишок" value={`£${((budget - result.totalCost)/100).toFixed(1)}m`} />
            <Stat label="Прогноз" value={result.predictedTotal.toFixed(1)} accent />
            <Stat label="Формація" value={result.formation ? `${result.formation.DEF}-${result.formation.MID}-${result.formation.FWD}` : '—'} />
          </div>
          {result.formation && (
            <div>
              <div className="text-sm uppercase tracking-wider text-stone-400 mb-3 flex items-center gap-2" style={{ fontFamily: 'DM Sans, sans-serif' }}>
                <Icon name="star" size={14} /> Стартовий склад
              </div>
              <div className="rounded-xl border border-stone-800 bg-gradient-to-b from-emerald-950/20 to-stone-950 p-4 space-y-3">
                {['GK', 'DEF', 'MID', 'FWD'].map(pos => {
                  const inPos = result.startingXI.filter(p => p.position === pos);
                  if (inPos.length === 0) return null;
                  return (
                    <div key={pos} className="grid gap-2" style={{ gridTemplateColumns: `repeat(${inPos.length}, minmax(0, 1fr))` }}>
                      {inPos.map(p => <Slot key={p.id} p={p} isCaptain={p.id === result.captain?.id} isVice={p.id === result.vice?.id} />)}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {result.bench.length > 0 && (
            <div>
              <div className="text-sm uppercase tracking-wider text-stone-400 mb-3" style={{ fontFamily: 'DM Sans, sans-serif' }}>Лавка</div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                {result.bench.map(p => <Slot key={p.id} p={p} isBench />)}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function WCPlayerModal({ player, teamsMap, rounds, currentRoundId, onClose }) {
  if (!player) return null;
  const team = teamsMap[player.squadId];
  const nextFixtures = wcNextFixturesForTeam(player.squadId, rounds, currentRoundId, 5);
  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-4 bg-black/70 backdrop-blur-sm" onClick={onClose}>
      <div className="w-full max-w-2xl max-h-[90vh] overflow-y-auto bg-stone-950 border border-stone-800 rounded-2xl" onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-stone-950/95 backdrop-blur border-b border-stone-800 p-5 flex items-start justify-between">
          <div>
            <div className="text-3xl tracking-tight" style={{ fontFamily: 'Fraunces, serif', fontWeight: 500 }}>{player.firstName} {player.lastName}</div>
            <div className="text-sm text-stone-400 mt-1 flex items-center gap-2">
              <WCStatusDot player={player} />
              {team?.name} · {WC_POSITIONS_UA[player.position]} · £{player.price.toFixed(1)}m · сила {wcTeamStrength(team?.abbr)}/5
            </div>
          </div>
          <button onClick={onClose} className="p-2 hover:bg-stone-800 rounded-lg transition-colors"><Icon name="x" size={18} /></button>
        </div>
        <div className="p-5 space-y-5">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
            <Stat label="Очки" value={player.stats?.totalPoints || 0} />
            <Stat label="Форма" value={player.stats?.form || 0} />
            <Stat label="Сер." value={player.stats?.avgPoints || 0} />
            <Stat label="Власн." value={`${player.percentSelected || 0}%`} />
          </div>
          <div>
            <div className="text-sm uppercase tracking-wider text-stone-500 mb-2">Наступні матчі</div>
            <div className="flex gap-2 flex-wrap">
              {nextFixtures.length === 0 ? <div className="text-stone-500 text-sm">Немає майбутніх матчів</div> :
                nextFixtures.map((f, i) => (
                  <div key={i} className="flex flex-col items-center gap-1">
                    <div className="text-[10px] text-stone-600">R{f.roundId}</div>
                    <WCFDRBadge difficulty={f.difficulty} isHome={f.isHome} oppAbbr={f.opp.abbr} />
                  </div>
                ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [mode, setMode] = useState(() => {
    try { return localStorage.getItem('app-mode') || 'fpl'; } catch { return 'fpl'; }
  });

  // FPL state
  const [fplData, setFplData] = useState(null);
  const [fplLoading, setFplLoading] = useState(true);
  const [fplError, setFplError] = useState(null);
  const [fplView, setFplView] = useState('dashboard');

  // WC state
  const [wcData, setWcData] = useState(null);
  const [wcLoading, setWcLoading] = useState(false);
  const [wcError, setWcError] = useState(null);
  const [wcView, setWcView] = useState('dashboard');

  const [selectedPlayer, setSelectedPlayer] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [weights, setWeights] = useState({ form: 1.0, fdr: 0.5, value: 0.0, minutes: 1.0 });

  const loadFpl = useCallback(async (force = false) => {
    setFplLoading(true); setFplError(null);
    try { setFplData(await loadFPLData(force)); }
    catch (e) { setFplError(e.message || 'Помилка'); }
    finally { setFplLoading(false); }
  }, []);

  const loadWc = useCallback(async (force = false) => {
    setWcLoading(true); setWcError(null);
    try { setWcData(await loadWCData(force)); }
    catch (e) { setWcError(e.message || 'Помилка'); }
    finally { setWcLoading(false); }
  }, []);

  useEffect(() => { loadFpl(); }, [loadFpl]);
  useEffect(() => {
    if (mode === 'wc' && !wcData && !wcLoading && !wcError) loadWc();
  }, [mode, wcData, wcLoading, wcError, loadWc]);

  const switchMode = (m) => {
    setMode(m); setSelectedPlayer(null);
    try { localStorage.setItem('app-mode', m); } catch {}
  };

  const activeData = mode === 'fpl' ? fplData : wcData;
  const activeLoading = mode === 'fpl' ? fplLoading : wcLoading;
  const activeError = mode === 'fpl' ? fplError : wcError;
  const reload = mode === 'fpl' ? () => loadFpl(true) : () => loadWc(true);

  // Mode switcher component (used in header)
  const ModeSwitcher = () => (
    <div className="flex items-center gap-0.5 p-0.5 rounded-lg bg-stone-900 border border-stone-800">
      <button onClick={() => switchMode('fpl')} className={`px-2.5 md:px-3 py-1 text-xs md:text-sm rounded-md transition-all whitespace-nowrap ${mode === 'fpl' ? 'bg-lime-500 text-stone-950 font-semibold' : 'text-stone-400 hover:text-stone-200'}`}>
        FPL
      </button>
      <button onClick={() => switchMode('wc')} className={`px-2.5 md:px-3 py-1 text-xs md:text-sm rounded-md transition-all whitespace-nowrap ${mode === 'wc' ? 'bg-lime-500 text-stone-950 font-semibold' : 'text-stone-400 hover:text-stone-200'}`}>
        WC 2026
      </button>
    </div>
  );

  if (activeError && !activeData) {
    return (
      <div className="min-h-screen flex items-center justify-center p-8">
        <div className="max-w-md text-center">
          <Icon name="alert" size={48} className="mx-auto text-red-500 mb-4" />
          <h2 className="text-2xl mb-2" style={{ fontFamily: 'Fraunces, serif' }}>Не вдалося завантажити</h2>
          <p className="text-stone-400 text-sm mb-4">{activeError}</p>
          <p className="text-stone-500 text-xs mb-6">Усі CORS-проксі не відповідають. Спробуй ще раз через хвилину.</p>
          <div className="flex gap-2 justify-center">
            <button onClick={reload} className="px-4 py-2 bg-lime-500 text-stone-950 font-semibold rounded-lg">Спробувати знову</button>
            <button onClick={() => switchMode(mode === 'fpl' ? 'wc' : 'fpl')} className="px-4 py-2 border border-stone-700 text-stone-300 rounded-lg hover:border-lime-500/40">
              Перейти на {mode === 'fpl' ? 'WC 2026' : 'FPL'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // Show loading whenever the active mode has no data yet — covers both
  // "fetch in progress" and "just switched mode, fetch not started yet".
  if (!activeData) {
    return (
      <div className="min-h-screen flex items-center justify-center p-8">
        <div className="text-center">
          <div className="w-12 h-12 border-2 border-stone-800 border-t-lime-500 rounded-full animate-spin mx-auto mb-4" />
          <div className="text-stone-400" style={{ fontFamily: 'DM Sans, sans-serif' }}>
            Завантажую дані {mode === 'wc' ? 'FIFA World Cup 2026' : 'FPL'}...
          </div>
          <div className="text-xs text-stone-600 mt-2">Це може зайняти 5–15 секунд</div>
        </div>
      </div>
    );
  }


  // Compute mode-specific things
  let view, setView, tabs, headerMeta, mainContent, modal;

  if (mode === 'fpl') {
    view = fplView; setView = setFplView;
    const { bootstrap, fixtures } = fplData;
    const { elements: players, teams } = bootstrap;
    const currentGW = getCurrentGW(bootstrap.events);
    const currentEvent = bootstrap.events.find(e => e.id === currentGW);
    const seasonEnded = fixtures.filter(f => !f.finished && f.event !== null).length === 0;

    tabs = [
      { id: 'dashboard', label: 'Дашборд', icon: 'trending' },
      { id: 'players', label: 'Гравці', icon: 'users' },
      { id: 'captain', label: 'Капітан', icon: 'crown' },
      { id: 'optimizer', label: 'Оптимізатор', icon: 'zap' },
      { id: 'fixtures', label: 'Календар', icon: 'calendar' },
    ];

    headerMeta = currentEvent && (
      <div className="hidden md:flex items-center gap-3 pl-5 ml-2 border-l border-stone-800">
        <div>
          <div className="text-[10px] uppercase tracking-wider text-stone-500">Тур</div>
          <div className="font-mono text-lg text-stone-200 leading-none mt-0.5">GW{currentGW}</div>
        </div>
        {currentEvent.deadline_time && (
          <div>
            <div className="text-[10px] uppercase tracking-wider text-stone-500">Дедлайн</div>
            <div className="font-mono text-sm text-stone-300 leading-none mt-0.5">
              {new Date(currentEvent.deadline_time).toLocaleString('uk-UA', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}
            </div>
          </div>
        )}
      </div>
    );

    mainContent = (
      <>
        {view === 'dashboard' && <DashboardView players={players} teams={teams} fixtures={fixtures} currentGW={currentGW} weights={weights} seasonEnded={seasonEnded} onPlayerClick={setSelectedPlayer} />}
        {view === 'players' && <PlayersView players={players} teams={teams} fixtures={fixtures} currentGW={currentGW} weights={weights} onPlayerClick={setSelectedPlayer} />}
        {view === 'captain' && <CaptainView players={players} teams={teams} fixtures={fixtures} currentGW={currentGW} weights={weights} seasonEnded={seasonEnded} onPlayerClick={setSelectedPlayer} />}
        {view === 'optimizer' && <OptimizerView players={players} teams={teams} fixtures={fixtures} currentGW={currentGW} weights={weights} seasonEnded={seasonEnded} onPlayerClick={setSelectedPlayer} />}
        {view === 'fixtures' && <FixturesView teams={teams} fixtures={fixtures} currentGW={currentGW} />}
      </>
    );

    modal = <PlayerModal player={selectedPlayer} team={selectedPlayer ? teams.find(t => t.id === selectedPlayer.team) : null} fixtures={fixtures} currentGW={currentGW} teams={teams} onClose={() => setSelectedPlayer(null)} />;

  } else {
    view = wcView; setView = setWcView;
    const { players, rounds, teams, teamsMap } = wcData;
    const currentRoundId = wcCurrentRound(rounds);
    const currentRound = rounds.find(r => r.id === currentRoundId);

    tabs = [
      { id: 'dashboard', label: 'Дашборд', icon: 'trending' },
      { id: 'players', label: 'Гравці', icon: 'users' },
      { id: 'optimizer', label: 'Оптимізатор', icon: 'zap' },
      { id: 'fixtures', label: 'Розклад', icon: 'calendar' },
    ];

    headerMeta = currentRound && (
      <div className="hidden md:flex items-center gap-3 pl-5 ml-2 border-l border-stone-800">
        <div>
          <div className="text-[10px] uppercase tracking-wider text-stone-500">Раунд</div>
          <div className="font-mono text-lg text-stone-200 leading-none mt-0.5">R{currentRoundId}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase tracking-wider text-stone-500">Старт</div>
          <div className="font-mono text-sm text-stone-300 leading-none mt-0.5">
            {new Date(currentRound.startDate).toLocaleString('uk-UA', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}
          </div>
        </div>
      </div>
    );

    mainContent = (
      <>
        {view === 'dashboard' && <WCDashboardView players={players} teams={teams} teamsMap={teamsMap} rounds={rounds} currentRoundId={currentRoundId} onPlayerClick={setSelectedPlayer} />}
        {view === 'players' && <WCPlayersView players={players} teams={teams} teamsMap={teamsMap} rounds={rounds} currentRoundId={currentRoundId} onPlayerClick={setSelectedPlayer} />}
        {view === 'optimizer' && <WCOptimizerView players={players} teamsMap={teamsMap} rounds={rounds} currentRoundId={currentRoundId} onPlayerClick={setSelectedPlayer} />}
        {view === 'fixtures' && <WCFixturesView rounds={rounds} teamsMap={teamsMap} />}
      </>
    );

    modal = <WCPlayerModal player={selectedPlayer} teamsMap={teamsMap} rounds={rounds} currentRoundId={currentRoundId} onClose={() => setSelectedPlayer(null)} />;
  }

  const brandLabel = mode === 'fpl' ? 'Fantasy Premier League · Аналітика' : 'FIFA World Cup 2026 Fantasy · Аналітика';
  const brandText = mode === 'fpl' ? 'FPL' : 'WC';

  return (
    <div className="min-h-screen text-stone-100" style={{ fontFamily: 'DM Sans, sans-serif' }}>
      <div className="fixed inset-0 opacity-30 pointer-events-none" style={{
        backgroundImage: 'radial-gradient(ellipse at top, rgba(132, 204, 22, 0.05), transparent 50%), radial-gradient(ellipse at bottom right, rgba(251, 146, 60, 0.03), transparent 50%)',
      }} />
      <div className="relative">
        <header className="border-b border-stone-800 bg-stone-950/80 backdrop-blur sticky top-0 z-30">
          <div className="max-w-7xl mx-auto px-4 md:px-6 py-3 flex items-center justify-between gap-3">
            <div className="flex items-center gap-3 md:gap-5 min-w-0">
              <div className="min-w-0">
                <div className="text-2xl md:text-3xl tracking-tight leading-none" style={{ fontFamily: 'Fraunces, serif', fontWeight: 600 }}>
                  {brandText}<span className="text-lime-400">.</span>UA
                </div>
                <div className="text-[10px] uppercase tracking-[0.2em] text-stone-500 mt-0.5 truncate">{brandLabel}</div>
              </div>
              <ModeSwitcher />
              {headerMeta}
            </div>
            <div className="flex items-center gap-2 flex-shrink-0">
              {mode === 'fpl' && (
                <button onClick={() => setShowSettings(true)} className="p-2 rounded-lg hover:bg-stone-900 text-stone-400 hover:text-stone-200 transition-colors" title="Налаштування">
                  <Icon name="settings" size={18} />
                </button>

              <button onClick={reload} disabled={activeLoading} className="p-2 rounded-lg hover:bg-stone-900 text-stone-400 hover:text-stone-200 transition-colors disabled:opacity-40" title="Оновити">

            <div className="text-[11px] text-stone-600 flex items-center gap-1.5">
              <span className="w-1 h-1 rounded-full bg-stone-600" />
              Кеш від {new Date(activeData.cachedAt).toLocaleTimeString('uk-UA')}. Натисни оновлення для свіжих даних.
            </div>
          </div>
        )}

        <main className="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-8 pb-20">
          {mainContent}
        </main>

        <footer className="max-w-7xl mx-auto px-4 md:px-6 py-6 border-t border-stone-900 text-xs text-stone-600">
          <div className="flex flex-col md:flex-row justify-between gap-2">
            <div>Дані: {mode === 'fpl' ? 'офіційне FPL API' : 'play.fifa.com/json/fantasy'} · Без афіляції з FIFA та Прем'єр-лігою.</div>
            <div>Прогнози — наша евристика, не фінансова порада 😉</div>
          </div>
        </footer>
      </div>

      {modal}
      <SettingsDrawer open={showSettings} onClose={() => setShowSettings(false)} weights={weights} setWeights={setWeights} />
    </div>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
