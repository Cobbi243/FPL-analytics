/* ============ FPL.UA design system: components/bundle.css ============ */
/* FPL.UA components — every value is a token from tokens.json */
*, *::before, *::after { box-sizing: border-box; }
.fu-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.fu-row-flex { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.fu-stack { display: flex; flex-direction: column; gap: var(--space-2); }
:where(.fu-btn, .fu-tab, .fu-ranked, .fu-hero, .fu-input, .fu-select, .fu-check input, .fu-slider, .fu-th-btn):focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}

/* Icon */
.fu-icon { flex-shrink: 0; display: inline-block; vertical-align: middle; }

/* Logo */
.fu-logo { display: inline-flex; flex-direction: column; gap: 2px; }
.fu-logo-word { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -0.02em; color: var(--ink); }
.fu-logo-word .fu-logo-dot { display: inline-block; width: 0.3em; height: 0.3em; background: var(--brand); border-radius: 2px; margin: 0 0.08em; vertical-align: baseline; }
.fu-logo-tag { font-size: 10px; line-height: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-subtle); }

/* Button */
.fu-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border: 1px solid transparent; border-radius: var(--radius-sm);
  font-family: var(--font-sans); font-weight: 600; font-size: 15px; line-height: 22px; padding: var(--space-2) var(--space-4); cursor: pointer;
  transition: background-color .15s, box-shadow .15s, color .15s, transform .1s; }
.fu-btn:active { transform: translateY(1px); }
.fu-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.fu-btn-sm { font-size: 13px; line-height: 18px; padding: 6px var(--space-3); }
.fu-btn-primary { background: var(--brand); color: var(--on-brand); }
.fu-btn-primary:hover:not(:disabled) { box-shadow: var(--glow-brand); }
.fu-btn-hot { background: var(--hot); color: var(--on-hot); }
.fu-btn-secondary { background: var(--surface-raised); color: var(--ink); border-color: var(--line-strong); }
.fu-btn-secondary:hover:not(:disabled) { border-color: var(--ink-muted); }
.fu-btn-ghost { background: transparent; color: var(--ink-muted); }
.fu-btn-ghost:hover:not(:disabled) { background: var(--surface-raised); color: var(--ink); }
.fu-btn-icon { padding: var(--space-2); }

/* Tabs */
.fu-tabs { display: flex; gap: var(--space-1); overflow-x: auto; padding: var(--space-1); background: var(--surface-sunken); border-radius: var(--radius-pill); border: 1px solid var(--line); scrollbar-width: none; }
.fu-tab { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 0; background: transparent; color: var(--ink-muted); cursor: pointer;
  font: 600 13px/18px var(--font-sans); padding: var(--space-2) var(--space-3); border-radius: var(--radius-pill); transition: background-color .15s, color .15s; }
.fu-tab:hover { color: var(--ink); background: var(--surface-raised); }
.fu-tab[aria-selected="true"] { background: var(--brand); color: var(--on-brand); }

.fu-pos { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; padding: 2px 6px; border-radius: var(--radius-xs);

.fu-hero { position: relative; overflow: hidden; width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: var(--space-6); align-items: end;
  padding: var(--space-6); border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); font-family: var(--font-sans); transition: box-shadow .2s; }

    return {

  set: async (key, value) => {
    try {

      return {
        value
      };
    } catch (e) {
      return null;
    }
  }
};

  }
}
async function fetchWithProxy(url) {
  const custom = getCustomProxy();

    proxies.unshift({
      url: u => base + encodeURIComponent(u),
      type: 'raw'
    });
  }
  let lastErr;
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy.url(url), {
        cache: 'no-store'
      });

      if (proxy.type === 'wrapped') {

      if (!trimmed.startsWith('{') && !trimmed.startsWith('[')) {
        throw new Error('Проксі віддав не JSON (ймовірно HTML-помилку)');

    } catch (e) {
      lastErr = e;
    }
  }

      def: Math.max(0.5, Math.min(1.8, (rawDef * a.n + priorDef * K) / (a.n + K))),
      xgFavg: a.n ? a.xgF / a.n : null,
      xgAavg: a.n ? a.xgA / a.n : null,
      xgF5: last5.length ? last5.reduce((s, m) => s + m.xgF, 0) / last5.length : null,
      xgA5: last5.length ? last5.reduce((s, m) => s + m.xgA, 0) / last5.length : null,
      gfAvg: a.n ? a.gf / a.n : null,
      gaAvg: a.n ? a.ga / a.n : null,
      matches: a.matches,
      last: a.matches[a.matches.length - 1] || null
    };
  }
  return {
    byTeam,
    leagueAvg
  };
}

// Очікування від конкретного матчу за реальними рейтингами сезону:
// скільки xG створить команда, скільки дозволить і шанс сухаря.
function matchExpectation(teamId, oppId, isHome) {
  const R = MODEL.ratings;
  if (!R || !R.byTeam[teamId] || !R.byTeam[oppId]) return null;
  const t = R.byTeam[teamId],
    o = R.byTeam[oppId];
  const clamp = v => Math.max(0.25, Math.min(4, v));
  const xgF = clamp(R.leagueAvg * t.att * o.def * (isHome ? 1.08 : 0.93));
  const xgA = clamp(R.leagueAvg * o.att * t.def * (isHome ? 0.93 : 1.08));
  return {
    xgF,
    xgA,
    cs: Math.exp(-xgA)
  };
}
function setModelData(md, teams, fixtures) {
  MODEL.ratings = null;
  MODEL.recent = null;
  MODEL.recentTeamMatches = null;
  if (!md) return;
  try {
    MODEL.ratings = computeTeamRatings(md.teamXg, fixtures, teams);
    if (md.recent && md.recent.events && md.recent.events.length) {
      MODEL.recent = md.recent;
      // скільки матчів зіграла кожна команда в кожному з останніх турів
      const rtm = {};
      for (const t of teams) rtm[t.id] = md.recent.events.map(() => 0);
      const idx = Object.fromEntries(md.recent.events.map((e, i) => [e, i]));
      for (const f of fixtures) {
        if (!f.finished || idx[f.event] === undefined) continue;
        if (rtm[f.team_h]) rtm[f.team_h][idx[f.event]]++;
        if (rtm[f.team_a]) rtm[f.team_a][idx[f.event]]++;
      }
      MODEL.recentTeamMatches = rtm;
    }
  } catch (e) {
    MODEL.ratings = null;
    MODEL.recent = null;
  }
}

// Профіль останніх матчів гравця: як часто виходив у старті і скільки грав.
// Саме це ловить ротацію, втрату місця в основі чи повернення після травми —
// сезонні суми цього не показують.
function recentStartProfile(player, lastN = 4) {
  const rec = MODEL.recent,
    rtm = MODEL.recentTeamMatches;
  if (!rec || !rtm || !rtm[player.team]) return null;
  const mins = rec.mins[player.id],
    starts = rec.starts[player.id];
  const tm = rtm[player.team];
  let matches = 0,
    m = 0,
    s = 0,
    used = 0;
  for (let i = rec.events.length - 1; i >= 0 && used < lastN; i--) {
    if (!tm[i]) continue; // команда не грала в цьому турі
    used++;
    matches += tm[i];
    m += mins ? mins[i] || 0 : 0;
    s += starts ? starts[i] || 0 : 0;
  }
  if (matches < 2) return null;
  return {
    matches,
    startRate: Math.min(1, s / matches),
    minsAvg: Math.min(90, m / matches)
  };
}
async function loadFPLData(forceRefresh = false) {
  if (!forceRefresh) {
    try {
      const cached = await storage.get('fpl-cache');
      if (cached) {
        const parsed = JSON.parse(cached.value);
        if (Date.now() - parsed.ts < CACHE_TTL) {
          setModelData(parsed.data.modelData, parsed.data.bootstrap.teams, parsed.data.fixtures);
          return {
            ...parsed.data,
            fromCache: true,
            cachedAt: parsed.ts
          };
        }
      }
    } catch (e) {}
  }
  let bootstrap, fixtures;
  try {
    [bootstrap, fixtures] = await Promise.all([fetchFromBackend('/api/bootstrap'), fetchFromBackend('/api/fixtures')]);
  } catch (e) {
    // Бекенд лежить — старий шлях через проксі
    [bootstrap, fixtures] = await Promise.all([fetchWithProxy(`${FPL_API}/bootstrap-static/`), fetchWithProxy(`${FPL_API}/fixtures/`)]);
  }

  // Дані для моделі з нашого сервера (xG команд по турах, хвилини гравців
  // за останні тури). Якщо сервер їх не віддав — модель працює по-старому.
  let modelData = null;
  try {
    modelData = await fetchFromBackend('/api/model-data');
  } catch (e) {}
  setModelData(modelData, bootstrap.teams, fixtures);
  const data = {
    bootstrap,
    fixtures,
    modelData
  };
  try {
    await storage.set('fpl-cache', JSON.stringify({
      ts: Date.now(),
      data
    }));
  } catch (e) {}
  return {
    ...data,
    fromCache: false,
    cachedAt: Date.now()
  };
}

// Завантаження реальної команди користувача за FPL ID (entry id)
async function loadMyTeam(entryId, fallbackGW) {
  const [entry, history] = await Promise.all([fetchWithProxy(`${FPL_API}/entry/${entryId}/`), fetchWithProxy(`${FPL_API}/entry/${entryId}/history/`)]);
  // Останній тур, у якому команда реально грала
  const played = (history.current || []).filter(h => h.points !== null && h.points !== undefined);
  const picksGW = played.length ? played[played.length - 1].event : null;

  // На старті сезону зіграних турів ще немає — склад запитувати марно
  // (запит впаде і довго перебиратиме проксі), тому одразу повертаємо без нього.
  if (picksGW === null) {
    return {
      entry,
      history,
      picks: null,
      picksGW: fallbackGW
    };
  }
  let picks = null;
  try {
    // Таймаут-запобіжник: якщо picks не приходять за 8 секунд — йдемо далі без них
    picks = await Promise.race([fetchWithProxy(`${FPL_API}/entry/${entryId}/event/${picksGW}/picks/`), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]);
  } catch (e) {/* picks можуть бути недоступні — не критично */}
  return {
    entry,
    history,
    picks,
    picksGW
  };
}

// ============================================================
// ANALYTICS
// ============================================================
function getCurrentGW(events) {
  if (!events || events.length === 0) return 1;
  const now = Date.now();
  // Поточним вважаємо перший тур, чий дедлайн ще НЕ минув — саме в ньому
  // можна робити трансфери, ставити капітана і грати чипи.
  // (Прапорець finished ненадійний: FPL ставить його лише через добу
  // після останнього матчу, коли остаточно звірить дані.)
  const upcoming = [...events].filter(e => e.deadline_time && Date.parse(e.deadline_time) > now).sort((a, b) => Date.parse(a.deadline_time) - Date.parse(b.deadline_time))[0];
  if (upcoming) return upcoming.id;
  // Дедлайнів попереду немає — сезон завершено, показуємо останній тур
  const lastFinished = [...events].reverse().find(e => e.finished || e.is_current);
  return lastFinished ? lastFinished.id : events[events.length - 1].id;
}
function getNextFixtures(teamId, fixtures, fromGW, count = 5) {
  return fixtures.filter(f => !f.finished && f.event !== null && f.event >= fromGW && (f.team_h === teamId || f.team_a === teamId)).sort((a, b) => a.event - b.event).slice(0, count).map(f => ({
    gw: f.event,
    isHome: f.team_h === teamId,
    opponent: f.team_h === teamId ? f.team_a : f.team_h,
    difficulty: f.team_h === teamId ? f.team_h_difficulty : f.team_a_difficulty,
    kickoff: f.kickoff_time
  }));
}
function availabilityFactor(player) {
  if (player.status === 'a') return 1.0;
  if (player.status === 'd') return (player.chance_of_playing_next_round ?? 50) / 100;
  if (player.status === 'i' || player.status === 's' || player.status === 'u') return 0.05;
  if (player.chance_of_playing_next_round !== null) return player.chance_of_playing_next_round / 100;
  return 1.0;
}

// ============================================================
// МОДЕЛЬ ПРОГНОЗУ v2.1
// Атака: xG/90 та xA/90, скориговані на силу захисту суперника.
// Сухарі: Пуассон з особистого xGC/90 × сила атаки суперника.
// Ротація: очікувані хвилини на МАТЧ КОМАНДИ + ймовірність старту.
// "Інші очки/90": залишок (бонуси, сейви, DefCon, картки) з реальної
// статистики гравця. Малі вибірки -> змішування зі старою формулою.
// ============================================================
const GOAL_VALUE = {
  1: 6,
  2: 6,
  3: 5,
  4: 4
};
const CS_VALUE = {
  1: 4,
  2: 4,
  3: 1,
  4: 0
};
const AVG_STRENGTH = 1150; // середня сила команд АПЛ у шкалі FPL (~1000-1400)

function predictPlayerPoints(player, teamsMap, fixtures, fromGW, gwsAhead = 1, weights) {
  const w = weights || {
    form: 1.0,
    fdr: 0.5,
    value: 0.0,
    minutes: 1.0
  };
  const nextFixtures = getNextFixtures(player.team, fixtures, fromGW, gwsAhead);
  if (nextFixtures.length === 0) {
    return {
      total: 0,
      perGW: 0,
      fixtures: [],
      breakdown: {
        form: 0,
        fdr: 0,
        mins: 0,
        avail: 0
      }
    };
  }
  const mins = player.minutes || 0;
  const form = parseFloat(player.form) || 0;
  const ppg = parseFloat(player.points_per_game) || 0;
  const avail = availabilityFactor(player);

  // Скільки матчів зіграла КОМАНДА (для оцінки ротації гравця).
  // На старті сезону завершених матчів немає — тоді за базу беремо повний
  // сезон (38 турів), бо статистика гравця у даних ще торішня.
  const playedRounds = fixtures.filter(f => f.finished && (f.team_h === player.team || f.team_a === player.team)).length;
  const rounds = playedRounds > 0 ? playedRounds : 38;
  const starts = Math.min(player.starts || 0, rounds);
  // Виходи з лавки: оцінка з "зайвих" хвилин (старт ≈ 84 хв, камео ≈ 25 хв)
  const cameos = Math.max(0, Math.min(rounds - starts, Math.round((mins - 84 * starts) / 25)));
  let p60 = Math.min(1, starts / rounds);
  let pCameo = Math.min(1 - p60, cameos / rounds);
  let expMins = Math.min(90, mins / rounds); // очікувані хвилини на матч команди (не більше 90)

  // РИЗИК СТАРТУ: останні 4 матчі команди важать більше за сезонні суми.
  // Гравець, що сів на лавку 3 тури тому, за сезоном досі виглядає основним.
  const recentProf = recentStartProfile(player);
  if (recentProf) {
    const wR = 0.65;
    p60 = wR * recentProf.startRate + (1 - wR) * p60;
    expMins = wR * recentProf.minsAvg + (1 - wR) * expMins;
    pCameo = Math.min(1 - p60, pCameo);
  }
  const minutesFactor = w.minutes > 0 ? mins > 1000 ? 1.0 : mins > 500 ? 0.85 : mins > 200 ? 0.7 : 0.5 : 1.0;

  // ---- Показники на 90 хвилин з РЕГРЕСІЄЮ ДО СЕРЕДНЬОГО ----
  // Мала вибірка бреше: 1-2 матчі не доводять, що гравець забиватиме так завжди.
  // Тому власні цифри гравця змішуємо з типовими для його позиції, і вага
  // власних даних росте з накопиченням хвилин (повна довіра ~900 хв = 10 матчів).
  const rawPer90 = v => mins > 0 ? (parseFloat(v) || 0) / (mins / 90) : 0;
  // Баланс: достатньо стримати спалах в одному матчі, але не злити всіх
  // до середнього. 270 хв (3 матчі) -> 50%, 900 хв -> 77%, 1800 хв -> 87%.
  const PRIOR_MINUTES = 270; // "сила" середнього: еквівалент 3 матчів
  const trust = mins / (mins + PRIOR_MINUTES);
  const shrink = (own, prior) => own * trust + prior * (1 - trust);

  // Типові показники на 90 хв за позиціями (з торішньої статистики АПЛ)
  const PRIOR_XG90 = {
    1: 0.00,
    2: 0.04,
    3: 0.12,
    4: 0.30
  };
  const PRIOR_XA90 = {
    1: 0.00,
    2: 0.06,
    3: 0.13,
    4: 0.11
  };
  const PRIOR_XGC90 = {
    1: 1.45,
    2: 1.45,
    3: 1.45,
    4: 1.45
  };
  const pos = player.element_type;
  const xG90 = shrink(rawPer90(player.expected_goals), PRIOR_XG90[pos]);
  const xA90 = shrink(rawPer90(player.expected_assists), PRIOR_XA90[pos]);
  const xGC90 = shrink(rawPer90(player.expected_goals_conceded), PRIOR_XGC90[pos]);

  // "Інші очки" (бонуси, сейви, DefCon, мінуси за картки/пропущені) —
  // залишок реальних очок після голів/асистів/сухарів/виходів
  const appearanceCum = 2 * starts + cameos;
  const explained = (player.goals_scored || 0) * GOAL_VALUE[player.element_type] + (player.assists || 0) * 3 + (player.clean_sheets || 0) * CS_VALUE[player.element_type] + appearanceCum;
  // Ті самі перестороги: після 1-2 турів "залишок" (бонуси/сейви/DefCon)
  // може виглядати захмарним. Стискаємо до типового рівня позиції.
  const PRIOR_OTHER90 = {
    1: 1.2,
    2: 0.8,
    3: 0.6,
    4: 0.5
  };
  const rawOther90 = mins > 0 ? Math.max(-1, Math.min(1.8, ((player.total_points || 0) - explained) / (mins / 90))) : 0;
  const other90 = shrink(rawOther90, PRIOR_OTHER90[pos]);

  // Нова модель (xG-based) тепер уже має власний захист від малої вибірки,
  // тож переходимо на неї швидше — стара формула надто чутлива до форми.
  const blendNew = Math.min(1, mins / 270);
  // Сила коригування на суперника керується слайдером FDR (0.5 = стандарт)
  const adjScale = Math.min(2, w.fdr / 0.5);
  let total = 0;
  const detailedFixtures = nextFixtures.map(f => {
    const opp = teamsMap[f.opponent];
    // Надійне читання сили: FPL заповнює поля поетапно (на старті сезону
    // детальні = 0, але strength_overall_home/away 1-5 вже проставлені)
    const strOf = (team, key) => {
      if (!team) return AVG_STRENGTH;
      const v = team[key];
      if (Number.isFinite(v) && v > 0) return v;
      const isHomeKey = key.endsWith('_home');
      const ov = isHomeKey ? team.strength_overall_home : team.strength_overall_away;
      if (Number.isFinite(ov) && ov > 0) return 850 + ov * 120;
      const gen = team.strength;
      if (Number.isFinite(gen) && gen > 0) return 850 + gen * 120;
      return AVG_STRENGTH;
    };
    const oppDef = strOf(opp, f.isHome ? 'strength_defence_away' : 'strength_defence_home');
    const oppAtt = strOf(opp, f.isHome ? 'strength_attack_away' : 'strength_attack_home');
    // Поправка на суперника з ДВОХ джерел: рейтинг сили + FDR конкретного матчу.
    // FDR точніший (FPL враховує форму й пару команд), тому важить більше.
    // Проти найлегшого суперника атака ~1.7x, проти найважчого ~0.6x.
    const fromRating = AVG_STRENGTH / oppDef;
    const fromFDR = Math.pow(1.22, 3 - (f.difficulty ?? 3));
    let attackRaw = Math.pow(fromRating, 0.5) * Math.pow(fromFDR, 1.2);
    let concedeRaw = Math.pow(oppAtt / AVG_STRENGTH, 0.5) * Math.pow(1 / fromFDR, 0.8);
    // Якщо є реальні дані сезону — беремо їх замість передсезонних рейтингів:
    // скільки xG суперник фактично дозволяє і створює. Саме тут "Лідс, що мало
    // пропускає" перестає бути легким матчем лише через низький рейтинг FPL.
    const oppR = MODEL.ratings && MODEL.ratings.byTeam[f.opponent];
    if (oppR && oppR.n >= 3) {
      attackRaw = Math.pow(oppR.def, 0.9) * (f.isHome ? 1.05 : 0.95);
      concedeRaw = Math.pow(oppR.att, 0.9) * (f.isHome ? 0.95 : 1.05);
    }
    const attackAdj = 1 + (attackRaw - 1) * adjScale;
    const concedeAdj = 1 + (concedeRaw - 1) * adjScale;
    const appearancePts = 2 * p60 + 1 * pCameo;
    const attackPts = (xG90 * GOAL_VALUE[player.element_type] + xA90 * 3) * (expMins / 90) * attackAdj;
    const csPts = p60 * Math.exp(-(xGC90 * concedeAdj)) * CS_VALUE[player.element_type];
    const otherPts = other90 * (expMins / 90);
    const homeBonus = f.isHome ? 0.2 : 0;
    const newScore = (appearancePts + attackPts + csPts + otherPts + homeBonus) * avail;

    // Стара формула (форма/PPG + FDR) — для змішування і як база для новачків
    // Форма (останні 4 матчі) шумна — сезонний PPG надійніший орієнтир
    const oldBase = (form * 0.35 + ppg * 0.65) * w.form;
    const oldScore = Math.max(0, (oldBase + (3 - f.difficulty) * w.fdr + (f.isHome ? 0.3 : 0)) * minutesFactor * avail);

    // Невеликий бонус за "гарячість", але жорстко обмежений: спалах в одному
    // турі не має підіймати прогноз у півтора раза.
    const formBoost = 1 + Math.max(-0.10, Math.min(0.10, (form - ppg) * 0.02 * w.form));
    const rawScore = blendNew * newScore * formBoost + (1 - blendNew) * oldScore;
    const fixtureScore = Number.isFinite(rawScore) ? Math.max(0, rawScore) : 0;
    total += fixtureScore;
    // Розклад прогнозу — щоб показати, з чого складається оцінка
    const xGFix = xG90 * (expMins / 90) * attackAdj;
    const xAFix = xA90 * (expMins / 90) * attackAdj;
    const csProb = p60 * Math.exp(-(xGC90 * concedeAdj));
    return {
      ...f,
      score: fixtureScore,
      xG: Number.isFinite(xGFix) ? xGFix : 0,
      xA: Number.isFinite(xAFix) ? xAFix : 0,
      csProb: Number.isFinite(csProb) ? csProb : 0,
      expMins
    };
  });
  const sum = k => detailedFixtures.reduce((s, f) => s + (f[k] || 0), 0);
  return {
    total,
    perGW: total / nextFixtures.length,
    fixtures: detailedFixtures,
    // Очікувані показники за весь запитаний горизонт
    xG: sum('xG') * avail,
    xA: sum('xA') * avail,
    csProb: detailedFixtures.length ? sum('csProb') / detailedFixtures.length * avail : 0,
    expMins,
    startProb: p60 * avail,
    recentStarts: recentProf,
    // {matches, startRate, minsAvg} за останні матчі або null
    breakdown: {
      form,
      avail,
      mins: minutesFactor,
      count: nextFixtures.length,
      xG90: +xG90.toFixed(2),
      xA90: +xA90.toFixed(2),
      xGC90: +xGC90.toFixed(2),
      blendNew: +blendNew.toFixed(2),
      trust: +trust.toFixed(2)
    }
  };
}
function valueScore(player) {
  const cost = player.now_cost / 10;
  if (cost <= 0) return 0;
  // Очки за £1m. На старті сезону очки ще нульові, тому в такому разі
  // спираємось на торішню продуктивність за матч (а не на суму за сезон),
  // інакше виходить суміш «торішні очки ÷ новa ціна» з абсурдними числами.
  const pts = player.total_points || 0;
  const mins = player.minutes || 0;
  if (pts > 0 && mins > 0) {
    const perMatch = pts / Math.max(1, mins / 90); // очки за 90 хвилин
    return perMatch / cost * 10; // масштаб під зручні 1-10
  }
  return pts / cost;
}
function differentialBoost(player) {
  const sel = parseFloat(player.selected_by_percent) || 0;
  if (sel >= 15) return 1.0;
  return 1.0 + (15 - sel) * 0.02;
}

// ============================================================
// OPTIMIZER
// ============================================================
// ============================================================
// ПРОГНОЗ ПО КОМАНДАХ на найближчий тур
// Очікувані голи (xGF) і ймовірність сухаря з рейтингів сили команд.
// Базова лінія ~1.45 гола/матч (середнє АПЛ), масштабується силою
// атаки своєї команди проти захисту суперника (і навпаки для сухаря).
// Сухар за Пуассоном: P(0 пропущених) = exp(-очікувані пропущені).
// ============================================================
const LEAGUE_AVG_GOALS = 1.45; // середні голи команди за матч в АПЛ
const HOME_GOAL_MULT = 1.04; // домашня перевага (підібрано під ринкові проєкції)
const FDR_BASE = 1.10; // наскільки складність матчу впливає на очікувані голи
const ATTACK_W = 0.20; // вага класу власної атаки
const OPP_DEF_W = 0.04; // вага класу захисту суперника

function teamForecast(teams, fixtures, fromGW) {
  const teamsById = Object.fromEntries(teams.map(t => [t.id, t]));
  // Знаходимо найближчий тур із матчами
  const upcoming = fixtures.filter(f => f.event != null && !f.finished && f.event >= (fromGW || 1));
  if (upcoming.length === 0) return {
    gw: null,
    rows: []
  };
  const gw = Math.min(...upcoming.map(f => f.event));
  const gwFixtures = fixtures.filter(f => f.event === gw);

  // Надійне читання сили команди. FPL заповнює поля поетапно:
  // на старті сезону детальні рейтинги = 0, а strength_overall_home/away (1-5) вже є.
  // Порядок: детальний -> overall(1-5) -> загальний strength(1-5) -> середнє.
  const str = (team, key) => {
    if (!team) return AVG_STRENGTH;
    const v = team[key];
    if (Number.isFinite(v) && v > 0) return v;
    // overall для потрібної сторони (дім/виїзд) у шкалі 1-5
    const isHomeKey = key.endsWith('_home');
    const ov = isHomeKey ? team.strength_overall_home : team.strength_overall_away;
    if (Number.isFinite(ov) && ov > 0) return 850 + ov * 120; // 1->970 ... 5->1450
    const gen = team.strength;
    if (Number.isFinite(gen) && gen > 0) return 850 + gen * 120;
    return AVG_STRENGTH;
  };
  const rows = [];
  for (const f of gwFixtures) {
    const home = teamsById[f.team_h];
    const away = teamsById[f.team_a];
    if (!home || !away) continue;

    // Сила команди в шкалі 1-5 (overall) — окремо для дому й виїзду
    const tier = (team, isHome) => {
      const ov = isHome ? team.strength_overall_home : team.strength_overall_away;
      if (Number.isFinite(ov) && ov > 0) return ov;
      if (Number.isFinite(team.strength) && team.strength > 0) return team.strength;
      return 3;
    };
    // FDR матчу (1 = дуже легко, 5 = дуже складно) — найточніший сигнал,
    // бо FPL проставляє його з урахуванням конкретної пари й поля.
    const fdrH = f.team_h_difficulty ?? 3;
    const fdrA = f.team_a_difficulty ?? 3;

    // Коефіцієнти підібрані під ринкові xG-проєкції (середня похибка ~0.11 гола).
    // FDR матчу — основний сигнал, клас своєї атаки і класу захисту суперника — уточнення.
    const fromFDR = fdr => Math.pow(FDR_BASE, 3 - fdr);
    const fromAttack = t => 1 + (t - 3) * ATTACK_W;
    const fromOppDefence = t => 1 + (3 - t) * OPP_DEF_W;
    const R = MODEL.ratings;
    const calc = (att, opp, isHome, myFdr) => {
      // Реальні дані сезону: атака команди × те, скільки дозволяє суперник
      if (R && R.byTeam[att.id] && R.byTeam[opp.id]) {
        const x = R.leagueAvg * R.byTeam[att.id].att * R.byTeam[opp.id].def * (isHome ? 1.08 : 0.93);
        if (Number.isFinite(x)) return Math.max(0.25, Math.min(4, x));
      }
      const xGF = LEAGUE_AVG_GOALS * fromFDR(myFdr) * fromAttack(tier(att, isHome)) * fromOppDefence(tier(opp, !isHome)) * (isHome ? HOME_GOAL_MULT : 1 / HOME_GOAL_MULT);
      return Number.isFinite(xGF) ? Math.max(0.25, Math.min(4, xGF)) : LEAGUE_AVG_GOALS;
    };
    const homeXGF = calc(home, away, true, fdrH);
    const awayXGF = calc(away, home, false, fdrA);
    const homeCS = Math.exp(-awayXGF);
    const awayCS = Math.exp(-homeXGF);
    rows.push({
      fixtureId: f.id,
      gw,
      home: {
        team: home,
        opp: away,
        isHome: true,
        xGF: homeXGF,
        cs: homeCS,
        fdr: f.team_h_difficulty ?? 3
      },
      away: {
        team: away,
        opp: home,
        isHome: false,
        xGF: awayXGF,
        cs: awayCS,
        fdr: f.team_a_difficulty ?? 3
      }
    });
  }
  // Плоский список команд (зручніше для таблиці), відсортований за xGF
  const flat = [];
  for (const r of rows) {
    flat.push({
      ...r.home,
      fixtureId: r.fixtureId,
      gw
    });
    flat.push({
      ...r.away,
      fixtureId: r.fixtureId,
      gw
    });
  }
  return {
    gw,
    rows,
    flat
  };
}

// ============================================================
// ПЛАНУВАЛЬНИК ЧИПІВ
// Рахує прогноз твоїх 15 гравців по кожному з майбутніх турів
// і підказує, де найвигідніше зіграти кожен чип.
// Враховує подвійні тури (2 матчі за GW) і порожні (жодного).
// ============================================================
const CHIP_DEADLINE_GW = 19; // перший комплект чипів діє до GW19 включно

// Відповідність назв чипів у FPL API нашим ключам
const CHIP_KEY_MAP = {
  bboost: 'benchBoost',
  '3xc': 'tripleCaptain',
  freehit: 'freeHit',
  wildcard: 'wildcard',
  manager: 'manager'
};
function planChips(squad, teamsMap, fixtures, fromGW, weights, horizonEnd, events, playedChips) {
  if (!squad || squad.length < 11) return null;

  // Які чипи вже зіграні в ПОТОЧНОМУ комплекті (до GW19 — перший, далі — другий)
  const half = fromGW <= CHIP_DEADLINE_GW ? 1 : 2;
  const usedSet = new Set();
  const usedInfo = {};
  for (const ch of playedChips || []) {
    const key = CHIP_KEY_MAP[ch.name];
    if (!key) continue;
    const chHalf = ch.event <= CHIP_DEADLINE_GW ? 1 : 2;
    if (chHalf === half) usedSet.add(key);
    usedInfo[key] = usedInfo[key] || [];
    usedInfo[key].push(ch.event);
  }
  const endGW = horizonEnd || CHIP_DEADLINE_GW;
  const now = Date.now();
  // Пропускаємо тури, чий дедлайн уже минув — чип у них зіграти неможливо
  const deadlinePassed = gw => {
    if (!events) return false;
    const ev = events.find(e => e.id === gw);
    return ev && ev.deadline_time && Date.parse(ev.deadline_time) <= now;
  };
  const gws = [];
  for (let gw = fromGW; gw <= endGW; gw++) {
    if (!deadlinePassed(gw)) gws.push(gw);
  }
  if (gws.length === 0) return null;

  // Для кожного туру рахуємо прогноз кожного гравця з урахуванням
  // кількості його матчів у цьому турі (0 = порожній, 2 = подвійний)
  const perGW = gws.map(gw => {
    const rows = squad.map(p => {
      const gwFixtures = fixtures.filter(f => f.event === gw && !f.finished && (f.team_h === p.team || f.team_a === p.team));
      const matches = gwFixtures.length;
      let pred = 0;
      if (matches > 0) {
        // predictPlayerPoints рахує з fromGW; беремо прогноз саме цього туру
        const r = predictPlayerPoints(p, teamsMap, fixtures, gw, matches, weights);
        pred = r.total;
      }
      return {
        player: p,
        matches,
        pred
      };
    });

    // Оптимальна одинадцятка цього туру (валідна формація)
    const byPos = {
      1: [],
      2: [],
      3: [],
      4: []
    };
    rows.forEach(r => byPos[r.player.element_type].push(r));
    Object.values(byPos).forEach(arr => arr.sort((a, b) => b.pred - a.pred));
    let bestXI = null;
    for (const d of [3, 4, 5]) for (const m of [2, 3, 4, 5]) for (const f of [1, 2, 3]) {
      if (1 + d + m + f !== 11) continue;
      if (byPos[1].length < 1 || byPos[2].length < d || byPos[3].length < m || byPos[4].length < f) continue;
      const xi = [...byPos[1].slice(0, 1), ...byPos[2].slice(0, d), ...byPos[3].slice(0, m), ...byPos[4].slice(0, f)];
      const total = xi.reduce((s, r) => s + r.pred, 0);
      if (!bestXI || total > bestXI.total) bestXI = {
        xi,
        total,
        formation: `${d}-${m}-${f}`
      };
    }
    const xiIds = new Set((bestXI?.xi || []).map(r => r.player.id));
    const bench = rows.filter(r => !xiIds.has(r.player.id));
    const benchTotal = bench.reduce((s, r) => s + r.pred, 0);
    const blanks = rows.filter(r => r.matches === 0).length;
    const doubles = rows.filter(r => r.matches >= 2).length;
    const best = [...rows].sort((a, b) => b.pred - a.pred)[0];
    return {
      gw,
      xiTotal: bestXI?.total || 0,
      formation: bestXI?.formation || '—',
      benchTotal,
      bench: bench.map(r => ({
        name: r.player.web_name,
        pred: r.pred,
        matches: r.matches
      })),
      blanks,
      doubles,
      bestPlayer: best ? {
        name: best.player.web_name,
        pred: best.pred,
        matches: best.matches
      } : null,
      playing: rows.filter(r => r.matches > 0).length
    };
  });
  const byBench = [...perGW].sort((a, b) => b.benchTotal - a.benchTotal);
  const byCaptain = [...perGW].sort((a, b) => (b.bestPlayer?.pred || 0) - (a.bestPlayer?.pred || 0));
  const byWeakest = [...perGW].sort((a, b) => a.xiTotal - b.xiTotal);
  return {
    range: {
      from: fromGW,
      to: endGW
    },
    perGW,
    used: usedSet,
    // які чипи вже зіграні в цьому комплекті
    usedInfo,
    // у яких турах кожен чип грався (за весь сезон)
    benchBoost: byBench[0],
    tripleCaptain: byCaptain[0],
    freeHit: byWeakest[0],
    // Wildcard: тур перед найгіршим відрізком (щоб перебудуватись завчасно)
    wildcard: (() => {
      // ковзне вікно з 3 турів — де сума найнижча
      let worst = null;
      for (let i = 0; i + 2 < perGW.length; i++) {
        const sum = perGW[i].xiTotal + perGW[i + 1].xiTotal + perGW[i + 2].xiTotal;
        if (!worst || sum < worst.sum) worst = {
          sum,
          startGW: perGW[i].gw,
          avg: sum / 3
        };
      }
      return worst;
    })()
  };
}

// ============================================================
// КАПІТАНСЬКИЙ РЕЙТИНГ
// Капітан подвоює очки, тому важливе не середнє, а ШАНС ВЕЛИКОГО УЛОВУ.
// Захисник, що бере 2 за появу + випадковий сухар, — поганий капітан,
// навіть якщо його середній прогноз не гірший за форварда.
// Рахуємо ймовірність "вибухового" туру (гол/асист + бонуси) за Пуассоном.
// ============================================================
function captainScore(player, teamsMap, fixtures, fromGW, weights) {
  const pred = predictPlayerPoints(player, teamsMap, fixtures, fromGW, 1, weights);
  if (!pred.fixtures.length) return {
    score: 0,
    pred: 0,
    haulProb: 0,
    xGI: 0
  };
  const pos = player.element_type;
  const xGI = pred.xG + pred.xA; // очікувана участь у голах
  const goalPts = GOAL_VALUE[pos];

  // Ймовірність хоча б одного голу або асиста (Пуассон)
  const pReturn = 1 - Math.exp(-xGI);
  // Ймовірність "хаулу" — двох+ результативних дій або гола з бонусами
  const pHaul = 1 - Math.exp(-xGI) * (1 + xGI);

  // Очікувані очки саме від атаки — це те, що подвоюється найцінніше
  const attackingPts = pred.xG * goalPts + pred.xA * 3;

  // Хвилини критичні: капітан на лавці = 0 очок ×2
  const minsRisk = Math.min(1, (pred.expMins || 0) / 75);

  // Капітанський рейтинг будуємо ПЕРЕВАЖНО на атакувальному потенціалі:
  // подвоюються будь-які очки, але великий улов дають майже завжди голи
  // й асисти. Гарантовані 2 за появу подвоїти приємно, та це не привід
  // віддавати пов'язку захиснику середняка.
  // Внесок "негольових" очок (поява, сухар, бонуси) беремо з коефіцієнтом,
  // бо вони мало відрізняються між гравцями і не створюють переваги.
  const baselinePts = Math.max(0, pred.total - attackingPts);
  const positionBias = pos === 4 ? 1.0 : pos === 3 ? 0.95 : 0.55; // захисники/воротарі рідко "вибухають"
  const score = (attackingPts * 2.2 + pHaul * 3.0 + baselinePts * 0.45) * positionBias * minsRisk;
  return {
    score,
    pred: pred.total,
    haulProb: pHaul,
    returnProb: pReturn,
    xGI,
    expMins: pred.expMins,
    fixtures: pred.fixtures
  };
}

// ============================================================
// РЕЙТИНГ ГРАВЦЯ ДЛЯ СКЛАДУ (трансфери, оптимізатор)
// На відміну від капітанського — тут важлива НАДІЙНІСТЬ на дистанції:
// стабільні хвилини, рівний календар без важких піків, доступність.
// ============================================================
function squadScore(player, teamsMap, fixtures, fromGW, gwsAhead, weights) {
  const pred = predictPlayerPoints(player, teamsMap, fixtures, fromGW, gwsAhead, weights);
  if (!pred.fixtures.length) return {
    score: 0,
    pred: 0,
    avgFDR: 3,
    minsRisk: 0,
    worstRun: 0
  };
  const fdrs = pred.fixtures.map(f => f.difficulty ?? 3);
  const avgFDR = fdrs.reduce((s, v) => s + v, 0) / fdrs.length;
  // Найважчий відрізок із двох матчів поспіль (щоб ловити провали в календарі)
  let worstRun = 0;
  for (let i = 0; i + 1 < fdrs.length; i++) worstRun = Math.max(worstRun, (fdrs[i] + fdrs[i + 1]) / 2);
  if (fdrs.length === 1) worstRun = fdrs[0];

  // Ризик хвилин: гравець, що виходить на 60 хв, менш цінний за того, хто грає 90
  const minsRisk = Math.min(1, (pred.expMins || 0) / 80);
  // Доступність (травми/дискваліфікації) вже врахована в прогнозі, але
  // для складу штрафуємо сильніше — травмований гравець ламає всю структуру
  const availPenalty = player.status === 'a' ? 1 : (player.chance_of_playing_next_round ?? 0) / 100 * 0.8;

  // Рівність календаря: якщо серед матчів є дуже важкий відрізок — мінус
  const runPenalty = 1 - Math.max(0, (worstRun - 3) * 0.06);
  const score = pred.total * minsRisk * availPenalty * runPenalty;
  return {
    score,
    pred: pred.total,
    avgFDR,
    worstRun,
    minsRisk,
    expMins: pred.expMins,
    xGI: pred.xG + pred.xA
  };
}

// ============================================================
// ОПТИМІЗАТОР СКЛАДУ
// Шукає 15 гравців (2 ВРТ / 5 ЗАХ / 5 ПІВ / 3 НАП) у межах бюджету й ліміту
// на клуб, які дають максимум очікуваних очок СТАРТОВОЇ одинадцятки
// (плюс невелика вага лавки, щоб там сиділи ті, хто реально грає).
// Метод: стартуємо з найвигідніших за "очки на £", далі локальний пошук —
// одиночні та парні заміни, поки склад покращується. На відміну від старої
// жадібної версії, не кидає гроші в банку і завжди добирає всіх 15.
// ============================================================
const BENCH_WEIGHTS = [0.30, 0.15, 0.06]; // 1-й, 2-й, 3-й запасний: перший виходить доволі часто
const BENCH_GK_WEIGHT = 0.03; // запасний воротар майже ніколи не грає

// Найкраща одинадцятка з 15: 1 ВРТ, мінімум 3 ЗАХ / 2 ПІВ / 1 НАП, решта — найсильніші
function pickBestXI(squad) {
  const by = {
    1: [],
    2: [],
    3: [],
    4: []
  };
  for (const p of squad) by[p.element_type].push(p);
  for (const pos in by) by[pos].sort((x, y) => y.predScore - x.predScore);
  if (by[1].length < 1 || by[2].length < 3 || by[3].length < 2 || by[4].length < 1) return null;
  const xi = [by[1][0], ...by[2].slice(0, 3), ...by[3].slice(0, 2), by[4][0]];
  const rest = [...by[2].slice(3), ...by[3].slice(2), ...by[4].slice(1)].sort((x, y) => y.predScore - x.predScore);
  xi.push(...rest.slice(0, 4));
  const ids = new Set(xi.map(p => p.id));
  const bench = squad.filter(p => !ids.has(p.id)).sort((x, y) => (x.element_type === 1) - (y.element_type === 1) || y.predScore - x.predScore);
  const xiScore = xi.reduce((s, p) => s + p.predScore, 0);
  let bi = 0;
  const value = xiScore + bench.reduce((s, p) => s + p.predScore * (p.element_type === 1 ? BENCH_GK_WEIGHT : BENCH_WEIGHTS[bi++] || 0.05), 0);
  const cnt = pos => xi.filter(p => p.element_type === pos).length;
  return {
    xi: xi.sort((x, y) => x.element_type - y.element_type || y.predScore - x.predScore),
    bench,
    xiScore,
    value,
    formation: [1, cnt(2), cnt(3), cnt(4)]
  };
}
function optimizeSquad(players, teamsMap, fixtures, fromGW, options = {}) {
  const {
    budget = 1000,
    maxPerTeam = 3,
    horizon = 5,
    weights = {
      form: 1.0,
      fdr: 0.5,
      value: 0.0,
      minutes: 1.0
    },
    seasonEnded = false
  } = options;

  // 1) Оцінка кожного гравця на горизонт
  const scored = players.filter(p => p.status !== 'u').map(p => {
    let score;
    if (seasonEnded) {
      score = (p.total_points || 0) + (parseFloat(p.form) || 0) * 5;
    } else {
      // надійність на дистанції: ризик старту, травми, провали календаря
      score = squadScore(p, teamsMap, fixtures, fromGW, horizon, weights).score;
    }
    if (!Number.isFinite(score) || score < 0) score = 0;
    return {
      ...p,
      predScore: score
    };
  });

  // 2) Пул кандидатів на позицію: найсильніші + найвигідніші + найдешевші
  //    (дешеві потрібні, щоб склад завжди можна було добрати під бюджет)
  const pool = {
    1: [],
    2: [],
    3: [],
    4: []
  };
  for (const pos of [1, 2, 3, 4]) {
    const all = scored.filter(p => p.element_type === pos);
    const pick = new Map();
    const add = arr => arr.forEach(p => pick.set(p.id, p));
    add([...all].sort((x, y) => y.predScore - x.predScore).slice(0, 45));
    add([...all].sort((x, y) => y.predScore / y.now_cost - x.predScore / x.now_cost).slice(0, 25));
    add([...all].sort((x, y) => x.now_cost - y.now_cost || y.predScore - x.predScore).slice(0, 12));
    pool[pos] = [...pick.values()].sort((x, y) => y.predScore - x.predScore);
  }

  // 3) Стартовий склад: найдешевші допустимі (гарантовано влазить у бюджет, якщо це взагалі можливо)
  const squad = [];

// ============================================================
// EXPECTED POINTS (xP) — used in player history chart
// ============================================================
// Compute expected points for a single gameweek from underlying stats.
function expectedPointsForGW(pos, gw) {
  // gw: { minutes, expected_goals, expected_assists, expected_goals_conceded }
  const mins = gw.minutes || 0;
  if (mins === 0) return 0;
  const xG = parseFloat(gw.expected_goals) || 0;
  const xA = parseFloat(gw.expected_assists) || 0;
  const xGC = parseFloat(gw.expected_goals_conceded) || 0;
  const goalVal = pos === 4 ? 4 : pos === 3 ? 5 : 6; // FWD/MID/DEF-GK
  const csVal = pos === 1 || pos === 2 ? 4 : pos === 3 ? 1 : 0;
  const appearance = mins >= 60 ? 2 : 1;
  // Clean sheet probability ~ Poisson P(0 conceded) = e^-xGC (only counts if played 60+)
  const csProb = mins >= 60 ? Math.exp(-xGC) : 0;
  // GK/DEF also lose ~0.33 pt per 2 goals conceded (approx)
  const concededPenalty = pos === 1 || pos === 2 ? -(xGC / 2) * 0.5 : 0;
  return appearance + xG * goalVal + xA * 3 + csProb * csVal + concededPenalty;
}
